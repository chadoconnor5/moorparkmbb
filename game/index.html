<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Moorpark MBB — Game Tracker</title>
<!--
  LIVE GAME TRACKER
  Built from the practice tracker's engine (same event log, lineup stints, stat lines and
  rating formulas) with everything a live game can't afford taken out: no film, no shot
  locations, no shot types, no shot clock.

  OFFLINE: this file is fully self-contained - no CDN, no fonts, no network calls are needed
  to track a game. Data lives in this browser (localStorage; scouting PDFs in IndexedDB).
  Served from GitHub Pages it also registers sw.js, so after one visit online it opens with
  wifi off. Opened straight from disk (file://) it works as-is.
-->
<style>
/* Quiet, broadcast-style dark theme: one neutral ramp, two team colours used sparingly,
   colour reserved for meaning (team, make/miss, warnings) rather than decoration. */
:root{
  --bg:#0d0f14; --surface:#14171e; --card:#1a1e26; --card2:#222731; --hover:#262c37;
  --border:rgba(255,255,255,.06); --border2:rgba(255,255,255,.11);
  --primary:#7c93e6; --primary-bg:rgba(124,147,230,.14);
  /* Moorpark: the Columbia blue from the leaderboard. */
  --us:#4fc3f7; --us-d:#2b8fc0; --us-bg:rgba(79,195,247,.12);
  --them:#e0a26f; --them-d:#9a6436; --them-bg:rgba(224,162,111,.12); --them-text:#fdba74; --them-hdr:#3d1f0a;
  --good:#5cbf95; --bad:#e2736d; --warn:#dcb05a; --info:#7fb5d6; --purple:#9d8fe0; --gold:#d8b860;
  --text:#f8fafc; --text2:#d5dae3; --muted:#a3acbb;
  --r:10px; --rl:14px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Inter,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--card2);padding:1px 5px;border-radius:4px}
table{border-collapse:collapse}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

/* nav */
.nav{position:sticky;top:0;z-index:50;height:52px;background:rgba(13,15,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-in{max-width:1320px;height:100%;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.brand{font-weight:700;font-size:15px;margin-right:14px;white-space:nowrap;letter-spacing:-.01em}
.brand span{color:var(--muted);font-weight:500}
.tab{padding:7px 11px;border-radius:8px;font-weight:500;color:var(--muted);white-space:nowrap;font-size:13.5px}
.tab:hover{color:var(--text)}
.tab.active{background:var(--card2);color:var(--text)}
.tab.scout-tab.active{background:var(--primary-bg);color:var(--primary)}
.nav-right{margin-left:auto;display:flex;gap:2px;align-items:center}
.offline-dot{font-size:11px;padding:3px 9px;border-radius:99px;color:var(--muted);white-space:nowrap;margin-left:6px;background:var(--card)}
.offline-dot::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.offline-dot.ready::before{background:var(--good)}

.page{padding:14px 16px 40px;max-width:1320px;margin:0 auto}
.page.narrow{max-width:860px}
.page.mid{max-width:1120px}
.page-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;font-weight:600;background:var(--card2);border:1px solid var(--border2);white-space:nowrap;font-size:13.5px;transition:background .12s}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:transparent;color:#0d0f14}
.btn-primary:hover{background:#90a4ec}
.btn-good{background:var(--us);border-color:transparent;color:#06222f}
.btn-good:hover{background:#73d0f9}
.btn-bad{background:transparent;border-color:rgba(226,115,109,.45);color:var(--bad)}
.btn-bad:hover{background:rgba(226,115,109,.1)}
.btn-warn{background:transparent;border-color:rgba(220,176,90,.45);color:var(--warn)}
.btn-warn:hover{background:rgba(220,176,90,.1)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn-lg{padding:12px 20px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:14px}
.card h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .muted{text-transform:none;letter-spacing:0;font-weight:400}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr!important}}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}

/* toast */
#toasts{position:fixed;bottom:16px;left:16px;z-index:300;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.toast{background:rgba(34,39,49,.96);border:1px solid var(--border2);padding:7px 14px;border-radius:99px;font-weight:500;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;backdrop-filter:blur(8px)}
.toast.good::before,.toast.bad::before,.toast.warn::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:1px}
.toast.good::before{background:var(--good)} .toast.bad::before{background:var(--bad)} .toast.warn::before{background:var(--warn)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(5,6,9,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:600px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{font-size:18px;font-weight:700;margin-bottom:12px;letter-spacing:-.01em}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* scoreboard */
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:10px 22px;margin-bottom:8px}
.sb-team{display:flex;align-items:center;gap:18px}
.sb-team.a{justify-content:flex-end;text-align:right}
.sb-team.b{justify-content:flex-start;text-align:left}
.sb-id{display:flex;flex-direction:column;gap:5px}
.sb-team.a .sb-id{align-items:flex-end} .sb-team.b .sb-id{align-items:flex-start}
.sb-name{font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.sb-name::before{content:'';width:8px;height:8px;border-radius:50%}
.sb-team.a .sb-name::before{background:var(--us)} .sb-team.b .sb-name::before{background:var(--them)}
.sb-score{font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:72px}
.sb-team.a .sb-score{text-align:right}
.sb-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text2);align-items:center}
.sb-team.a .sb-meta{justify-content:flex-end}
.sb-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:170px;padding:0 26px;border-left:1px solid var(--border);border-right:1px solid var(--border);margin:0 26px}
.sb-period{font-weight:600;color:#fff;text-transform:uppercase;font-size:11px;letter-spacing:.12em}
.sb-clock{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.01em}
.sb-cap{font-size:10.5px;color:var(--muted)}
.sb-settime{margin-top:4px;padding:4px 10px;font-size:12px}
.to-dots{display:inline-flex;gap:3px;align-items:center}
.to-dot{width:7px;height:7px;border-radius:50%;background:var(--text2)}
.to-dot.full{border-radius:2px;width:9px}
.to-dot.used{background:transparent;border:1px solid var(--border2)}
.bonus{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(220,176,90,.16);color:var(--warn);letter-spacing:.04em}
.bonus.dbl{background:rgba(226,115,109,.16);color:var(--bad)}
.kills{display:inline-flex;align-items:center;gap:4px;color:var(--text2)}
.kills b{font-size:13px;color:var(--text);margin-right:2px}
.kpip{width:7px;height:7px;border-radius:2px;background:var(--card2);display:inline-block}
.kpip.on{background:var(--gold)}

.levbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;font-size:12.5px;color:var(--text2)}
.lev{font-weight:700;padding:2px 8px;border-radius:6px;font-size:11px;letter-spacing:.05em}
.lev-high{background:rgba(226,115,109,.16);color:#efa29d} .lev-med{background:rgba(220,176,90,.15);color:var(--warn)} .lev-low{background:var(--card2);color:var(--text2)}
.lev-comp{background:rgba(220,140,90,.18);color:#efb48a} .lev-clutch{background:rgba(216,184,96,.2);color:var(--gold)} .lev-gt{background:var(--card2);color:var(--muted)}
.gt-meter{width:160px;height:5px;border-radius:9px;background:var(--card2);overflow:hidden}
.gt-meter > div{height:100%;background:var(--warn)}

/* tracker layout */
.tracker{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,340px) minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:1000px){.tracker{grid-template-columns:1fr 1fr}.stat-col{grid-column:1 / -1;order:-1}}
.col{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:10px;display:flex;flex-direction:column;gap:7px}
.col-head{min-height:36px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center;color:#fff;padding:2px 2px 4px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.pgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.col{min-width:0}
.pbtn{min-width:0;position:relative;text-align:left;padding:9px 14px;border-radius:11px;background:var(--card);border:1px solid var(--border);font-weight:600;font-size:15.5px;min-height:54px;display:flex;flex-direction:column;justify-content:center;transition:background .1s,opacity .12s,box-shadow .12s}
.col.a .pbtn{box-shadow:inset 3px 0 0 var(--us-d)}
.col.b .pbtn{box-shadow:inset 3px 0 0 var(--them-d)}
.pbtn:hover{background:var(--hover)}
.pnum{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.pbtn .pname{display:flex;align-items:baseline;gap:8px;min-width:0;padding-right:44px}
.pbtn .plabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.pbtn .onote{font-size:11.5px;font-weight:500;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.pbtn.team .pname{padding-right:0}
.pbtn .pline{font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
.pbtn .pf{position:absolute;top:8px;right:10px;font-size:10.5px;font-weight:600;color:var(--muted)}
.pbtn .pf.f-trouble{background:#ff1f1f;color:#fff;font-weight:900;padding:2px 7px;border-radius:5px;top:6px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.pbtn.team{min-height:40px;font-size:13px;color:var(--text2);background:transparent;border-style:dashed;box-shadow:none!important}
.pbtn.dim{opacity:.22;pointer-events:none}
.pbtn.hot{background:var(--card2);border-color:var(--border2)}
.abandon-link{align-self:center;margin-top:6px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 8px}
.abandon-link:hover{color:var(--bad)}
.skipbig{width:100%;padding:12px;font-size:15px}
.bench-mini{font-size:11.5px;color:var(--muted);padding:2px}
.lpm{background:var(--card);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;margin-top:6px}
.lpm2{display:grid;gap:6px}
.lpm2.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.lpm2.two .lpm{padding:8px 10px}
.lpm2.two .lpm-row{font-size:12.5px}
.lpm2.two .lpm-head{letter-spacing:.06em}
.lpm-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin:2px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.lpm-stats div{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.lpm-stats span{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lpm-stats b{font-size:13.5px;font-variant-numeric:tabular-nums}
.lpm-stats b.pos{color:var(--good)} .lpm-stats b.neg{color:var(--bad)}
.sub-sides{display:grid;grid-template-columns:1fr;gap:18px}
.sub-sides.two{grid-template-columns:1fr 1fr}
@media (max-width:760px){.sub-sides.two{grid-template-columns:1fr}}
.sub-sides .sub-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.sub-team{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sub-team.a{color:var(--us)} .sub-team.b{color:var(--them-text)}
.lpm-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#fff;padding-bottom:5px;margin-bottom:2px;border-bottom:1px solid var(--border)}
.lpm-head .lpm-val{font-size:15px;letter-spacing:0}
.lpm-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.lpm-name{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpm-val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.lpm-val.pos{color:var(--good)} .lpm-val.neg{color:var(--bad)}
.lpm-bench{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:5px;padding-top:6px;border-top:1px solid var(--border)}

.stat-col .sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stat-col .sgrid .sbtn{grid-column:span 3}
.stat-col .sgrid .sb-foul,.stat-col .sgrid .sb-offf,.stat-col .sgrid .sb-chg{grid-column:span 2}
.sbtn{padding:12px 6px;border-radius:10px;font-weight:700;font-size:14.5px;color:#fff;border:none;transition:filter .1s,opacity .12s;text-align:center}
.sbtn:hover{filter:brightness(1.15)}
/* The practice tracker's swatches, button for button: every stat its own solid colour so the
   grid reads at a glance from arm's length. Off Foul (game-only) gets a colour of its own. */
.sb-2fg_make{background:#1e40af} .sb-2fg_miss{background:#9f1239}
.sb-3fg_make{background:#b45309} .sb-3fg_miss{background:#5b21b6}
.sb-ft_make{background:#155e75}  .sb-ft_miss{background:#701a75}
.sb-dreb{background:#134e4a}     .sb-oreb{background:#431407}
.sb-ast{background:#3b0764}      .sb-tov{background:#450a0a}
.sb-blk{background:#172554}      .sb-stl{background:#422006}
.sb-foul{background:#1e3a5f}     .sb-offf{background:#3f6212}     .sb-chg{background:#0f5132}
.sbtn.dim{opacity:.2;pointer-events:none}
.sbtn.on{outline:2px solid #fff;outline-offset:1px;opacity:1}
.status{min-height:44px;padding:8px 12px;border-radius:11px;background:var(--card);font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text2);text-align:center;justify-content:center}
.status.wait{background:var(--primary-bg);color:var(--text);justify-content:space-between;text-align:left}
.ctrls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ctrls .btn{padding:10px 6px}
.feed{font-size:12px;max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--border);padding-top:6px}
.feed div{padding:4px 8px;border-radius:6px;color:var(--text2)}
.feed .a{border-left:2px solid var(--us-d)} .feed .b{border-left:2px solid var(--them-d)}
.feed .s{color:var(--muted)}
.banner{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);padding:22px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center}
.banner h2{font-size:18px;font-weight:600;width:100%}

/* sub / clock modals */
.sub-sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#fff;margin:16px 0 8px}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.sub-p{padding:11px 12px;border-radius:11px;background:var(--card);border:1px solid var(--border);font-weight:600;text-align:left;min-height:54px;transition:background .1s}
.sub-p:hover{background:var(--hover)}
.sub-p .pnum{color:var(--muted);font-weight:500;margin-right:4px}
.sub-p .tiny{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.sub-p.out{border-color:rgba(226,115,109,.5);background:rgba(226,115,109,.08)}
.sub-p.pending{border-color:var(--warn);background:rgba(220,176,90,.1)}
.sub-p.in{border-color:rgba(92,191,149,.55);background:rgba(92,191,149,.08)}
.sub-p:disabled{opacity:.3}
.sub-bench.waiting .sub-p:not(:disabled){border-color:rgba(92,191,149,.45)}
.pairs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pair{background:var(--card);border-radius:99px;padding:4px 6px 4px 12px;font-weight:500;display:flex;gap:8px;align-items:center;font-size:13px}
.pair b.o{color:var(--bad);font-weight:600} .pair b.i{color:var(--good);font-weight:600}
.clockin{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;justify-content:center;background:var(--card);border-radius:12px;padding:14px}
.clockin input{font-size:30px;font-weight:600;width:150px;text-align:center;font-variant-numeric:tabular-nums;padding:8px;background:var(--surface)}
.clockin input.need{border-color:rgba(226,115,109,.6)}
.keypad{display:grid;grid-template-columns:repeat(3,54px);gap:6px}
.keypad button{height:42px;border-radius:9px;background:var(--card2);font-weight:600;font-size:17px}
.keypad button:hover{background:var(--hover)}
.clk-prev{font-weight:500;margin-top:8px;font-size:13px;color:var(--text2);text-align:center}
.clk-err{color:var(--bad);font-weight:500;margin-top:4px;font-size:12.5px;text-align:center;max-width:220px}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
.tbl{width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{background:var(--card);color:#fff;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:8px 9px;text-align:right;white-space:nowrap;position:sticky;top:0}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 9px;text-align:right;border-top:1px solid var(--border);white-space:nowrap}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.tbl tr.tot td{font-weight:600;background:var(--card)}
.tbl tr.cur td{background:var(--primary-bg)}
.tbl tr.dnp td{color:var(--muted)}
.tbl th.grp{text-align:center;border-left:1px solid var(--border2)}
.tbl td.gl{border-left:1px solid var(--border2)}
.tbl td.l{text-align:left}

/* Typed clock: "12:34", "1234" -> 12:34, "934" -> 9:34, "45" -> 0:45. Digits-only is the fast
   path on a keypad; the preview under the box shows how it was read so a slip is visible. */
function parseClock(str) {
  str = String(str || '').trim();
  if (!str) return null;
  let m = str.match(/^(\d{1,2}):(\d{1,2})(?:\.\d+)?$/);
  if (m) { if (+m[2] >= 60) return null; return +m[1] * 60 + +m[2]; }
  if (!/^\d{1,4}$/.test(str)) return null;
  if (str.length <= 2) return +str;
  const mm = +str.slice(0, -2), ss = +str.slice(-2);
  if (ss >= 60) return null;

/* ════════════════════════════════════════════════════════════
   GAME MODEL
   Same shape as a practice-tracker session (teamAName/B, startersA, quarters, eventLog,
   lineupSegments, teamStats, playerStats, finalScore) so games can feed the same analysis.
   Team 'a' is always Moorpark, 'b' the opponent. Only Moorpark's lineups are tracked.
════════════════════════════════════════════════════════════ */
function periodDur(g, q) { return q <= g.format.periods ? g.format.periodLen : g.format.otLen; }

function periodName(g, q, short) {
  const P = g.format.periods;
  if (q <= P) {
    if (P === 2) return short ? (q === 1 ? '1H' : '2H') : (q === 1 ? '1st Half' : '2nd Half');
    return short ? 'Q' + q : 'Quarter ' + q;
  }
  const n = q - P;
  return short ? (n === 1 ? 'OT' : n + 'OT') : (n === 1 ? 'Overtime' : n + 'nd OT'.replace('nd', n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'));
}
function oppHasRoster(g) { return (g.oppRoster || []).length > 0; }
function teamName(g, t) { return t === 'a' ? g.teamAName : g.teamBName; }
function nextId(g) { g.nextId = (g.nextId || g.eventLog.length) + 1; return g.nextId; }
const isStat = e => e && !e.type;
function evPts(e) { return e.stat === '2fg_make' ? 2 : e.stat === '3fg_make' ? 3 : e.stat === 'ft_make' ? 1 : 0; }
function score(g, t, pred) {
  let p = 0;
  for (const e of g.eventLog) if (isStat(e) && e.team === t && (!pred || pred(e))) p += evPts(e);
  return p;
}
function finalScore(g) {
  const o = g.finalScore;
  return o && o.override ? { a: o.a, b: o.b } : { a: score(g, 'a'), b: score(g, 'b') };
}
/* Subs carry a team on each swap (Moorpark 'a', the opponent 'b'). Every lineup replay
   applies only its own team's swaps. */
const subTeam = (s, e) => s.team || e.team || 'a';
function applySubs(lu, e, t) {
  for (const s of e.subs || []) { if (subTeam(s, e) !== t) continue; const i = lu.indexOf(s.playerOut); if (i !== -1) lu[i] = s.playerIn; }
}

   point their lineup is unknown and counts for nothing. */
function lineupStart(g, t, i) {
  if (t === 'a') return i === 0 ? [...(g.startersA || [])] : null;
  return i === (g.oppTrackIdx || 0) ? [...(g.startersB || [])] : null;
}
function currentLineup(g, t = 'a') {
  let lu = t === 'b' && (g.oppTrackIdx || 0) > 0 ? [] : [...((t === 'a' ? g.startersA : g.startersB) || [])];
  if (t === 'b' && (g.oppTrackIdx || 0) >= g.eventLog.length && (g.oppTrackIdx || 0) > 0) return [...(g.startersB || [])];
  g.eventLog.forEach((e, i) => { const st = i > 0 ? lineupStart(g, t, i) : null; if (st && t === 'b') lu = st; if (e.type === 'sub') applySubs(lu, e, t); });

/* Their lineups are tracked once their five has been set (needs their roster). */
function oppTracked(g) { return oppHasRoster(g) && (g.startersB || []).length === 5; }

function teamPlayers(g, t) {
  if (t === 'b') return (g.oppRoster || []).slice();
  const set = new Set([...(g.dressedA || []), ...(g.startersA || [])]);
  for (const e of g.eventLog) {
    if (e.type === 'sub') { for (const s of e.subs || []) if (subTeam(s, e) === 'a') { set.add(s.playerIn); set.add(s.playerOut); } }
    else if (isStat(e) && e.team === 'a' && e.player !== TEAM) set.add(e.player);
  }
  return [...set];

/* ── Clock ──
   Optional running clock. Nothing depends on it running: every sub and timeout DEMANDS the
   clock, and those typed times are the anchors the analytics read the game clock from. When
   it is running, each stat event is stamped with it as well, which only sharpens the same
   reading. */
function clockNow(g) {
  const c = g.clock;
  if (!c.running) return c.rem;
  return Math.max(0, c.anchorRem - (Date.now() - c.anchorMs) / 1000);
}
function clockSet(g, secs) {
  const c = g.clock;
  c.rem = secs;
  if (c.running) { c.anchorRem = secs; c.anchorMs = Date.now(); }
}
function clockStop(g) { const c = g.clock; c.rem = clockNow(g); c.running = false; }
function clockToggle() {
  const g = liveGame(); if (!g || g.between) return;
  const c = g.clock;
  if (c.running) clockStop(g);
  else if (c.rem > 0) { c.running = true; c.anchorMs = Date.now(); c.anchorRem = c.rem; }
  saveGames(); paintScorebar();
}

/* ════════════════════════════════════════════════════════════
   UNDO / REDO — whole-game snapshots. A game is small, and a snapshot can never disagree
   with itself the way a hand-written inverse of every action eventually does.
════════════════════════════════════════════════════════════ */
const undoStack = [], redoStack = [];
function snapshot() {
  const g = liveGame(); if (!g) return;
  undoStack.push(JSON.stringify(g));
  if (undoStack.length > 300) undoStack.shift();
  redoStack.length = 0;
}
function swapGame(json) {
  const g = liveGame();
  const next = JSON.parse(json);
  /* The clock is live state, not a record: keep it running through an undo unless the undo
     crosses a period boundary, where the restored clock is the right one. */
  if (g && next.quarters.length === g.quarters.length && next.between === g.between) next.clock = g.clock;
  const i = App.games.findIndex(x => x.id === next.id);
  if (i !== -1) App.games[i] = next;
  saveGames();
}
function undo() {
  const g = liveGame(); if (!g) return;
  if (F.phase !== 'idle') { cancelFlow(); return; }
  if (!undoStack.length) { toast('Nothing to undo'); return; }
  redoStack.push(JSON.stringify(g));
  swapGame(undoStack.pop());
  toast('Undone', 'warn'); render();
}
function redo() {
  const g = liveGame(); if (!g || !redoStack.length) return;
  undoStack.push(JSON.stringify(g));
  swapGame(redoStack.pop());
  toast('Redone'); render();
}

/* ════════════════════════════════════════════════════════════
   ENTRY FLOW — the practice tracker's state machine, minus zones / shot types / film.
   Tap a stat, then the player(s). Steps that are decided by the play itself (who can block,

    const m = p.a - p.b;
    leadA = Math.max(leadA, m); leadB = Math.max(leadB, -m);
    const leader = m > 0 ? 'a' : m < 0 ? 'b' : 'tie';
    if (leader === 'tie') ties++;
    else { if (lastLeader && lastLeader !== leader) changes++; lastLeader = leader; }
    if (run.team === p.team) run[p.team] += p.v; else run = { team: p.team, a: p.team === 'a' ? p.v : 0, b: p.team === 'b' ? p.v : 0 };
    bestRun[p.team] = Math.max(bestRun[p.team], run[p.team]);
  }
  return { pts, leadA, leadB, changes, ties, run, bestRun };
}
/* KILLSHOTS — unanswered runs, tracked silently (no live alert). A run is every point one
   side scores before the other side scores again; it carries across the half like kills
   do. A run that reaches 10 is a killshot; 15 and 20 are counted on top of it, so a 22-0
   run is one killshot, one 15-0 and one 20-0. */
const RUN_MARKS = [10, 15, 20];
function scoringRuns(g, qf) {
  const runs = []; let cur = null; let a = 0, b = 0;
  const L = lineupAtEach(g);
  g.eventLog.forEach((e, i) => {
    if (!isStat(e)) return;
    const v = evPts(e); if (!v) return;
    if (!cur || cur.team !== e.team) {
      cur = { team: e.team, pts: 0, startA: a, startB: b, startIdx: i, startQ: e.quarter, lineup: L[i] };
      runs.push(cur);
    }
    cur.pts += v; cur.endIdx = i; cur.endQ = e.quarter;
    if (e.team === 'a') a += v; else b += v;
    cur.endA = a; cur.endB = b;
  });
  return runs.filter(r => r.pts >= RUN_MARKS[0] && (qf == null || r.startQ === qf || r.endQ === qf));
}
function killshotCounts(g, qf) {
  const c = { a: { 10: 0, 15: 0, 20: 0 }, b: { 10: 0, 15: 0, 20: 0 } };
  for (const r of scoringRuns(g, qf)) for (const m of RUN_MARKS) if (r.pts >= m) c[r.team][m]++;
  return c;
}

/* Empty trips in a row for a team, most recent first. */
function drought(g, t) {
  const A = analyzeTrips(g); let n = 0;
  for (let k = A.trips.length - 1; k >= 0; k--) {
    const tr = A.trips[k]; if (tr.team !== t) continue;
    if (tr.pts > 0) break; n++;
  }
  return n;
}

/* ════════════════════════════════════════════════════════════
   SCOUTING REPORT — PDFs kept in IndexedDB on this device, so they open with no network.
════════════════════════════════════════════════════════════ */
const IDB_NAME = 'gt_files';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbPut(key, val) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(val, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(key) { const db = await idb(); return new Promise((res, rej) => { const r = db.transaction('files').objectStore('files').get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbDel(key) { const db = await idb(); return new Promise(res => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').delete(key); tx.oncomplete = res; }); }
async function idbKeys() { const db = await idb(); return new Promise(res => { const r = db.transaction('files').objectStore('files').getAllKeys(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); }

function describe(g, e) {

  return `<div class="keypad">${k.map(x => `<button data-act="key" data-k="${x}" data-target="${target}">${x}</button>`).join('')}</div>`;
}
function keyPress(target, k) {
  const el = document.getElementById(target); if (!el) return;
  let v = el.value.replace(/[^\d]/g, '');
  if (k === 'C') v = ''; else if (k === '⌫') v = v.slice(0, -1); else if (v.length < 4) v += k;
  el.value = v;
  el.dispatchEvent(new Event('input'));
}

/* ── TIMEOUT ── */
const TO = { team: 'a', type: 'full' };
function openTimeout() {
  const g = liveGame(); if (!g) return;
  if (F.phase !== 'idle') commitStaged();
  if (g.clock.running) clockStop(g);
  TO.team = 'a'; TO.type = timeoutsLeft(g, 'a').full > 0 ? 'full' : '30';
  $('#modal-root').innerHTML = `<div class="overlay" data-act="overlay"><div class="modal">
    <h2>Timeout — ${periodName(g, curPeriod(g))}</h2>
    <div id="to-body"></div>
    <div class="clockin" style="margin-top:10px">
      <div><div class="sub-sec" style="margin-top:0">Time left — required</div>
        <input id="to-clock" inputmode="numeric" autocomplete="off" placeholder="mm:ss" value="${g.clock.rem > 0 && g.clock.rem < periodDur(g, curPeriod(g)) ? fmtClock(g.clock.rem).replace(':', '') : ''}">
        <div class="clk-prev" id="to-prev"></div></div>
      ${keypadHtml('to-clock')}
    </div>
    <div class="modal-foot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn btn-warn btn-lg" data-act="to-confirm">Confirm timeout ⏎</button></div>
  </div></div>`;
  paintTO();
  const ci = $('#to-clock');
  const pv = () => { const t = parseClock(ci.value); $('#to-prev').textContent = t == null ? '' : '= ' + fmtClock(t); ci.classList.toggle('need', t == null); };
  ci.addEventListener('input', pv); pv();
  ci.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmTimeout(); } });
  ci.focus(); ci.select();   // a prefilled time is replaced by the first keystroke, not appended to
}
function paintTO() {
  const g = liveGame();
  const b = (t) => { const L = timeoutsLeft(g, t); return `<button class="btn btn-lg ${TO.team === t ? 'btn-primary' : ''}" data-act="to-team" data-team="${t}" style="flex:1">${esc(teamName(g, t))}<span class="tiny" style="display:block;font-weight:600">${L.s30} × 30s · ${L.full} full left</span></button>`; };
  const L = timeoutsLeft(g, TO.team);
  $('#to-body').innerHTML = `<div class="row">${b('a')}${b('b')}</div>
    <div class="row" style="margin-top:8px">
      <button class="btn btn-lg ${TO.type === 'full' ? 'btn-primary' : ''}" data-act="to-type" data-type="full" style="flex:1" ${L.full <= 0 ? 'disabled' : ''}>Full (${L.full} left)</button>
      <button class="btn btn-lg ${TO.type === '30' ? 'btn-primary' : ''}" data-act="to-type" data-type="30" style="flex:1" ${L.s30 <= 0 ? 'disabled' : ''}>30 second (${L.s30} left)</button>
    </div>`;  const ci = $('#to-clock'); if (ci) { ci.focus(); ci.select(); }   // keep typing going after a tap
}
function confirmTimeout() {
  const g = liveGame(); if (!g) return;
  const t = parseClock($('#to-clock').value);
  if (t == null) { toast('Enter the time left on the clock', 'bad'); return; }
  const q = curPeriod(g);
  if (t > periodDur(g, q)) { toast('More than the period length', 'bad'); return; }
  const L = timeoutsLeft(g, TO.team);
  if ((TO.type === '30' ? L.s30 : L.full) <= 0) { toast('No ' + (TO.type === '30' ? '30-second' : 'full') + ' timeouts left', 'bad'); return; }
  snapshot();
  g.eventLog.push({ id: nextId(g), type: 'timeout', team: TO.team, toType: TO.type, timeSecs: t, quarter: q, ts: Date.now() });
  clockStop(g); clockSet(g, t);
  saveGames(); closeModal();
  const L2 = timeoutsLeft(g, TO.team);
  toast(teamName(g, TO.team) + ' timeout · ' + L2.s30 + '×30 + ' + L2.full + ' full left', 'warn', 3000);
  render();
}

/* ── CLOCK SET ── */
function openSetClock() {
  const g = liveGame(); if (!g || g.between) return;
  $('#modal-root').innerHTML = `<div class="overlay" data-act="overlay"><div class="modal" style="max-width:420px">
    <h2>Set time — ${periodName(g, curPeriod(g))}</h2>
    <div class="small muted" style="margin-bottom:10px">Time left on the clock now. Updates minutes, leverage and the garbage-time check without waiting for a sub or timeout. Last entered: ${fmtClock(g.clock.rem)}.</div>
    <div class="clockin"><div><input id="sc-clock" inputmode="numeric" autocomplete="off" placeholder="mm:ss"><div class="clk-prev" id="sc-prev"></div><div class="clk-err" id="sc-err"></div></div>${keypadHtml('sc-clock')}</div>
    <div class="modal-foot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn btn-primary" data-act="sc-confirm">Set ⏎</button></div></div></div>`;
  const ci = $('#sc-clock');
  ci.addEventListener('input', () => { const t = parseClock(ci.value); $('#sc-prev').textContent = t == null ? '' : '= ' + fmtClock(t) + ' left'; $('#sc-err').textContent = t == null ? '' : (setClockError(g, t) || ''); });
  ci.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmSetClock(); } });
  ci.focus();
}
function setClockError(g, t) {
  if (t > periodDur(g, curPeriod(g))) return 'More than the period length';
  if (t > g.clock.rem) return 'The clock was last at ' + fmtClock(g.clock.rem) + ' — it can\'t go back up (Undo that entry if it was wrong)';
  return subClockError(g, t);
}
function confirmSetClock() {
  const g = liveGame(); const t = parseClock($('#sc-clock').value);
  if (t == null) { toast('Not a valid time', 'bad'); return; }
  const err = setClockError(g, t); if (err) { toast(err, 'bad', 3500); return; }
  snapshot();
  // Recorded as an anchor so the analytics' game clock benefits from it too.
  g.eventLog.push({ id: nextId(g), type: 'clock', timeSecs: t, quarter: curPeriod(g), ts: Date.now() });
  clockSet(g, t); saveGames(); closeModal(); render();
  // Answer the question it was opened for.
  const L = liveLeverage(g);
  toast(L.gt ? `${fmtClock(t)} — GARBAGE TIME (up ${L.lead})` : `${fmtClock(t)} — not garbage time: lead ${L.lead}, needs ${L.req}`, L.gt ? 'warn' : 'good', 4000);
}

/* ── END PERIOD / FINISH ── */
function openEndPeriod() {
  const g = liveGame(); if (!g || g.between) return;
  const q = curPeriod(g);
  $('#modal-root').innerHTML = `<div class="overlay" data-act="overlay"><div class="modal" style="max-width:460px">
    <h2>End ${periodName(g, q)}?</h2>
    <div class="small muted">Time left when it ended (normally 0:00).</div>
    <div class="clockin" style="margin-top:8px"><div><input id="ep-clock" inputmode="numeric" value="0:00" onfocus="this.select()" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmEndPeriod();}"><div class="clk-prev" id="ep-prev"></div></div></div>
    <div class="modal-foot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn btn-bad btn-lg" data-act="ep-confirm">End ${periodName(g, q)}</button></div></div></div>`;
}
function confirmEndPeriod() {
  const g = liveGame(); if (!g) return;
  const t = parseClock($('#ep-clock').value);
  const q = curPeriod(g), dur = periodDur(g, q);
  if (t == null || t > dur) { toast('Not a valid time', 'bad'); return; }
  const s = activeSeg(g);
  if (s && t > s.startTimeSecs) { toast('The last sub was at ' + fmtClock(s.startTimeSecs), 'bad'); return; }
  if (F.phase !== 'idle') commitStaged();
  window.scrollTo(0, 0);
  snapshot();
  closeActive(g, t);
  g.quarters.push({ number: q, duration: dur, playedDuration: dur - t, endedAt: Date.now(), timeRemaining: t });
  g.between = true;
  g.clock = { rem: 0, running: false, anchorMs: null, anchorRem: null };
  saveGames(); closeModal();
  toast('End of ' + periodName(g, q), 'good');
  render();
}
function finishGame() {
  const g = liveGame(); if (!g) return;
  if (!confirm('Finish the game and lock the final?')) return;
  snapshot();
  analyzeTrips(g);
  g.completed = true; g.completedAt = new Date().toISOString();
  g.teamStats = teamStats(g);
  g.playerStats = playerStats(g).map(r => Object.assign({}, r, { min: +r.min.toFixed(1) }));
  const fs = { a: score(g, 'a'), b: score(g, 'b') };
  g.finalScore = Object.assign({ setAt: g.completedAt }, fs);
  App.liveId = null; lsSet(LS_LIVE, null);
  App.viewId = g.id;
  saveGames();
  toast('Final: ' + g.teamAName + ' ' + fs.a + ', ' + g.teamBName + ' ' + fs.b, 'good', 4000);
  REP.scope = 'game';
  setTab('report');
}

/* ── ABANDON ──
   For a game set up wrong (wrong opponent, wrong starters, wrong date) or started badly:
   delete it outright - it never reaches the box scores, Games or Season - and land back
   on setup with what was chosen still filled in, so only the mistake needs fixing. */
function openAbandon() {
  const g = liveGame(); if (!g) return;
  if (F.phase !== 'idle') cancelFlow();
  const plays = g.eventLog.filter(isStat).length, subs = g.eventLog.filter(e => e.type === 'sub').length;
  $('#modal-root').innerHTML = `<div class="overlay" data-act="overlay"><div class="modal" style="max-width:480px">
    <h2>Abandon this game?</h2>
    <div style="color:var(--text2);line-height:1.6">${esc(g.title)} — ${esc(g.date || '')}<br>
      ${plays || subs ? `<b style="color:var(--bad)">${plays} play${plays === 1 ? '' : 's'}${subs ? ' and ' + subs + ' sub' + (subs === 1 ? '' : 's') : ''} will be deleted.</b>` : 'Nothing has been tracked yet.'}
      <br>It won't appear in Games, box scores or Season. You go back to setup with the opponent, date, roster and starters still filled in.</div>
    ${plays ? '<div class="small muted" style="margin-top:8px">Just a wrong play? Use Undo instead — this deletes the whole game.</div>' : ''}
    <div class="modal-foot"><button class="btn" data-act="close-modal">Keep the game</button><button class="btn btn-bad btn-lg" data-act="abandon-confirm">Abandon and start over</button></div></div></div>`;
}
function abandonGame() {
  const g = liveGame(); if (!g) return;
  setupDraft = { opponent: g.opponent || g.teamBName, date: g.date, site: g.site || 'home', conf: !!g.conference, scrim: !!g.scrimmage,
                 oppId: (oppByName(g.opponent || g.teamBName) || {}).id || null, scoutKey: g.scoutKey || null, scheduleId: g.scheduleId || null,
                 dressed: (g.dressedA || []).slice(), starters: (g.startersA || []).slice(), oppStarters: (g.startersB || []).slice() };
  App.games = App.games.filter(x => x.id !== g.id);
  App.liveId = null; lsSet(LS_LIVE, null);
  if (App.viewId === g.id) App.viewId = null;
  undoStack.length = 0; redoStack.length = 0; resetFlow();
  saveGames(); closeModal();
  toast('Game abandoned — fix the setup and create it again', 'warn', 3500);
  setTab('track');
}

function closeModal() { $('#modal-root').innerHTML = ''; }

/* ── BOX SCORE ── */
function gamePicker(g) {
  const games = [...App.games].sort((x, y) => (y.date || '').localeCompare(x.date || ''));
  return `<select data-act="pick-game">${games.map(x => `<option value="${x.id}" ${x.id === g.id ? 'selected' : ''}>${esc(x.date || '')} ${esc(x.title)}${x.id === App.liveId ? ' (LIVE)' : ''}</option>`).join('')}</select>`;
}
function periodPicker(g) {
  const n = g.quarters.length + (g.between || g.completed ? 0 : 1);
  let h = `<select data-act="pick-period"><option value="all">Full game</option>`;
  for (let q = 1; q <= n; q++) h += `<option value="${q}" ${String(App.period) === String(q) ? 'selected' : ''}>${periodName(g, q)}</option>`;
  return h + '</select>';
}
function periodFilter(g) { const q = App.period === 'all' ? null : +App.period; return q && q <= curPeriod(g) ? q : null; }
function noGame() { return `<div class="card"><h3>No games yet</h3><div class="muted">Start one from the Live tab.</div></div>`; }
/* The practice tracker's box score: score-by-period box, team tabs, Torvik-style tables on
   light rows with the same advanced columns and the same green/red thresholds. */
const BX_COLS = [
  ['min', 'MIN'], ['minPctVal', 'MIN%'], ['ortg', 'ORTG'], ['usgPct', 'USG'], ['shotPct', 'SHOT%'], ['efgPct', 'EFG'], ['tsPct', 'TS%'], ['ftRate', 'FTR'],
  ['orPct', 'OR%'], ['drPct', 'DR%'], ['astPct', 'AST%'], ['toPct', 'TO%'], ['stlPct', 'STL%'], ['blkPct', 'BLK%'],
  ['fg2', '2PT'], ['fg3', '3PT'], ['ft', 'FT'], ['ast', 'AST'], ['tov', 'TO'], ['stl', 'STL'], ['blk', 'BLK'],
  ['oreb', 'OR'], ['dreb', 'DR'], ['reb', 'REB'], ['pf', 'PF'], ['fd', 'FD'], ['pts', 'PTS'], ['pm', '+/-'],
];
let bxPanel = 'both';   // Combined first: both teams on one page is the default view
function bxHi(v, good, bad) { return v == null ? '' : v >= good ? 'bs-hi' : v <= bad ? 'bs-lo' : ''; }
function bxLo(v, good, bad) { return v == null ? '' : v <= good ? 'bs-hi' : v >= bad ? 'bs-lo' : ''; }
function bxClass(r, k) {
  switch (k) {
    case 'pts': return bxHi(r.pts, 20, 5);       case 'pm': return bxHi(r.pm, 5, -5);
    case 'ortg': return bxHi(r.ortg, 115, 90);    case 'efgPct': return bxHi(r.efgPct, 55, 40);
    case 'tsPct': return bxHi(r.tsPct, 60, 45);   case 'usgPct': return bxHi(r.usgPct, 25, 12);
    case 'orPct': return bxHi(r.orPct, 12, 4);    case 'drPct': return bxHi(r.drPct, 25, 10);
    case 'astPct': return bxHi(r.astPct, 20, 5);  case 'toPct': return bxLo(r.toPct, 12, 22);
    case 'stlPct': return bxHi(r.stlPct, 8, 2);   case 'blkPct': return bxHi(r.blkPct, 8, 2);
    case 'ast': return bxHi(r.ast, 5, 1);         case 'tov': return bxLo(r.tov, 1, 3);
    case 'stl': return bxHi(r.stl, 2, 0);         case 'blk': return bxHi(r.blk, 2, 0);
  }
  return '';
}
function bxVal(r, k) {
  switch (k) {
    case 'min': return r.min > 0 ? r.min.toFixed(1) + "'" : '—';
    case 'fg2': return r.fg2m + '-' + r.fg2a; case 'fg3': return r.fg3m + '-' + r.fg3a; case 'ft': return r.ftm + '-' + r.fta;
    case 'pm': return r.pm == null ? '—' : sgn(r.pm);
    case 'ortg': case 'usgPct': case 'efgPct': case 'tsPct': case 'ftRate': case 'orPct': case 'drPct':
    case 'astPct': case 'toPct': case 'stlPct': case 'blkPct': case 'minPctVal': case 'shotPct': return r[k] == null ? '—' : (k === 'ortg' ? Math.round(r[k]) : (+r[k]).toFixed(1));
    default: return r[k] == null ? '—' : r[k];
  }
}
/* One table for either side, same columns. Their minutes come from the clock at their subs,
   so with their five tracked they get the full advanced set; without it (no roster, or their
   five never set) the minutes-based columns read —. */
function bxTable(g, t, qf) {
  const pred = qf ? (e => e.quarter === qf) : null;
  const T = teamStats(g, pred);
  const ts = T[t], os = T[other(t)];
  const cols = BX_COLS;
  let rows = [];
  if (t === 'a' || oppHasRoster(g)) {
    const starters = new Set(t === 'a' ? g.startersA : (g.startersB || []));
    const lu = new Set(g.completed || (t === 'b' && !oppTracked(g)) ? [] : currentLineup(g, t));
    rows = playerStats(g, qf, t).filter(r => starters.has(r.name) || r.min > 0 || r.fga || r.fta || r.reb || r.ast || r.tov || r.pf || r.stl || r.blk || r.fd)
      .map(r => Object.assign(r, { starter: starters.has(r.name), on: lu.has(r.name) }))
      .sort((x, y) => (y.starter - x.starter) || (y.min - x.min) || (t === 'a' ? byLast(x.name, y.name) : 0));
  }
  const teamOnly = statLine(g.eventLog.filter(e => isStat(e) && e.team === t && e.player === TEAM && (!pred || pred(e))));
  const split = rows.some(r => r.starter);
  let bench = false;
  const body = rows.map(r => {
    let div = '';
    if (split && !r.starter && !bench) { bench = true; div = `<tr class="bench-divider"><td>BENCH</td><td colspan="${cols.length}"></td></tr>`; }
    const nm = `${esc(r.name)}${r.on ? '<span class="bx-on" title="On the floor"> ●</span>' : ''}`;
    // Under a quarter of the available minutes: still readable, but out of the eye-line.
    const low = r.minPctVal != null && r.min > 0 && r.minPctVal < 25;
    return `${div}<tr class="${low ? 'low-min' : ''}" ${low ? `title="${Math.round(r.minPctVal)}% of the available minutes"` : ''}><td>${nm}</td>${cols.map(([k]) => `<td class="${bxClass(r, k)}">${bxVal(r, k)}</td>`).join('')}</tr>`;
  }).join('');
  const teamRow = (teamOnly.reb || teamOnly.tov || teamOnly.pf)
    ? `<tr class="team-row"><td>Team</td>${cols.map(([k]) => `<td>${['oreb', 'dreb', 'reb', 'tov', 'pf'].includes(k) ? teamOnly[k] : ''}</td>`).join('')}</tr>` : '';
  /* The TEAM line carries the team's own rates: OR%/DR% of the available boards, AST% of
     made baskets, TO% per possession, STL% of their possessions, BLK% of their 2s. */
  const p1 = v => v == null || !isFinite(v) ? '—' : (+v).toFixed(1);
  const team = {
    min: (gameSecs(g, qf) / 60).toFixed(1) + "'", minPctVal: '—', usgPct: '—', shotPct: '—',
    ortg: ts.possessions > 0 ? Math.round(ts.ortg) : '—',
    efgPct: ts.fga ? p1(ts.efgPct) : '—', tsPct: (ts.fga + ts.fta) ? p1(ts.tsPct) : '—', ftRate: ts.fga ? p1(ts.ftr) : '—',
    orPct: (ts.oreb + os.dreb) ? p1(ts.orebPct) : '—', drPct: (ts.dreb + os.oreb) ? p1(ts.drebPct) : '—',
    astPct: ts.fgm ? p1(100 * ts.ast / ts.fgm) : '—', toPct: ts.possessions > 0 ? p1(ts.tovPct) : '—',
    stlPct: os.possessions > 0 ? p1(100 * ts.stl / os.possessions) : '—', blkPct: os.fg2a ? p1(100 * ts.blk / os.fg2a) : '—',
  };
  const totVal = k => team[k] != null ? team[k] : bxVal(Object.assign({}, ts, { pm: ts.pts - os.pts }), k);
  const header = t === 'a' ? g.teamAName : g.teamBName;
  const empty = t === 'b' && !oppHasRoster(g) ? 'No roster entered — team totals below.' : 'No stats yet.';
  return `<div class="box-team-header ${t}">${logoHtml(t === 'a' ? 'Moorpark' : header, 20)}${esc(header.toUpperCase())}<span>${Math.round(ts.possessions)} POSS</span></div>
    <div class="box-wrap"><table class="box-table"><thead><tr><th>PLAYER</th>${cols.map(([, l]) => `<th>${l}</th>`).join('')}</tr></thead>
      <tbody>${body || `<tr><td colspan="${cols.length + 1}" style="text-align:center;color:#475569">${empty}</td></tr>`}${teamRow}
      <tr class="totals-row"><td>TEAM</td>${cols.map(([k]) => `<td>${totVal(k)}</td>`).join('')}</tr></tbody></table></div>`;
}
function renderBox() {

  const status = g.completed ? '' : g.between ? (g.quarters.length ? ' — End of ' + periodName(g, g.quarters.length) : ' — Pregame') : ' — 🔴 LIVE (' + periodName(g, curPeriod(g), true) + ' ' + fmtClock(clockNow(g)) + ' left)';
  const tab = (k, l) => `<button class="bs-tab-pill ${bxPanel === k ? 'active' : ''}" data-act="bx-panel" data-k="${k}">${esc(l)}</button>`;
  const panel = bxPanel === 'b' ? bxTable(g, 'b', qf) : bxPanel === 'both' ? bxTable(g, 'a', qf) + bxTable(g, 'b', qf) : bxPanel === 'pbp' ? renderPbp(true) : bxTable(g, 'a', qf);

    ${panel}
  </div>`;
}

/* ── ANALYTICS ── */
function renderAnalytics() {
  const g = viewGame(); if (!g) return noGame();
  const qf = periodFilter(g);
  const pred = qf ? (e => e.quarter === qf) : null;
  const T = teamStats(g, pred);
  const A = analyzeTrips(g);
  const flow = scoringFlow(g);
  const a = T.a, b = T.b;
  const bench = t => { const st = new Set(t === 'a' ? g.startersA : (g.startersB || [])); if (t === 'b' && !st.size) return null;
    return g.eventLog.filter(e => isStat(e) && e.team === t && e.player !== TEAM && !st.has(e.player) && (!pred || pred(e))).reduce((s, e) => s + evPts(e), 0); };

/* ── PLAY BY PLAY ── */
let KS_TAGS = new Map();
function renderPbp(embedded) {
  const g = viewGame(); if (!g) return noGame();

  { let team = null, run = 0;
    g.eventLog.forEach((e, i) => { if (!isStat(e)) return; const v = evPts(e); if (!v) return;
      if (e.team !== team) { team = e.team; run = 0; }
      const before = run; run += v;
      for (const m of RUN_MARKS) if (before < m && run >= m) KS_TAGS.set(i, { team, mark: m }); }); }
  const A = analyzeTrips(g);
  let sA = 0, sB = 0;

function pbpEdit(i, player) {

/* ── SEASON ── */
function renderSeason() {
  // Scrimmages are tracked in full but kept out of the record and the season numbers.
  const games = App.games.filter(g => g.completed && !g.scrimmage);
  const nScrim = App.games.filter(g => g.completed && g.scrimmage).length;
  if (!games.length) return `<div class="card"><h3>Season</h3><div class="muted">Finished games show up here${nScrim ? ` (${nScrim} scrimmage${nScrim === 1 ? '' : 's'} played — not counted)` : ''}.</div></div>`;
  const agg = new Map();
  let W = 0, Lw = 0; const team = { a: statLine([]), b: statLine([]), poss: 0 };
  const sumInto = (dst, src) => { for (const k of Object.keys(dst)) if (typeof src[k] === 'number') dst[k] += src[k]; };
  const lev = { aT: 0, aP: 0, bT: 0, bP: 0 }, kl = { a: 0, b: 0 }, ksF = { 10: 0, 15: 0, 20: 0 }, ksA = { 10: 0, 15: 0, 20: 0 };
  for (const g of games) {
    const s = finalScore(g); if (s.a > s.b) W++; else Lw++;
    const T = teamStats(g); sumInto(team.a, T.a); sumInto(team.b, T.b); team.poss += T.a.possessions;
    for (const r of playerStats(g)) {
      if (!(r.min > 0 || r.fga || r.fta || r.reb || r.pf)) continue;
      if (!agg.has(r.name)) agg.set(r.name, Object.assign(statLine([]), { gp: 0, min: 0, pm: 0 }));
      const x = agg.get(r.name); sumInto(x, r); x.gp++;
    }
    { const AK = analyzeTrips(g); kl.a += AK.kills.a; kl.b += AK.kills.b;
      const kc = killshotCounts(g); for (const m of RUN_MARKS) { ksF[m] += kc.a[m]; ksA[m] += kc.b[m]; } }
    for (const tr of analyzeTrips(g).trips) if (!tr.gt) { if (tr.team === 'a') { lev.aT++; lev.aP += tr.pts; } else { lev.bT++; lev.bP += tr.pts; } }
  }
  const n = games.length;
  const rows = [...agg.entries()].sort((x, y) => y[1].pts / y[1].gp - x[1].pts / x[1].gp).map(([name, s]) => {
    const pg = v => (v / s.gp).toFixed(1);
    return `<tr><td class="l">${esc(name)}</td><td>${s.gp}</td><td>${pg(s.min)}</td><td><b>${pg(s.pts)}</b></td><td>${pg(s.reb)}</td><td>${pg(s.ast)}</td><td>${pg(s.stl)}</td><td>${pg(s.blk)}</td><td>${pg(s.tov)}</td><td>${pg(s.pf)}</td><td>${s.chg}</td>
      <td>${pct(s.fgm, s.fga)}</td><td>${pct(s.fg3m, s.fg3a)}</td><td>${pct(s.ftm, s.fta)}</td><td>${s.fga ? f1(100 * (s.fgm + 0.5 * s.fg3m) / s.fga) : '—'}</td><td>${(s.fga + 0.475 * s.fta) ? f1(50 * s.pts / (s.fga + 0.475 * s.fta)) : '—'}</td><td class="${pmCls(s.pm)}">${sgn(s.pm)}</td></tr>`;
  }).join('');
  const a = team.a, b = team.b, P = team.poss;
  return `<div class="card"><h3>Season — ${W}-${Lw} <span class="muted">${n} finished game${n === 1 ? '' : 's'}</span></h3>
    <div class="ff">
      <div class="k"><div class="lbl">PPG / Opp PPG</div><div class="v"><span class="a">${(a.pts / n).toFixed(1)}</span><span class="b">${(b.pts / n).toFixed(1)}</span></div></div>
      <div class="k"><div class="lbl">ORtg / DRtg</div><div class="v"><span class="a">${f1(100 * a.pts / P)}</span><span class="b">${f1(100 * b.pts / P)}</span></div></div>
      <div class="k"><div class="lbl">Non-garbage PPP</div><div class="v"><span class="a">${lev.aT ? (lev.aP / lev.aT).toFixed(2) : '—'}</span><span class="b">${lev.bT ? (lev.bP / lev.bT).toFixed(2) : '—'}</span></div></div>
      <div class="k"><div class="lbl">eFG%</div><div class="v"><span class="a">${a.fga ? f1(100 * (a.fgm + .5 * a.fg3m) / a.fga) : '—'}</span><span class="b">${b.fga ? f1(100 * (b.fgm + .5 * b.fg3m) / b.fga) : '—'}</span></div></div>
      <div class="k"><div class="lbl">TOV%</div><div class="v"><span class="a">${f1(100 * a.tov / P)}</span><span class="b">${f1(100 * b.tov / P)}</span></div></div>
      <div class="k"><div class="lbl">OREB%</div><div class="v"><span class="a">${pct(a.oreb, a.oreb + b.dreb)}</span><span class="b">${pct(b.oreb, b.oreb + a.dreb)}</span></div></div>
      <div class="k"><div class="lbl">FT rate</div><div class="v"><span class="a">${pct(a.fta, a.fga)}</span><span class="b">${pct(b.fta, b.fga)}</span></div></div>
      <div class="k"><div class="lbl">Kills per game</div><div class="v"><span class="a">${(kl.a / n).toFixed(1)}</span><span class="b">${(kl.b / n).toFixed(1)}</span></div></div>
      <div class="k"><div class="lbl">Killshots (10-0) for / against</div><div class="v"><span class="a">${ksF[10]}</span><span class="b">${ksA[10]}</span></div></div>
      <div class="k"><div class="lbl">15-0 · 20-0 for / against</div><div class="v"><span class="a">${ksF[15]} · ${ksF[20]}</span><span class="b">${ksA[15]} · ${ksA[20]}</span></div></div>
      <div class="k"><div class="lbl">Pace (poss/g)</div><div class="v"><span>${(P / n).toFixed(1)}</span></div></div>
    </div></div>
  <div class="card"><h3>Players — per game</h3><div class="tbl-wrap"><table class="tbl">
    <tr><th>Player</th><th>GP</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th><th>PF</th><th>CHG</th><th>FG%</th><th>3P%</th><th>FT%</th><th>eFG%</th><th>TS%</th><th>+/- tot</th></tr>${rows}</table></div></div>`;

/* ── SCOUTING ──
   The report lives in a pane that is never torn down, so flipping game → report → game is
   instant and the report stays on the page you left it at. Pages are drawn with the bundled
   pdf.js (vendor/), because iPad Safari only shows page one of a PDF in a frame. Pages are
   drawn as they scroll near and released when far away, which keeps a 20-page report inside
   what an iPad will give a web page. If pdf.js can't load (e.g. opened from a local file),
   it falls back to the browser's own PDF viewer. */
const SC = { key: null, doc: null, zoom: 1, built: false, io: null, token: 0 };
let _pdfjs = null;
async function loadPdfJs() {
  if (_pdfjs) return _pdfjs;
  const lib = await import(new URL('vendor/pdf.min.mjs', location.href).href);
  lib.GlobalWorkerOptions.workerSrc = new URL('vendor/pdf.worker.min.mjs', location.href).href;
  _pdfjs = lib;
  return lib;
}
function buildScoutPane() {
  const pane = $('#scout-pane');
  pane.innerHTML = `<div class="row" style="margin-bottom:8px"><b>Scouting report</b>
      <select id="scout-sel"></select>
      <button class="btn btn-sm" data-act="scout-upload" data-for="game">Add PDF…</button>
      <span class="row" style="gap:4px"><button class="btn btn-sm" data-act="scout-zoom" data-z="-1">−</button><button class="btn btn-sm" data-act="scout-zoom" data-z="0">Fit</button><button class="btn btn-sm" data-act="scout-zoom" data-z="1">+</button></span>
      <button class="btn btn-sm btn-bad" data-act="scout-del">Remove</button>
      <span class="small muted" style="margin-left:auto">S or the purple button goes back · saved on this device</span></div>
    <div id="scout-pages" class="scout-pages"></div>`;
  $('#scout-sel').onchange = e => {
    const g = liveGame() || viewGame();
    if (g && !App.viewer) { g.scoutKey = e.target.value || null; saveGames(); }
    showScout(e.target.value);
  };
  SC.built = true;
}
async function refreshScoutPane() {
  if (!SC.built) buildScoutPane();
  const g = liveGame() || viewGame();
  const sel = $('#scout-sel');
  let keys = [];
  try { keys = await idbKeys(); } catch (e) { toast('This browser blocks offline file storage', 'bad'); }
  const recs = await Promise.all(keys.map(async k => ({ k, r: await idbGet(k) })));
  const want = (g && g.scoutKey && keys.includes(g.scoutKey)) ? g.scoutKey : (keys.includes(SC.key) ? SC.key : (keys[keys.length - 1] || ''));
  sel.innerHTML = recs.length ? recs.map(x => `<option value="${esc(x.k)}" ${x.k === want ? 'selected' : ''}>${esc(x.r && x.r.name || x.k)}</option>`).join('') : '<option value="">No PDFs yet — Add PDF…</option>';
  if (want !== SC.key || !want) showScout(want);
}
async function scoutBytes(key) {
  const rec = await idbGet(key); if (!rec) return null;
  if (rec.data) return rec.data;
  if (rec.blob) return await rec.blob.arrayBuffer();
  return null;
}
async function showScout(key) {
  const box = $('#scout-pages'); if (!box) return;
  const token = ++SC.token;
  SC.key = key || null;
  if (SC.io) { SC.io.disconnect(); SC.io = null; }
  if (SC.doc) { try { SC.doc.destroy(); } catch (e) {} SC.doc = null; }
  if (!key) { box.innerHTML = '<div class="scout-empty">Add the scouting report PDF with “Add PDF…”. It is saved on this device and opens without wifi.</div>'; return; }
  box.innerHTML = '<div class="scout-empty">Loading…</div>';
  const bytes = await scoutBytes(key);
  if (token !== SC.token) return;
  if (!bytes) { box.innerHTML = '<div class="scout-empty">That PDF is no longer on this device.</div>'; return; }
  let lib;
  try { lib = await loadPdfJs(); }
  catch (e) {
    // No pdf.js (opened from disk): the browser's own viewer is the fallback.
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    box.innerHTML = `<iframe src="${url}" style="width:100%;height:100%;border:0;background:#fff"></iframe>`;
    return;
  }
  try { SC.doc = await lib.getDocument({ data: new Uint8Array(bytes.slice(0)) }).promise; }
  catch (e) { box.innerHTML = '<div class="scout-empty">Could not open that PDF.</div>'; return; }

}
async function layoutScout() {
  const box = $('#scout-pages'); const doc = SC.doc; if (!box || !doc) return;
  if (SC.io) SC.io.disconnect();
  const keepRatio = box.scrollHeight ? box.scrollTop / box.scrollHeight : 0;
  box.innerHTML = '';
  const first = await doc.getPage(1);
  const base = first.getViewport({ scale: 1 });
  const fitW = Math.max(200, box.clientWidth - 24);
  const scale = (fitW / base.width) * SC.zoom;
  const holders = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const d = document.createElement('div');
    d.className = 'scout-page'; d.dataset.page = i;
    d.style.width = Math.round(base.width * scale) + 'px';
    d.style.height = Math.round(base.height * scale) + 'px';
    box.appendChild(d); holders.push(d);
  }
  box.scrollTop = keepRatio * box.scrollHeight;
  const token = SC.token;
  SC.io = new IntersectionObserver(entries => {
    for (const en of entries) {
      const d = en.target;
      if (en.isIntersecting) { if (!d.firstChild) drawPage(d, +d.dataset.page, scale, token); }
      else if (d.firstChild) { const c = d.firstChild; c.width = 0; c.height = 0; d.innerHTML = ''; }   // give the memory back
    }
  }, { root: box, rootMargin: '1200px 0px' });
  holders.forEach(h => SC.io.observe(h));
}
async function drawPage(holder, n, scale, token) {
  const doc = SC.doc; if (!doc || token !== SC.token) return;
  const page = await doc.getPage(n);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vp = page.getViewport({ scale: scale * dpr });
  const c = document.createElement('canvas');
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  c.style.width = holder.style.width; c.style.height = holder.style.height;
  holder.innerHTML = ''; holder.appendChild(c);
  try { await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; } catch (e) { /* scrolled away mid-draw */ }
}
function scoutZoom(z) {
  SC.zoom = z === 0 ? 1 : Math.min(3, Math.max(0.5, SC.zoom * (z > 0 ? 1.25 : 0.8)));
  layoutScout();
}
async function uploadScout(file, forWhat) {
  if (!file) return;
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { toast('That is not a PDF', 'bad'); return; }
  const key = 'scout_' + Date.now();
  // Stored as raw bytes: older iPad Safari is unreliable about Blobs in IndexedDB.
  try { await idbPut(key, { name: file.name, data: await file.arrayBuffer(), added: new Date().toISOString() }); }
  catch (e) { toast('Could not store the PDF on this device', 'bad'); return; }

/* Paste-in: one game per line, as it reads on an athletics site —
   "Fri, Nov 7  vs  Ventura  7:00 PM", "11/12 at Oxnard*", "Nov 22 Santa Barbara (N)". */
const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
function seasonYear(month) {
  const now = new Date(); const start = now.getMonth() + 1 >= 7 ? now.getFullYear() : now.getFullYear() - 1;
  return month >= 7 ? start : start + 1;
}
function parseScheduleText(text) {
  const out = [];
  for (let line of String(text || '').split(/\r?\n/)) {
    line = line.trim(); if (!line) continue;
    let m, mo = null, dy = null, yr = null;
    if ((m = line.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) { mo = +m[1]; dy = +m[2]; yr = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null; }
    else if ((m = line.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/i))) { mo = MONTHS.indexOf(m[1].slice(0, 3).toLowerCase()) + 1; dy = +m[2]; }
    if (!mo || !dy || mo > 12 || dy > 31) continue;            // a heading or a blank month row
    line = line.replace(m[0], ' ');
    const y = yr || seasonYear(mo);
    const date = `${y}-${String(mo).padStart(2, '0')}-${String(dy).padStart(2, '0')}`;
    let time = '';
    const tm = line.match(/\b(\d{1,2}(?::\d{2})?\s*(?:a\.?m\.?|p\.?m\.?))/i);
    if (tm) { time = tm[1].replace(/\./g, '').toUpperCase().replace(/(\d)(AM|PM)/, '$1 $2'); line = line.replace(tm[0], ' '); }
    let site = 'home';
    if (/(^|\s)(@|at)\s/i.test(' ' + line + ' ')) site = 'away';
    if (/\(n\)|neutral/i.test(line)) site = 'neutral';
    const conf = /\*|\bconf(erence)?\b/i.test(line);
    const scrim = /scrimmage|\bscrim\b|exhibition/i.test(line);
    line = line.replace(/\(?\s*(scrimmage|scrim|exhibition)\s*\)?/gi, ' ');
    let opp = line
      .replace(/\b(mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun)(day|sday|nesday|rsday|urday)?\b\.?,?/gi, ' ')
      .replace(/\b[WLT]\s*,?\s*\d{2,3}\s*[-–]\s*\d{2,3}\b/g, ' ')                  // a result already played
      .replace(/\(n\)|neutral|\*|\bconf(erence)?\b|\bTBA\b|\bTBD\b/gi, ' ')
      .replace(/(^|\s)(vs\.?|v\.|@|at)(?=\s)/gi, ' ')
      .replace(/[|,;\t]+/g, ' ').replace(/\s+/g, ' ').trim()
      .replace(/^[-–:]+|[-–:]+$/g, '').trim();
    if (!opp) continue;
    out.push({ id: 'sch_' + Date.now() + '_' + out.length, date, time, opp, site, conf, scrim });
  }
  return out;
}

function saveOppLiveEdit() {
  const g = liveGame(); if (!g) return;
  collectRows('live');
  const players = sortByNum(cleanPlayers(OLE.rows));
  const dupe = dupeNumber(players);
  if (dupe) { toast('Two players wear #' + dupe, 'bad'); return; }
  const { labels, info } = buildOppLabels(players);
  const oldLabels = g.oppRoster || [];
  const oldNum = l => ((g.oppInfo || {})[l] || {}).num || ((l.match(/^#(\d{1,2})/) || [])[1] || '');
  snapshot();
  const rename = {};
  for (const ol of oldLabels) {
    const n = oldNum(ol); if (!n) continue;
    const nl = labels.find(l => info[l].num === n);
    if (nl && nl !== ol) rename[ol] = nl;
  }
  const used = new Set(g.eventLog.filter(e => isStat(e) && e.team === 'b').map(e => e.player));
  for (const e of g.eventLog) if (isStat(e) && e.team === 'b' && rename[e.player]) e.player = rename[e.player];
  const keep = oldLabels.filter(l => used.has(l) && !rename[l] && !labels.includes(l));
  g.oppRoster = [...labels, ...keep];
  g.oppInfo = Object.assign({}, ...keep.map(l => ({ [l]: (g.oppInfo || {})[l] || { num: oldNum(l), name: l } })), info);
  if ($('#ole-lib').checked && players.length) upsertOpp(g.teamBName, players);
  saveGames(); closeModal(); render();
  toast(`${g.teamBName}: ${g.oppRoster.length} players${keep.length ? ' (' + keep.length + ' kept — they have stats)' : ''}`, 'good', 3000);

function importFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let d; try { d = JSON.parse(rd.result); } catch (e) { toast('Not a valid JSON file', 'bad'); return; }
    const games = Array.isArray(d) ? d : d.games || (d.eventLog ? [d] : []);
    let added = 0, replaced = 0;
    for (const g of games) {
      if (!g || !g.id || !Array.isArray(g.eventLog)) continue;
      const i = App.games.findIndex(x => x.id === g.id);
      if (i === -1) { App.games.push(g); added++; } else if (g.id !== App.liveId) { App.games[i] = g; replaced++; }
    }
    let oppN = 0;
    if (Array.isArray(d.opponents)) for (const o of d.opponents) {
      if (!o || !o.name || !Array.isArray(o.players)) continue;
      const i = App.opps.findIndex(x => x.id === o.id || x.name.toLowerCase() === o.name.toLowerCase());
      if (i === -1) App.opps.push(o); else if ((o.updatedAt || '') >= (App.opps[i].updatedAt || '')) App.opps[i] = o;
      oppN++;
    }
    if (oppN) saveOpps();
    if (Array.isArray(d.schedule)) { for (const r of d.schedule) if (r && r.id && !App.schedule.some(x => x.id === r.id)) App.schedule.push(r); App.schedule.sort((a, b) => (a.date || '').localeCompare(b.date || '')); saveSched(); SCH.rows = null; }
    if (Array.isArray(d.roster) && d.roster.length && confirm('Also replace the roster with the one in this file?')) { App.roster = d.roster.map(normRosterEntry); saveRoster(); }
    saveGames(); render();
    toast(`Imported: ${added} new, ${replaced} updated`, 'good');
  };
  rd.readAsText(file);
}

}

function normRosterEntry(r) { return typeof r === 'string' ? { name: r, num: '', hidden: false } : Object.assign({ name: r.name, num: r.num != null ? String(r.num) : '', hidden: !!r.hidden }, r.hiddenSet ? { hiddenSet: true } : {}); }
/* The practice tracker decides who is hidden. The game roster used to copy it once, on the
   first open, and never look again - so anyone hidden later (or everyone, on a device whose
   first open was offline and fell back to the seed list) kept showing up at game setup.
   Now every open re-reads it: this browser's practice tracker first, else the published
   snapshot. A hide/unhide made in this app's own Roster editor (hiddenSet) is respected. */

  let src = lsGet('pt_roster', null);
  if (!Array.isArray(src) || !src.length) {
    src = null;
    try {
      const res = await fetch('../tracker/pt_data.json', { cache: 'no-store' });
      if (res.ok) { const d = await res.json(); if (Array.isArray(d.roster)) src = d.roster; }
    } catch (e) { /* offline: keep what we have */ }
  }
  if (!src) return;
  let changed = false;
  for (const p of src.map(normRosterEntry)) {
    const r = App.roster.find(x => x.name === p.name);
    if (!r) { App.roster.push({ name: p.name, num: '', hidden: p.hidden }); changed = true; }
    else if (!r.hiddenSet && r.hidden !== p.hidden) { r.hidden = p.hidden; changed = true; }
  }
  if (changed) { saveRoster(); dropHiddenFromSetup(); }
}
function dropHiddenFromSetup() {
  if (!setupDraft) return;
  const hidden = new Set(App.roster.filter(r => r.hidden).map(r => r.name));
  setupDraft.dressed = setupDraft.dressed.filter(n => !hidden.has(n));
  setupDraft.starters = setupDraft.starters.filter(n => !hidden.has(n));
}
async function loadRoster() {
  const own = lsGet(LS_ROSTER, null);
  if (Array.isArray(own) && own.length) return own.map(normRosterEntry);
  // Same site as the practice tracker, so its roster is right there in this browser.
  const pt = lsGet('pt_roster', null);
  if (Array.isArray(pt) && pt.length) return pt.map(normRosterEntry);
  try {
    const res = await fetch('../tracker/pt_data.json', { cache: 'no-store' });
    if (res.ok) { const d = await res.json(); if (Array.isArray(d.roster) && d.roster.length) return d.roster.map(normRosterEntry); }
  } catch (e) { /* offline or opened from disk: fall through to the seed */ }
  return SEED_ROSTER.map(r => Object.assign({}, r));
}
async function boot() {
  App.games = lsGet(LS_GAMES, []) || [];
  App.opps = lsGet(LS_OPPS, []) || [];
  App.schedule = lsGet(LS_SCHED, []) || [];
  // Once per device: add the 2026-27 games we know that aren't on the schedule yet. Never
  // again after that, so a game deleted on purpose stays deleted.
  if (!App.viewer && !lsGet('gt_sched_seeded_v2', false)) {
    for (const r of SEED_SCHEDULE) if (!App.schedule.some(x => x.date === r.date)) App.schedule.push(Object.assign({}, r));
    App.schedule.sort((x, y) => (x.date || '').localeCompare(y.date || ''));
    saveSched(); lsSet('gt_sched_seeded_v2', true);
  }
  App.liveId = lsGet(LS_LIVE, null);
  if (App.liveId && !App.games.some(g => g.id === App.liveId && !g.completed)) App.liveId = null;
  const ui = lsGet(LS_UI, {}) || {};
  App.lev = ui.lev || 'nogt';
  App.viewId = ui.viewId || null;
  if (!App.games.length && location.protocol !== 'file:') {
    // Viewer path: no games in this browser, so show the published snapshot read-only.
    try {
      const res = await fetch('gt_data.json', { cache: 'no-store' });
      if (res.ok) { const d = await res.json(); if (Array.isArray(d.games) && d.games.length) { App.games = d.games; App.viewer = true; App.publishedAt = d.publishedAt; if (d.roster) App.roster = d.roster.map(normRosterEntry); } }
    } catch (e) { /* none published */ }
  }
  if (!App.roster.length) App.roster = await loadRoster();
  if (!App.viewer) await syncRosterFromPractice();
  if (App.viewer) document.querySelectorAll('.editor-only').forEach(el => el.classList.add('hidden'));
  else if (!lsGet(LS_ROSTER, null)) saveRoster();
  // Running clock survives a reload: it was anchored to wall time.
  setTab(App.viewer ? 'games' : (App.liveId ? 'track' : (ui.tab && ui.tab !== 'scout' ? ui.tab : 'track')));
  if (App.tab === 'track' && !liveGame()) paintSetupScout();
  registerOffline();
}
/* paintSetupScout needs the setup DOM; hook it onto every render of the setup screen. */
const _render = render;
render = function () { _render(); if (App.tab === 'track' && !liveGame()) paintSetupScout(); };

function warmLogos() {
  const names = new Set(['Moorpark', ...App.schedule.map(r => r.opp), ...App.games.map(g => g.teamBName)]);
  for (const n of names) { const k = logoSlug(n); if (k) fetch('logos/' + k + '.png').catch(() => {}); }
}
function registerOffline() {
  const dot = $('#offline-dot');
  if (location.protocol === 'file:') { dot.textContent = 'Offline ready'; dot.classList.add('ready'); return; }
  if (!('serviceWorker' in navigator)) { dot.textContent = 'Offline not supported'; return; }
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
    dot.textContent = 'Offline ready'; dot.classList.add('ready');
    warmLogos();
  }).catch(() => { dot.textContent = 'Offline unavailable'; });
}
let _rsz = null;
window.addEventListener('resize', () => { clearTimeout(_rsz); _rsz = setTimeout(() => { if (App.tab === 'scout' && SC.doc) layoutScout(); }, 250); });
window.addEventListener('beforeunload', () => { const g = liveGame(); if (g) lsSet(LS_GAMES, App.games); });
boot();
</script>
