  const has = !L ? null : BALL_TO_OTHER.has(L.k) ? other(L.team) : BALL_KEEP.has(L.k) ? L.team : null;
  const nm = t => teamName(g, t);
  // A foul by the team with the ball that sends the other team to the line isn't an offensive foul (those never give
  // free throws): the and-one after a make, or a loose-ball foul in the bonus.
  const nextPlay = () => { for (let j = i + 1; j < g.ev.length; j++) { const x = g.ev[j]; if (x.per !== e.per) return null; if (x.t === 'play' && !x.tech) return x; } return null; };
  if (e.t === 'foul' && has === e.team && !(n => n && isFT(n.k) && n.team !== e.team)(nextPlay())) return { offf: !!e.player, msg: `Foul on ${nm(e.team)} while ${nm(e.team)} had the ball: an offensive foul? (a plain foul doesn't end their possession)` };
  if (e.t !== 'play' || isFT(e.k)) return null;
  for (let j = i - 1; j >= 0 && g.ev[j] !== L; j--) if (g.ev[j].chkFlag) return null;
  if (L && L.chkFlag) return null;   // follows from a play or foul just flagged (gameChecks): one mistake, one entry
  if (['2m', '2x', '3m', '3x', 'to', 'chg', 'offf'].includes(e.k) && has && offOf(e) !== has) return { msg: `${nm(offOf(e))} ${STAT_LABEL[e.k] || e.k} but ${nm(has)} had the ball: a ${nm(has)} trip missed?` };
  if (e.k === 'stl' && has === e.team) return { msg: `Steal by ${nm(e.team)}, who already had the ball: wrong team?` };
  if (L && MISSES.has(L.k) && e.k === 'dreb' && e.team === L.team) return { msg: `Def reb to ${nm(e.team)} right after their own miss: an off reb?` };
  if (L && MISS_K.has(L.k) && e.k === 'oreb' && e.team !== L.team) return { msg: `Off reb to ${nm(e.team)}, who didn't shoot: a def reb?` };

}

    if (p != null) return c > p ? { msg: `Clock ${fmtSecs(c)} is later than the one set before it (${fmtSecs(p)})` } : null; }

}
/* SET SCORE (optional, like Set time): the scoreboard's score at that moment, logged as a checkpoint {t:'score', a, b}.
   Nothing is changed by it; the tracker's own score at that point is compared, and a difference is listed in Check
   game with how far it's off and since which checkpoint it last matched (only the plays in between need a look). */
function scoreAt(g, i) { const sc = { a: 0, b: 0 }; for (let j = 0; j < i; j++) { const e = g.ev[j]; if (e.t === 'play') sc[e.team] += PTS[e.k] || 0; if (e.t === 'tech') sc[other(e.team)] += e.ftm || 0; } return sc; }

  const t = scoreAt(g, i); if (t.a === e.a && t.b === e.b) return null;
  let from = null; for (let j = i - 1; j >= 0; j--) { const x = g.ev[j]; if (x.t !== 'score') continue; const u = scoreAt(g, j); if (u.a === x.a && u.b === x.b) { from = { j, x }; break; } }
  const j0 = from ? from.j : 0, off = ['a', 'b'].filter(k => t[k] !== e[k]);
  const diff = off.map(k => { const d = t[k] - e[k], n = g.ev.slice(j0, i).filter(x => x.t === 'play' && x.team === k && PTS[x.k]).length;
    return `${teamName(g, k)} ${d > 0 ? '+' : ''}${d} in the tracker (${n} ${teamName(g, k)} scoring play${n === 1 ? '' : 's'} to check)`; }).join('; ');
  return { msg: `Scoreboard ${e.a}–${e.b}, tracker ${t.a}–${t.b}: ${diff}, since ${from ? `the ${from.x.a}–${from.x.b} check (${PER_NAME(from.x.per)})` : 'the tip'}` };

/* ---------- schedule: the game tracker's Schedule tab, same store (gt_schedule) ---------- */
const SITE_LABEL = { home: 'vs', away: '@', neutral: 'vs (N)' };
const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
function seasonYear(month) {
  const now = new Date(); const start = now.getMonth() + 1 >= 7 ? now.getFullYear() : now.getFullYear() - 1;
  return month >= 7 ? start : start + 1;
}
function parseScheduleText(text) {
  const out = [];
  for (let line of String(text || '').split(/\r?\n/)) {
    line = line.trim(); if (!line) continue;
    let m, mo = null, dy = null, yr = null;
    if ((m = line.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) { mo = +m[1]; dy = +m[2]; yr = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null; }
    else if ((m = line.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/i))) { mo = MONTHS.indexOf(m[1].slice(0, 3).toLowerCase()) + 1; dy = +m[2]; }
    if (!mo || !dy || mo > 12 || dy > 31) continue;            // a heading or a blank month row
    line = line.replace(m[0], ' ');
    const y = yr || seasonYear(mo);
    const date = `${y}-${String(mo).padStart(2, '0')}-${String(dy).padStart(2, '0')}`;
    let time = '';
    const tm = line.match(/\b(\d{1,2}(?::\d{2})?\s*(?:a\.?m\.?|p\.?m\.?))/i);
    if (tm) { time = tm[1].replace(/\./g, '').toUpperCase().replace(/(\d)(AM|PM)/, '$1 $2'); line = line.replace(tm[0], ' '); }
    let site = 'home';
    if (/(^|\s)(@|at)\s/i.test(' ' + line + ' ')) site = 'away';
    if (/\(n\)|neutral/i.test(line)) site = 'neutral';
    const conf = /\*|\bconf(erence)?\b/i.test(line);
    const scrim = /scrimmage|\bscrim\b|exhibition/i.test(line);
    line = line.replace(/\(?\s*(scrimmage|scrim|exhibition)\s*\)?/gi, ' ');
    let opp = line
      .replace(/\b(mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun)(day|sday|nesday|rsday|urday)?\b\.?,?/gi, ' ')
      .replace(/\b[WLT]\s*,?\s*\d{2,3}\s*[-–]\s*\d{2,3}\b/g, ' ')                  // a result already played
      .replace(/\(n\)|neutral|\*|\bconf(erence)?\b|\bTBA\b|\bTBD\b/gi, ' ')
      .replace(/(^|\s)(vs\.?|v\.|@|at)(?=\s)/gi, ' ')
      .replace(/[|,;\t]+/g, ' ').replace(/\s+/g, ' ').trim()
      .replace(/^[-–:]+|[-–:]+$/g, '').trim();
    if (!opp) continue;
    out.push({ id: 'sch_' + Date.now() + '_' + out.length, date, time, opp, site, conf, scrim });
  }
  return out;
}

   the leaderboard page). Basic: per-game lines, sortable. Advanced: KenPom %Poss bands, benchwarmers (<10% of
   minutes) last, a State Rank line under each player on the ranked stats. */
const TS_BANDS = [[28, 'Go-to Guys (>28% of possessions used)'], [24, 'Major Contributors (24-28% of possessions used)'], [20, 'Significant Contributors (20-24% of possessions used)'],
  [16, 'Role Players (16-20% of possessions used)'], [12, 'Limited Roles (12-16% of possessions used)'], [-1, 'Nearly Invisible (<12% of possessions used)']];
const TS_BASIC = [['name', 'Player'], ['gp', 'G'], ['mpg', 'MPG'], ['ppg', 'PPG'], ['orpg', 'ORPG'], ['drpg', 'DRPG'], ['rpg', 'RPG'], ['apg', 'APG'], ['spg', 'SPG'], ['bpg', 'BPG'], ['topg', 'TOPG'],
  ['fgm', 'FGM-A'], ['fgp', 'FG%'], ['twom', '2PM-A'], ['twop', '2P%'], ['tpm', '3PM-A'], ['tpp', '3P%'], ['efg_pct', 'eFG%'], ['ftm', 'FTM-A'], ['ftp', 'FT%'], ['ts_pct', 'TS%']];
const TS_ADV = ['ind_ortg', 'usage_pct', 'shot_pct', 'efg_pct', 'ts_pct', 'oreb_pct', 'dreb_pct', 'ast_rate', 'tov_pct', 'blk_pct', 'stl_pct', 'fc_per_40', 'fd_per_40', 'ft_rate'];
const tsF = v => v == null || v === '' ? '—' : (+v).toFixed(1);
function teamStatsTable(name, mode) {
  if (name === 'MPK') name = 'Moorpark';
  const F = teamFile(name), T = F && F.table;
  if (!T) return `<div class="small muted" style="padding:8px 0 12px">${F ? 'This team\'s file has no Team Stats table yet (the next leaderboard build adds it).' : 'No leaderboard stats for this team on the iPad: it downloads when the team is on the schedule or under Teams to have ready, and the tracker is online.'}</div>`;
  const rows = T.rows || [], pm = (m, a) => `${m}-${a}`;
  if (mode === 'basic') {
    const k = UI.tsSort || 'ppg', dir = UI.tsDir || 'desc';
    const S = rows.slice().sort((a, b) => k === 'name' ? (dir === 'asc' ? 1 : -1) * String(a.name).localeCompare(String(b.name)) : (dir === 'desc' ? -1 : 1) * ((+a[k] || 0) - (+b[k] || 0)));
    const val = (r, c) => c === 'name' ? `<td class="ts-l">${esc(r.name)}</td>` : c === 'fgm' ? `<td>${pm(r.fgm, r.fga)}</td>` : c === 'twom' ? `<td>${pm(r.twom, r.twoa)}</td>` : c === 'tpm' ? `<td>${pm(r.tpm, r.tpa)}</td>` : c === 'ftm' ? `<td>${pm(r.ftm, r.fta)}</td>` : c === 'gp' ? `<td>${r.gp}</td>` : `<td>${tsF(r[c])}</td>`;
    return `<div class="ts-wrap"><table class="ts-table ts-basic"><thead><tr>${TS_BASIC.map(([c, l]) => `<th class="${c === 'name' ? 'ts-l ' : ''}${k === c ? 'on ' + dir : ''}" data-act="ts-sort" data-k="${c}">${l}</th>`).join('')}</tr></thead><tbody>${S.map((r, i) => `<tr class="${i % 2 ? 'z' : ''}">${TS_BASIC.map(([c]) => val(r, c)).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  const adv = T.adv === 1, A = c => adv ? tsF(r0[c]) : '—'; let r0;
  const rk = (r, c) => `<td>${(r.rank || {})[c] || ''}</td>`;
  const cells = r => { r0 = r; return `<td class="ts-l">${esc(r.name)}</td><td>${esc(r.ht || '—')}</td><td>${r.gp}</td><td>${adv ? tsF(r.min_pct) : '—'}</td><td>${A('ind_ortg')}</td>${TS_ADV.slice(1).map(c => `<td>${A(c)}</td>`).join('')}<td>${pm(r.ftm, r.fta)}</td><td>${tsF(r.ftp)}</td><td>${pm(r.twom, r.twoa)}</td><td>${tsF(r.twop)}</td><td>${pm(r.tpm, r.tpa)}</td><td>${tsF(r.tpp)}</td>`; };
  const rankRow = r => !adv || !Object.keys(r.rank || {}).length ? '' : `<tr class="ts-rankrow"><td class="ts-l ts-ranklabel">State Rank</td><td></td><td></td><td></td>${rk(r, 'ind_ortg')}<td></td><td></td>${['efg_pct', 'ts_pct', 'oreb_pct', 'dreb_pct', 'ast_rate', 'tov_pct', 'blk_pct', 'stl_pct', 'fc_per_40', 'fd_per_40', 'ft_rate'].map(c => rk(r, c)).join('')}<td></td>${rk(r, 'ftp')}<td></td>${rk(r, 'twop')}<td></td>${rk(r, 'tpp')}</tr>`;

    ${adv ? `<div class="tiny muted" style="margin-top:6px">State Rank: among qualified players in the state, by the leaderboard's own rules (30% of minutes; shooting stats by their leaderboard qualifications). ORtg is ranked within the player's %Poss band: a role player's efficiency is compared with other role players, not go-to guys.</div>` : '<div class="tiny muted" style="margin-top:6px">No advanced numbers for this team: its box scores don\'t have reliable minutes (same as the leaderboard).</div>'}`;
}
function fillFromLeaderboard(sel) {

  const add = Object.entries(best).filter(([k]) => !have.has(k)).sort((a, b) => (b[1][1].all.MIN || 0) - (a[1][1].all.MIN || 0));

function saveRosterEdit() {

let SUB = null;

/* POSSESSION PILL = the possession ARROW (as the game tracker): the team that gets the next held ball, not the team
   with the ball now. It changes ONLY when tapped — no play, sub, timeout or new period moves it. Tap it at the tip,
   at the start of the 2nd half, after a jump ball. Tapped mid-half it's a held ball: the arrow's team gets the ball
   (heldBallModal says what that logs) and the arrow flips; or Just switch, to fix the arrow without a play. */
function possPill(g) {

  const lbl = t => { const nm = esc(teamName(g, t).toUpperCase()); return t === 'a' ? `<span class="pb">◀</span><span class="pn">${nm}</span> BALL` : `<span class="pn">${nm}</span> BALL<span class="pb">▶</span>`; };
  const pill = (k, cls, act) => `<${act ? 'button' : 'span'} class="poss-btn ${k || 'none'} ${cls}"${act ? ' data-act="ball-flip"' : ' aria-hidden="true"'}>${k ? lbl(k) : 'JUMP BALL · TAP'}</${act ? 'button' : 'span'}>`;
  // The real pill fits its text; hidden copies of the other two hold the slot at the widest one's width.
  return `<span class="pp-slot">${['a', 'b', ''].filter(k => k !== (ball || '')).map(k => pill(k, 'pp-ghost')).join('')}${pill(ball || '', '', true)}</span>`;
}

  const has = !L ? null : BALL_TO_OTHER.has(L.k) ? other(L.team) : BALL_KEEP.has(L.k) ? L.team : null;

/* TIMEOUT SHEET ("Huddle") — the game tracker's, by possessions instead of the clock. Opens on every
   timeout and any time from 📋 Huddle: the score, fouls and timeouts; up to four talk points; each
   last 20 possessions (both teams, ~5:00 at Moorpark's 5-year tempo) against the whole game (four factors, PPP); momentum (run, empty trips,
   stops in a row, kills); both fives on the floor with fouls and +/-. Tap a row to mark it. */
// Both teams together. Moorpark's tempo the last 5 seasons (leaderboard, per 40:00): 79.6, 78.0, 79.6,

  list.forEach(p => { const b = possBox(p);
    if (p.team === t) { z.n++; z.pts += p.pts; z.fga += b.fga; z.fgm += b.fgm; z.fg3m += b.fg3m; z.fta += b.fta; z.tov += b.tov; z.stov += b.stov; z.oreb += b.oreb; z.oppDreb += b.dreb;

  const h1 = per === '1H';

  const a = W.a, b = W.b, opp = g.opp;
  if (a.tov >= 3) add(a.tov, false, `${a.tov} turnovers in our last ${a.n} trips → ${a.pot} points for them.`);
  if (b.tov >= 3) add(b.tov - 0.5, true, `They've turned it over ${b.tov} times in their last ${b.n} trips.`);
  if (b.oreb >= 2) add(b.oreb + 0.5, false, `They have ${b.oreb} offensive boards in their last ${b.n} trips.`);
  if (a.oreb >= 3) add(a.oreb - 1, true, `${a.oreb} offensive boards for us in our last ${a.n} trips.`);
  if (b.n >= 5 && b.pts / b.n >= 1.3) add(b.pts / b.n * 3, false, `They're scoring ${ppp(b.pts, b.n)} a trip over their last ${b.n}.`);
  if (run && run.team === 'b') add((run.f - run.a) / 2, false, `They're on a ${run.f}-${run.a} run.`);
  if (run && run.team === 'a' && run.f - run.a >= 8) add((run.f - run.a) / 3, true, `We're on a ${run.f}-${run.a} run.`);
  const eA = empty('a'); if (eA >= 3) add(eA, false, `${eA} straight empty trips for us.`);
  const stA = S.streak.a || 0; if (stA >= 3) add(stA - 0.5, true, `${stA} stops in a row.`);
  const fa = teamFouls(g, 'a', per), fb = teamFouls(g, 'b', per);
  if (fa >= 7) add(4, false, `They're in the ${fa >= 10 ? 'double ' : ''}bonus (${fa} fouls on us).`);
  else if (fa === 6) add(3, false, 'One more foul puts them in the bonus.');
  if (fb >= 7) add(3, true, `We're in the ${fb >= 10 ? 'double ' : ''}bonus (${fb} fouls on them).`);
  const trouble = pf => pf >= (h1 ? 2 : 3);
  D.five.a.forEach(id => { const pf = playerFouls(g, 'a', id); if (trouble(pf)) add(pf, false, `${pShort(g, 'a', id)} has ${pf} fouls.`); });
  D.five.b.forEach(id => { const pf = playerFouls(g, 'b', id); if (trouble(pf)) add(pf - 0.5, true, `${pShort(g, 'b', id)} has ${pf} fouls.`); });
  // With the clock in: late and close leads the list.
  { const N = gradeNow(g, D), lead = G.pts.a - G.pts.b;
    if (N && N.clutch) { const left = clock != null ? clock : N.clock ? N.clock.perSecs : null;
      add(99, lead > 0, `Clutch: ${lead > 0 ? 'up ' + lead : lead < 0 ? 'down ' + -lead : 'tied'}${left != null ? ' with ' + fmtSecs(left) + ' left' : ' late'}${fb >= 7 || fa >= 7 ? ` · ${fb >= 7 ? 'we\'re in the bonus' : ''}${fb >= 7 && fa >= 7 ? ', ' : ''}${fa >= 7 ? 'they\'re in the bonus' : ''}` : ''}.`); } }
  pts.sort((x, y) => y.w - x.w); pts.length = Math.min(pts.length, 4);
  // Last 10 vs the game: a row lights up when it has moved well away from the game on enough attempts.
  const pct = (n, d) => d ? 100 * n / d : null, P = v => v == null ? '—' : v.toFixed(1) + '%';
  const rows = [
    { lbl: 'PPP', f: s => ({ v: s.n ? s.pts / s.n : null, show: s.n ? (s.pts / s.n).toFixed(2) : '—', sub: s.n ? `${s.pts} pts / ${s.n} poss` : '' }), gate: w => w.n >= 5, gap: 0.3 },
    { lbl: 'eFG%', f: s => ({ v: pct(s.fgm + 0.5 * s.fg3m, s.fga), show: P(pct(s.fgm + 0.5 * s.fg3m, s.fga)), sub: s.fga ? `${s.fgm}/${s.fga} FG · ${s.fg3m} 3PM` : '' }), gate: w => w.fga >= 5, gap: 15 },
    { lbl: 'TO%', f: s => ({ v: pct(s.tov, s.n), show: P(pct(s.tov, s.n)), sub: s.tov ? `${s.tov} TO → ${s.pot} pts for ${s === W.a || s === GB.a ? 'them' : 'us'}` : '' }), gate: w => w.tov >= 3, gap: 10 },
    { lbl: 'Non-steal TO%', f: s => ({ v: pct(s.tov - s.stov, s.n), show: P(pct(s.tov - s.stov, s.n)), sub: s.tov ? `${s.tov - s.stov} of ${s.tov} not steals` : '' }), gate: w => w.tov >= 3, gap: 10 },
    { lbl: 'OREB%', f: s => ({ v: pct(s.oreb, s.oreb + s.oppDreb), show: P(pct(s.oreb, s.oreb + s.oppDreb)), sub: s.oreb + s.oppDreb ? `${s.oreb}/${s.oreb + s.oppDreb}` : '' }), gate: w => w.oreb + w.oppDreb >= 4, gap: 20 },
    { lbl: 'DREB%', f: s => ({ v: pct(s.dreb, s.dreb + s.oppOreb), show: P(pct(s.dreb, s.dreb + s.oppOreb)), sub: s.dreb + s.oppOreb ? `${s.dreb}/${s.dreb + s.oppOreb}` : '' }), gate: w => w.dreb + w.oppOreb >= 4, gap: 20 },
    { lbl: 'FT rate', f: s => ({ v: pct(s.fta, s.fga), show: P(pct(s.fta, s.fga)), sub: s.fga ? `${s.fta} FTA` : '' }), gate: w => w.fga >= 5, gap: 20 },
    { lbl: '3PA rate', f: s => ({ v: pct(s.fg3a, s.fga), show: P(pct(s.fg3a, s.fga)), sub: s.fga ? `${s.fg3a}/${s.fga} FGA` : '' }), gate: w => w.fga >= 5, gap: 20 }];
  const cell = (r, t) => { const w = r.f(W[t]), gm = r.f(GB[t]);
    const moved = w.v != null && gm.v != null && r.gate(W[t]) && Math.abs(w.v - gm.v) >= r.gap;

  const cmp = `<table class="tbl rep-tbl zebra l5-tbl"><tr><th></th><th>Moorpark <span class="tiny">last ${a.n}</span></th><th class="tiny">game</th><th>${esc(opp)} <span class="tiny">last ${b.n}</span></th><th class="tiny">game</th></tr>

      ${fiveSorted(g, t, f).map(id => { const p = pInfo(g, t, id), pf = playerFouls(g, t, id), pm = (L.players[id] || { pm: 0 }).pm;
        const c = pf >= 5 ? 'tf-dbl' : h1 ? (pf >= 3 ? 'tf-dbl' : pf === 2 ? 'tf-bonus' : '') : (pf >= 4 ? 'tf-dbl' : pf === 3 ? 'tf-bonus' : '');
        return `<tr><td class="l">${p.num ? `<span class="pnum">#${esc(p.num)}</span> ` : ''}${esc(p.name || '')}</td><td>${esc(p.pos || '')}</td><td class="${c}">${pf}</td><td class="${pmCls(pm)}">${sgn(pm)}</td><td class="l small">${esc(p.note || '')}</td></tr>`; }).join('')}</table></div>`; };
  const dots = t => { const L = { full: FULL_TOS - tosUsed(g, t, 'full'), s30: S30_TOS + otCount(g) - tosUsed(g, t, 's30') };
    return `${'<span class="to-dot"></span>'.repeat(Math.max(0, L.s30))}<span style="width:4px;display:inline-block"></span>${'<span class="to-dot full"></span>'.repeat(Math.max(0, L.full))}`; };
  const fouls = t => { const n = teamFouls(g, t, per), c = n >= 10 ? 'tf-dbl' : n >= 7 ? 'tf-bonus' : n >= 5 ? 'tf-warn' : ''; return `<b class="${c}">${n}</b>`; };
  const caller = calledBy ? `${esc(teamName(g, calledBy))} ${kind === 's30' ? '30-second' : 'full'} timeout` : 'Huddle';
  /* END OF HALF — in the Huddle only (the live screen already shows fouls and timeouts beside the score): once a
     clock has been entered and there are 4:00 or less in the period. Fouls to give before the bonus (7th foul;
     double at 10), timeouts left, possessions needed, rough possessions left each, team FT tonight (tracked). */
  const eoh = (() => {
    const ck = clockNow(g, D), secs = clock != null ? clock : ck ? ck.perSecs : null; if (secs == null || secs > 240) return '';
    const m = G.pts.a - G.pts.b, need = n => Math.ceil(n / 3);

    const give = n => Math.max(0, 6 - n), bon = (n, who) => n >= 10 ? `${who} in the double bonus` : n >= 7 ? `${who} in the bonus (1-and-1)` : 'bonus on the 7th';
    const TOL = t => ({ full: FULL_TOS - tosUsed(g, t, 'full'), s30: S30_TOS + otCount(g) - tosUsed(g, t, 's30') });
    const FT = ffTracked(g, 'G'), ft = t => `${FT[t].ftm}-${FT[t].fta}${FT[t].fta ? ' · ' + Math.round(100 * FT[t].ftm / FT[t].fta) + '%' : ''}`;

    </div>

/* ± FOULS / TOs: team fouls (this half), timeouts, and every player's fouls on both teams. A player's + logs a foul on him

/* FIX A SUB (tap a sub in the feed): who was really on the floor after it, for both teams. Lit = on the floor; tap to
   swap until each team has five lit, Save. Every possession from this sub to that team's next one is then counted with the
   fixed five (lineups, +/-, stints, on/off: all worked out from the plays). The other team's sub at the same moment (next
   to this one in the log) is fixed with it; if that team had none, changing its five logs one right after this sub (a sub
   missed at the time). Later subs are whole fives, so a mistake usually rode along: "Fix the later subs too" makes the
   same swap in each later sub of that team that still has the wrong player, stopping once he's been subbed out. Plays
   tagged to a player (fouls, free throws) stay his. */
let SUBED = null;
function subFixPlan(g, was0, five, team, at) {
  const was = new Set(was0), now = new Set(five), out = [...was].filter(x => !now.has(x)), inn = [...now].filter(x => !was.has(x));
  const later = g.ev.filter((x, i) => x.t === 'sub' && x.team === team && i > at);
  const pairs = out.map((o, i) => ({ o, n: inn[i], live: true })), hits = [];
  later.forEach(x => { const f = x.five.slice(); let ch = false;
    pairs.forEach(pr => { if (!pr.live || pr.n == null) return; const i = f.indexOf(pr.o);
      if (i < 0 || f.includes(pr.n)) { pr.live = false; return; }   // he was subbed out (or the fix is already there): stop
      f[i] = pr.n; ch = true; });
    if (ch) hits.push({ x, five: f }); });
  return { out, inn, hits };
}
// Both teams' side of the sub being fixed: { e (that team's sub at this moment, or null), was (its five before the fix), at }.
function subSides(g, e) {
  const i0 = g.ev.indexOf(e), S = { [e.team]: { e, was: e.five.slice(), at: i0 } }, o = other(e.team);
  let p = null;
  for (const d of [1, -1]) for (let i = i0 + d; i >= 0 && i < g.ev.length && g.ev[i].t === 'sub' && g.ev[i].per === e.per; i += d) if (g.ev[i].team === o) { p = p || g.ev[i]; break; }
  if (p) S[o] = { e: p, was: p.five.slice(), at: g.ev.indexOf(p) };
  else { const prev = g.ev.slice(0, i0).filter(x => x.t === 'sub' && x.team === o).pop(); S[o] = { e: null, was: prev ? prev.five.slice() : [], at: i0 }; }
  return S;
}
function subEditModal(id) {
  const g = cur(), e = g.ev.find(x => x.id === id); if (!e || e.t !== 'sub') return;
  const SD = subSides(g, e);
  if (!SUBED || SUBED.id !== id) SUBED = { id, five: { a: new Set(SD.a.was), b: new Set(SD.b.was) }, later: { a: true, b: true } };
  const first = isLocked(g, e);
  const plans = {}, ok = {};
  ['a', 'b'].forEach(t => { const n = SUBED.five[t].size; plans[t] = n === 5 ? subFixPlan(g, SD[t].was, [...SUBED.five[t]], t, SD[t].at) : null;
    ok[t] = n === 5 || (n === 0 && !SD[t].was.length); });
  const changed = ['a', 'b'].some(t => plans[t] && plans[t].out.length + plans[t].inn.length);
  const side = t => { const S = SUBED.five[t], n = S.size, was = SD[t].was, plan = plans[t], ch = plan && (plan.out.length + plan.inn.length);
    const ps = teamPlayers(g, t), btn = p => `<button class="sub-p ${S.has(p.id) ? 'in' : ''}" data-act="se-p" data-t="${t}" data-p="${esc(p.id)}">${p.num ? `<span class="pnum">#${esc(p.num)}</span>` : ''}${esc(p.name ? lastName(p.name) : '')}${was.includes(p.id) && !S.has(p.id) ? '<span class="tiny se-tag">COMING OFF</span>' : !was.includes(p.id) && S.has(p.id) ? '<span class="tiny se-tag">GOING IN</span>' : ''}</button>`;
    return `<div class="se-team"><div class="lbl">${esc(teamName(g, t))}${SD[t].e ? '' : ' <span class="muted">· no sub here</span>'}</div>
      <div class="sub-lbl">On the floor <span class="muted">${n}/5</span>${n > 5 ? ` <b class="sub-off">tap ${n - 5} off</b>` : n && n < 5 ? ` <b class="sub-off">tap ${5 - n} on</b>` : ''}</div>
      <div class="sub-grid sub-floor">${ps.filter(p => S.has(p.id)).map(btn).join('')}</div>
      <div class="sub-lbl">Bench</div><div class="sub-grid">${ps.filter(p => !S.has(p.id)).map(btn).join('')}</div>
      ${ch ? `<div class="se-sum"><b>${plan.out.map(id => esc(pShort(g, t, id))).join(', ') || '—'}</b> → <b>${plan.inn.map(id => esc(pShort(g, t, id))).join(', ') || '—'}</b>${plan.hits.length ? `
        <label class="se-later"><input type="checkbox" data-act="se-later" data-t="${t}" ${SUBED.later[t] ? 'checked' : ''}> Fix the later subs too <span class="muted">(${plan.hits.length} later sub${plan.hits.length > 1 ? 's' : ''} still ha${plan.hits.length > 1 ? 've' : 's'} ${plan.out.map(id => esc(pShort(g, t, id))).join(', ')} on)</span></label>` : '<span class="muted"> · no later sub has the wrong player</span>'}</div>` : ''}</div>`; };
  modal(`<div class="sub-head"><h2>Fix this ${first ? 'starting five' : 'sub'}</h2><div class="sub-top"><button class="btn btn-lg" data-act="se-cancel">Cancel</button><button class="btn btn-good btn-lg" data-act="se-save" ${ok.a && ok.b && changed ? '' : 'disabled'}>Save</button></div></div>
    <div class="small muted" style="margin:6px 0 4px">${esc(PER_NAME(e.per))} · lit = on the floor after this ${first ? 'tip' : 'sub'}, both teams. Tap to swap until the right fives are lit.</div>
    ${side('a')}${side('b')}

/* ---------- scouting report ----------
   Same IndexedDB store as the game tracker ('gt_files', same site), so a PDF added in either
   shows in both. The game's PDF: the one picked here, else the opponent's from the game tracker. */
function idb() {
  return new Promise((res, rej) => { const r = indexedDB.open('gt_files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const r = db.transaction('files').objectStore('files').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

async function pdfjs() {
  if (SC.lib) return SC.lib;
  const lib = await import(new URL('../game/vendor/pdf.min.mjs', location.href).href);
  lib.GlobalWorkerOptions.workerSrc = new URL('../game/vendor/pdf.worker.min.mjs', location.href).href;
  return SC.lib = lib;
}
function oppScoutKey(g) {
  const o = lsGet('gt_opp_rosters', []).find(x => x && x.name && x.name.toLowerCase() === String(g.opp).toLowerCase());
  return o && o.scoutKey || null;
}
async function openScout(fromFile) {
  const g = cur(); $('#scout').classList.remove('hidden');
  // The opponent file: this game's opponent, unless opened for another team (Schedule / Rosters / New game). The Scout
  // button opens on the scouting PDF; its Last time tab (or 📁 Last time elsewhere) shows the file.
  if (!fromFile) { OF.opp = g ? g.opp : null; OF.sel = null; OF.mode = 'pdf'; }
  scoutTabs();
  let keys = [];
  try { keys = await idbKeys(); } catch (e) { toast('This browser blocks offline file storage'); }
  const recs = await Promise.all(keys.map(async k => ({ k, r: await idbGet(k) })));
  const same = !OF.opp || !g || normOpp(OF.opp) === normOpp(g.opp);
  // A PDF picked for this game or opponent first, then the opponent's current report from the site (fetchReports).
  const pref = [same && g && g.scoutKey, OF.opp && oppScoutKey({ opp: OF.opp }), OF.opp && repKey(OF.opp), same && SC.key].find(k => k && keys.includes(k)) || '';
  $('#sc-sel').innerHTML = recs.length ? `${pref ? '' : '<option value="">— pick a report —</option>'}${recs.map(x => `<option value="${esc(x.k)}" ${x.k === pref ? 'selected' : ''}>${esc(x.r && x.r.name || x.k)}</option>`).join('')}`
    : '<option value="">No PDFs on this iPad yet — Add PDF…</option>';

async function showScout(key) {
  const box = $('#sc-pages'), token = ++SC.token;

  if (SC.doc) { try { SC.doc.destroy(); } catch (e) {} SC.doc = null; }
  if (!key) { box.innerHTML = '<div class="sc-empty">Pick the scouting report above, or Add PDF…. It is saved on this iPad and opens without wifi.</div>'; return; }
  box.innerHTML = '<div class="sc-empty">Loading…</div>';
  const rec = await idbGet(key);
  const bytes = rec && (rec.data || (rec.blob && await rec.blob.arrayBuffer()));
  if (token !== SC.token) return;
  if (!bytes) { box.innerHTML = '<div class="sc-empty">That PDF is no longer on this iPad.</div>'; return; }
  let lib;
  try { lib = await pdfjs(); }
  catch (e) { box.innerHTML = `<iframe src="${URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }))}" style="width:100%;height:100%;border:0;background:#fff"></iframe>`; return; }
  try { SC.doc = await lib.getDocument({ data: new Uint8Array(bytes.slice(0)) }).promise; }

// Pages are drawn as they scroll near and dropped when far away, so a long report fits in an iPad's memory.

}

function shIndivOrtg(s, MP, tMP5, tS, oS) {
  if (!(MP > 0 && tMP5 > 0 && (s.fga > 0 || s.fta > 0 || s.tov > 0 || s.ast > 0 || s.oreb > 0))) return null;

  const den = (1 - tORBpct) * tPlayPct + tORBpct * (1 - tPlayPct);

/* ---------- saved reports ----------
   A copy of the halftime / post-game report as it was, kept on the iPad (IndexedDB 'pt2_reports'), apart from
   the game, so it stays even if the game is edited or deleted. Saved by itself at Start 2nd half, at Final and
   whenever a stat sheet is saved; 💾 Save report saves one any time. One halftime and one post-game copy per
   game, the newest kept. Listed on the Games tab; Open shows it as saved, with Print / PDF. */

function rpDb() {

}

  tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined); tx.onerror = () => rej(tx.error); }); }
const rpAll = () => rpTx('readonly', st => st.getAll());

async function snapReport(g, kind, quiet) {

const rpWhen = iso => { const d = new Date(iso); return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };

  const el = document.getElementById('saved-reports'); if (!el) return;

  list.sort((x, y) => (y.date || '').localeCompare(x.date || '') || (x.kind === 'half' ? 1 : -1) - (y.kind === 'half' ? 1 : -1) || y.at.localeCompare(x.at));

      <span class="small">Moorpark ${r.score.a} – ${r.score.b}${r.sheet ? ' · full report (stat sheet)' : ''} · saved ${esc(rpWhen(r.at))}</span></div>
      <button class="btn btn-sm btn-good" data-act="rp-open" data-id="${esc(r.id)}">Open</button><button class="btn btn-sm btn-bad" data-act="rp-del" data-id="${esc(r.id)}">Delete</button></div>`).join('')

  el.innerHTML = `<div class="page-head snap-head"><button class="btn btn-sm" data-act="rp-back">◀ Saved reports</button><div class="small muted" style="margin-left:6px">${r.kind === 'half' ? 'Halftime' : 'Post-game'} · ${esc(r.opp)} · ${esc(r.date || '')} · saved ${esc(rpWhen(r.at))}</div>

/* ---------- opponent file: "Last time vs …" ----------

function oppGames(name) {

const AB_STATS = ['asp', 'rim'];
/* STOP THE RUN score: the five's net rating, minus 10 for each run it allowed per 20 defensive possessions (about a

/* FOULED OUT → PLUG IN: on the forced-sub screen, the best single players to replace the one who fouled
   out, for the situation right now. Late with a lead → best FT%; late and down → best 3P% (down 4-9) or
   steals; foul trouble / bonus → fewest fouls; otherwise how the five with him in has done: the season
   (opponent-adjusted, leverage-weighted) and tonight, then his +/- tonight. Same position as the player

  const season = new Map(adjUnits(A, 'all').map(u => [fiveKey(u.players.map(p => p.name)), u]));

  const MODES = {
    stop: { lbl: 'steals + blocks / 40', v: id => plPer40(id, 'STL', 'BLK'), hi: true, why: c => `Up ${c.m}, their ball: ranked by steals + blocks` },
    ft: { lbl: 'closing FT%', v: id => closingFt(id), hi: true, pct: 1, made: 'FTM', att: 'FTA', why: c => `Up ${c.m} late: ranked by closing FT% (season + clutch FTs)` },
    ball: { lbl: 'TO / 40', v: id => plPer40(id, 'TO'), hi: false, why: c => `Up ${c.m} late: ranked by fewest turnovers` },
    steal: { lbl: 'steals / 40', v: id => plPer40(id, 'STL'), hi: true, why: c => `Down ${-c.m} late: ranked by steals` },
    three: { lbl: '3P%', v: id => plPct(A, id, '3PM', '3PA'), hi: true, pct: 1, made: '3PM', att: '3PA', why: c => `Down ${-c.m} late: ranked by 3P%` },
    foul: { lbl: 'fouls / 40', v: id => plPer40(id, 'PF'), hi: false, why: () => 'Foul trouble: ranked by fewest fouls' },
    two: { lbl: 'blocks + def reb / 40', v: id => plPer40(id, 'BLK', 'DREB'), hi: true, why: () => 'They\'re scoring inside: ranked by blocks + defensive rebounds' },
    ast: { lbl: 'assists / 40', v: id => plPer40(id, 'AST'), hi: true, why: () => 'The ball is sticking: ranked by assists' },
    glass: { lbl: 'def reb / 40', v: id => plPer40(id, 'DREB'), hi: true, why: () => 'They\'re winning the glass: ranked by defensive rebounds' } };

  const rows = teamPlayers(g, 'a').filter(p => ok(p.id)).map(p => {
    const f = [...base, p.id], k = fiveKey(f), tu = today.get(k), su = season.get(k);
    const tNet = tu && tu.oPoss >= 3 && tu.dPoss >= 3 ? 100 * tu.pf / tu.oPoss - 100 * tu.pa / tu.dPoss : null, tP = tu ? Math.floor((tu.oPoss + tu.dPoss) / 2) : 0;
    const sNet = su && su.oT >= 10 && su.dT >= 10 ? su.adjNet : null, sP = su ? Math.floor((su.oT + su.dT) / 2) : 0;
    const pm = (L.players[p.id] || { pm: 0 }).pm, pos = (p.pos || '').toUpperCase(), same = !!outPos && !!pos && (pos === outPos || pos.split(/[\/-]/).some(x => outPos.split(/[\/-]/).includes(x)));

      <button class="btn btn-good" data-act="plug" data-out="${esc(outId)}" data-p="${esc(r.p.id)}">Plug in</button></div>`).join('')}</div>`;

/* ---------- THIS FIVE: what the five on the floor does well (and badly), in the old Team / bench row ----------
   One line: the five's best strength (green) and its worst weakness (red ✕).
   From each player's season line (quality games; ours from the stat sheets / leaderboard; at halftime the 1st-half
   sheet joins it when the game is close against a good team, so the 2nd half adapts) and, where a player has no
   line yet (every opponent for now), from his position and the labels on his card (Shooter, Big, Ball hawk...).
   Tap a label: who earned it, with their numbers. */
/* SHOOTING: everything we have, combined into two numbers.
   Estimated 3P% = his quality-game makes and attempts, pulled toward a starting guess until they add up (the
   guess counts as 50 attempts). The guess is HIS OWN 3P% over all his games (the leaderboard's box scores, which
   the tracker downloads with the ratings); only a player with almost no threes anywhere (under 10) starts from
   the team's 3P% moved by your card label (Shooter +3, Can't shoot -4). By February his own threes decide.
   (FT% is not used: it isn't the mark of a distance shooter.)
   Volume = does he take them: 3PA rate (share of his shots that are threes, 10+ FGA) or 3PA a game, whichever
   says more (40% of his shots or 2.0 a game = full volume).
   Shooter: full volume and est. 3P% 32%+, or most of the volume (75%) and est. 36%+.
   Non-shooter: est. 3P% under 28%, or he barely takes them (under 15% of his shots on 20+ FGA, or under 0.5 a game
   over 3+ games). In between: neither.
   FT RATE (FTA / FGA, 15+ FGA) is a different skill: how often he attacks the basket and gets fouled. 45%+ makes
   him an attacker; two on the floor = "Attack the rim". It also shows next to a non-shooter, so a guard who can't
   shoot but gets to the line reads differently from one who does neither.

   is not "G can't shoot": that is a guard who neither shoots nor attacks. */
const FL = { K3: 50, TAG_SH: 3, TAG_NS: -4, VOL_RATE: 40, VOL_PG: 2.0, SH_EST: 32, SH_EST_HI: 36, SH_VOL_HI: 0.75, NS_EST: 28, NS_RATE: 15, NS_FGA: 20, NS_PG: 0.5, NS_GAMES: 3, FTR_HI: 45, FTR_FGA: 15, HAWK: 2.5, RIM: 2.5, TO: 4, PF: 6, FT_LO: 62, FT_HI: 75, FT_MIN: 6, AST_HI: 18 };
const flTag = (p, re) => noteLabels(p.note).some(x => re.test(x));
// An opponent's player in his team's leaderboard file: by jersey number, else by last name.
function oppFileLine(g, p) {
  const F = teamFile(g.opp); if (!F || !F.players) return null;
  const E = Object.entries(F.players), ln = s => lastName(String(s || '')).toLowerCase();
  const byNum = p.num ? E.filter(([, v]) => String(v.num) === String(p.num)) : [];
  const hit = (p.name && byNum.find(([n]) => ln(n) === ln(p.name))) || (byNum.length === 1 && byNum[0]) || (p.name && E.find(([n]) => ln(n) === ln(p.name)));
  return hit ? { name: hit[0], ...hit[1] } : null;
}
function flPlayer(g, t, id) {
  const p0 = pInfo(g, t, id), of = t === 'b' ? oppFileLine(g, p0) : null, p = p0;
  const x = t === 'a' ? plSeason().P[id] : of ? ((of.quality && (of.quality.games || 0) >= 3) ? of.quality : of.all) : null, pos = String(p.pos || '').toUpperCase(), min = x && (x.MIN || 0) >= 60 ? x.MIN : 0;

  const a3 = x ? x['3PA'] || 0 : 0, m3 = x ? x['3PM'] || 0 : 0, fga = x ? x.FGA || 0 : 0, pg3 = gp ? a3 / gp : null, p3 = a3 ? 100 * m3 / a3 : null;
  const ft = x && (x.FTA || 0) >= FL.FT_MIN ? 100 * (x.FTM || 0) / x.FTA : null, rate = fga >= 10 ? 100 * a3 / fga : null, ftr = fga >= FL.FTR_FGA ? 100 * (x.FTA || 0) / fga : null;
  const T = t === 'a' ? plSeason().T || {} : (() => { const z = {}; Object.values((teamFile(g.opp) || {}).players || {}).forEach(v => { const l = v.all || {}; z['3PA'] = (z['3PA'] || 0) + (l['3PA'] || 0); z['3PM'] = (z['3PM'] || 0) + (l['3PM'] || 0); }); return z; })();
  const base = T['3PA'] ? 100 * (T['3PM'] || 0) / T['3PA'] : 32;
  const tagS = flTag(p, /^shooter$|^sniper$|^3pt|^knockdown/i), tagN = flTag(p, /can'?t shoot|non-?shooter|no 3|bad 3/i);
  const A = luAdj(), allL = t === 'a' ? A && A.playerSeason && A.playerSeason[id] && A.playerSeason[id].all : of && of.all, aa = allL ? allL['3PA'] || 0 : 0;

  const prior = aa >= 10 ? 100 * ((allL['3PM'] || 0) + 20 * tagged / 100) / (aa + 20) : tagged;   // his all-games 3P% (lightly steadied)
  const est = x ? 100 * (m3 + FL.K3 * prior / 100) / (a3 + FL.K3) : null;
  const vol = x ? Math.max(rate != null ? rate / FL.VOL_RATE : 0, pg3 != null ? pg3 / FL.VOL_PG : 0) : null;
  const sh = x ? (vol >= 1 && est >= FL.SH_EST) || (vol >= FL.SH_VOL_HI && est >= FL.SH_EST_HI) : null;
  const ns = x ? est < FL.NS_EST || (fga >= FL.NS_FGA && rate < FL.NS_RATE) || (gp >= FL.NS_GAMES && pg3 < FL.NS_PG) : null;
  const inch = (() => { const m = String(p.ht || '').match(/(\d)\D+(\d{1,2})/); return m ? 12 * +m[1] + +m[2] : null; })();
  return { id, num: p.num, name: p.name, p3, m3, ft, a3, pg3, rate, est, ftr, fta: x ? x.FTA || 0 : 0,
    attacker: ftr != null ? ftr >= FL.FTR_HI : flTag(p, /attack|driver|downhill|slasher/i),   // slasher = this + non-shooter (fiveLabels)
    stl: per40('STL'), blk: per40('BLK'), reb: min ? 40 * ((x.OREB || 0) + (x.DREB || 0)) / min : null, ast: per40('AST'), to: per40('TO'), pf: per40('PF'),
    shooter: sh != null ? sh : tagS, nonShooter: ns != null ? ns : tagN,
    big: /^(C|PF|F|F\/C|C\/F|4|5)$/.test(pos) || (inch != null && inch >= 79) || flTag(p, /^big$|^post$|^center$|^5$/i),
    guard: /^(G|PG|SG|1|2|G\/W)$/.test(pos), posKnown: !!pos || inch != null,
    hawk: p.stl == null && per40('STL') == null ? flTag(p, /ball ?hawk|steals|hands/i) : per40('STL') >= FL.HAWK,

/* ---------- Runs: kills, kill shots and runs ----------
   KILL       3 straight stops (6 = skunk, 9 = dead skunk), the tracker's kill rules, per half / OT.
   KILL SHOT  10-0 unanswered (technical FTs count, it carries across the half), as on the Report.
   RUN        6-0 unanswered, or +8 holding the other side to 40% of the points (10-2, 15-6, 22-5; not 8-7),
              as wide as it goes inside a half, stopped by the other side's own 6-0 (teamRuns in app.js).
   For each one: who achieved it, the five on the floor (ours and theirs), the half and how many trips into
   it (possession count, never a clock estimate), the score, what started it and what ended it. A kill is
   credited to the five on the floor when its 3rd stop happens; a kill shot or run to the five on when it
   started. Garbage time is out. Season = every game tracked here (no scrimmages); Quality = only against
   an opponent with a positive adjusted net (needs the ⬆ Adjusted file). */
const RN_MIN_POSS = 25;
const RN_START = [['half', 'Start of a half'], ['to-own', 'Out of their own timeout'], ['to-opp', "After the other side's timeout"], ['sub-own', 'Fresh five (2+ subs)'],
  ['sub-opp', 'Other side just subbed 2+'], ['lbto', 'After forcing a live-ball TO'], ['to', 'After forcing a dead-ball TO'], ['ftx', 'After the other side missed FTs'], ['miss', 'After a stop on a missed shot']];
const RN_END = [['3', 'Made 3'], ['2', 'Made 2'], ['FT', 'Foul → FTs'], ['timeout', 'Timeout, then they scored'], ['half', 'End of the half'], ['tech', 'Technical FTs']];
const rnLbl = (L, k) => (L.find(x => x[0] === k) || [k, k])[1];
let RN_MEMO = new Map();
function runsGame(g) {
  const stamp = g.ev.length + ':' + (g.ev.length ? g.ev[g.ev.length - 1].id : '') + ':' + (g.gtFrom || '') + (g.gtOff ? 'x' : '') + (g.final ? 'f' : '');
  const m = RN_MEMO.get(g.id); if (m && m.stamp === stamp) return m.v;
  const D = derive(g), P = D.poss, eIdx = new Map(g.ev.map((e, i) => [e.id, i])), byEv = new Map();
  P.forEach((p, i) => { p._i = i; p.plays.forEach(e => byEv.set(e.id, p)); });
  const st = p => eIdx.get(p.plays[0].id);
  // Timeouts and subs after possession i-1 started and before possession i.
  const between = i => { const a = i > 0 ? st(P[i - 1]) : -1, b = st(P[i]); return g.ev.slice(a + 1, b).filter(e => e.t === 'to' || e.t === 'sub'); };
  const trip = p => Math.ceil((p.seq || 1) / 2);
  const started = (i, who) => { const p = P[i], prev = P[i - 1], out = new Set(), vic = other(who);
    if (!prev || prev.per !== p.per || p.seq <= 2) out.add('half');
    if (i > 0) between(i).forEach(e => { if (e.t === 'to') out.add(e.team === who ? 'to-own' : 'to-opp'); });
