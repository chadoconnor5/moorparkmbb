<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MBB Poss">
<meta name="theme-color" content="#2f5aa8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../game/icon-180.png">
<title>Moorpark Possession Tracking</title>
<style>
/* The jamboree possession sheet, digitized: the same yellow bars, blue STOP / KILL columns and
   grid, so a coach who charted on paper reads this without learning anything new. */
:root{
  --ink:#1f2937; --mut:#6b7280; --line:#c4c9d1; --line2:#9aa3af; --bg:#f3f4f6; --card:#fff;
  --yellow:#ffe14d; --yellow2:#fff6c2; --blue:#2f5aa8; --blue2:#dbe6f7; --blue3:#eef3fb;
  --red:#c62828; --good:#15803d; --row-light:#eef0f3; --row-dark:#d2d7df;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.wrap{max-width:900px;margin:0 auto;padding:10px 12px 60px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top h1{margin:0;font-size:20px;color:var(--blue);font-weight:800;letter-spacing:.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.top img{width:38px;height:38px;object-fit:contain}
.btn{background:#fff;border:1px solid var(--line2);border-radius:9px;padding:9px 13px;font-weight:600;font-size:14px}
.btn:active{filter:brightness(.92)}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-red{color:var(--red);border-color:#e7b4b4}
.btn-sm{padding:6px 10px;font-size:13px}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:4px;margin-bottom:12px;overflow:hidden}
.bar{background:var(--yellow);border-bottom:1.5px solid var(--ink);text-align:center;font-weight:800;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:10px}
.bar .r{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:600}
.pad{padding:10px 12px}
.muted{color:var(--mut)} .small{font-size:12.5px}

/* scorebug */
.bug{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 12px}
.side{text-align:center}
.side .nm{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.side.a .nm{color:var(--blue)} .side.b .nm{color:var(--red)}
.side .sc{font-size:46px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.side .ppp{font-size:12.5px;color:var(--mut)}
.mid{text-align:center}
.per{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.per button{border:1.5px solid var(--ink);background:#fff;border-radius:6px;padding:6px 10px;font-weight:800;font-size:14px}
.per button.on{background:var(--ink);color:#fff}
.mid .possn{margin-top:6px;font-size:13px;color:var(--mut)}
.mid .possn b{color:var(--ink);font-size:17px}
.streak{display:flex;gap:5px;justify-content:center;margin-top:6px;align-items:center;font-size:12px;color:var(--mut)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--blue);display:inline-block}
.dot.on{background:var(--blue)}
.mpk-btns{display:flex;gap:6px;justify-content:center;margin-top:6px}
.mpk-btns button{border:1.5px solid var(--blue);background:var(--blue3);color:var(--blue);border-radius:8px;min-width:48px;padding:8px 0;font-weight:800;font-size:17px}
.mpk-btns button.minus{border-color:var(--line2);background:#fff;color:var(--mut);min-width:40px}
.bonus{display:inline-block;margin-top:3px;font-size:11px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:4px;background:var(--yellow);color:#7a5b00}
.bonus.dbl{background:var(--red);color:#fff}

/* entry */
.entry{display:grid;grid-template-columns:230px 1fr;gap:12px;padding:12px}
.numbox{border:1.5px solid var(--ink);border-radius:6px;height:56px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:8px}
.numbox.empty{color:#b8bec7;font-size:18px;font-weight:700}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys button{height:50px;border:1px solid var(--line2);background:#f8f9fb;border-radius:8px;font-size:21px;font-weight:700}
.recent{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-height:30px}
.recent button{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:4px 9px;font-weight:700;font-size:14px}
.recent button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res button{height:66px;border-radius:10px;border:1.5px solid var(--ink);font-size:22px;font-weight:800;background:#fff}
.res .make{background:#fff6c2}
.res .miss{background:#fde8e8;color:var(--red)}
.res .stop{background:var(--blue2);color:var(--blue)}
.res .wide{grid-column:span 3}
.res button small{display:block;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.04em}
.togs{display:flex;gap:8px;margin-top:8px}
.togs button{flex:1;height:48px;border-radius:9px;border:1.5px dashed var(--line2);background:#fff;font-weight:700;font-size:15px}
.togs button.on{border-style:solid;border-color:var(--ink);background:var(--ink);color:#fff}
.lastline{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13.5px}
.lastline .txt{flex:1;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the sheet grid */
.logwrap{max-height:430px;overflow:auto}
table.sheet{border-collapse:collapse;width:100%;font-size:14px;table-layout:fixed}
.sheet th{background:var(--yellow);border:1px solid var(--ink);font-size:11px;font-weight:800;padding:4px 2px;position:sticky;top:0;z-index:1}
.sheet th.st{background:var(--blue2);color:var(--blue)}
.sheet th.kl{background:var(--blue);color:#fff}
.sheet th.x{color:var(--red)}
.sheet td{border:1px solid var(--line);text-align:center;padding:0;height:34px;font-weight:700}
.sheet tbody tr:nth-child(odd) td{background:var(--row-light)} .sheet tbody tr:nth-child(even) td{background:var(--row-dark)}
.sheet th:nth-child(1){width:48px} .sheet th:nth-child(2){width:74px} .sheet th:nth-child(12){width:50px} .sheet th:nth-child(13){width:50px}
.sheet td.pn{font-weight:800}
.sheet td.m{font-size:18px;line-height:1}
.sheet td.mx{color:var(--red)} .sheet td.ms{color:var(--blue)}
.sheet td.pts{width:46px;font-size:16px}
.sheet td.kill{width:44px;color:var(--blue);font-size:17px}
.sheet tr.killrow td.kill{background:var(--blue)!important;color:#fff}
.sheet tr.sub td{background:#fff!important;font-size:11.5px;letter-spacing:.06em;color:var(--mut);height:28px;font-weight:800}
.sheet tr.hl td{background:#fef9c3!important}
.sheet tbody tr:not(.sub){cursor:pointer}
.sheet .tiny{font-size:10px;color:var(--mut);font-weight:700}
.empty-log{padding:22px;text-align:center;color:var(--mut)}

/* fouls + timeouts */
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tf .lbl{width:84px;font-size:12px;font-weight:800;letter-spacing:.04em}
.boxes{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;flex:1}
.boxes span{height:26px;border:1px solid var(--line2);border-radius:3px;font-size:9px;color:var(--mut);padding:1px 2px;position:relative;background:#fff}
.boxes span.b7,.boxes span.b10{background:var(--blue2)}
.boxes span.on::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--ink)}
.tf .add{width:44px;height:34px;border-radius:7px;border:1.5px solid var(--ink);background:#fff;font-weight:800;font-size:18px}
.tf .minus{width:34px;height:34px;border-radius:7px;border:1px solid var(--line2);background:#fff;color:var(--mut);font-weight:800}
.to-team{margin-bottom:10px}
.to-team .lbl{font-size:12px;font-weight:800;letter-spacing:.04em;margin-bottom:4px}
.to-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.to-row .k{font-size:11px;color:var(--mut);font-weight:700;width:52px}
.tob{width:36px;height:36px;border:1.5px solid var(--ink);border-radius:5px;background:#fff;font-size:20px;font-weight:800;padding:0}
.tob.on{background:var(--ink);color:#fff}
.tob.ot{border-style:dashed}

/* summary */
.sum{width:100%;border-collapse:collapse;font-size:14px}
.sum th,.sum td{border:1px solid var(--line);padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums}
.sum th{background:var(--blue);color:#fff;font-size:11.5px;letter-spacing:.06em}
.sum th.y{background:var(--yellow);color:var(--ink)}
.sum td:first-child,.sum th:first-child{text-align:left;font-weight:800}
.sum tbody tr:nth-child(odd) td{background:var(--row-light)} .sum tbody tr:nth-child(even) td{background:var(--row-dark)}
.sum tr.tot td{background:#fff!important;font-weight:800;border-top:2px solid var(--ink)}
.sum td.ppp{font-weight:800}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;padding:16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{margin:0 0 10px;font-size:19px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line2);border-radius:8px;background:#fff}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line2);background:#fff;border-radius:8px;padding:9px;font-weight:700}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.foot .big{flex:1;min-height:56px;font-size:18px;font-weight:800}
.glist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.gitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.gitem.cur{border-color:var(--blue);background:var(--blue3)}
.gitem .t{flex:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.ver{font-size:11px;color:var(--mut);text-align:center;margin-top:16px}
.print-only{display:none}
.hidden{display:none!important}
/* four factors from the printed box score */
#ff{position:fixed;inset:0;z-index:41;background:var(--bg);overflow:auto}
#ff .wrap{padding-top:10px}
.ff-in{display:grid;grid-template-columns:1fr 250px;gap:12px;padding:12px}
.ffg{width:100%;border-collapse:collapse}
.ffg th{font-size:12px;letter-spacing:.06em;padding:4px;text-align:center}
.ffg th.a{color:var(--blue)} .ffg th.b{color:var(--red)}
.ffg td{padding:3px}
.ffg td.l{font-weight:800;font-size:14px;width:70px}
.ffc{width:100%;height:44px;border:1.5px solid var(--line2);border-radius:8px;background:#fff;font-size:21px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.ffc.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--yellow)}
.ffc.bad{color:var(--red);border-color:var(--red)}
.ffg tr.calc td{font-size:14px;color:var(--mut);text-align:center;font-weight:700}
.ffk{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-content:start}
.ffk button{height:62px;border:1px solid var(--line2);background:#f8f9fb;border-radius:10px;font-size:24px;font-weight:800}
.ffk .nx{grid-column:span 3;background:var(--blue);color:#fff;border-color:var(--blue);font-size:19px}
.ffk .cur{grid-column:span 3;height:auto;background:none;border:0;font-size:13px;font-weight:700;color:var(--mut);text-align:center;padding:2px}
.ffr{width:100%;border-collapse:collapse;font-size:15px}
.ffr th,.ffr td{border:1px solid var(--line);padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums}
.ffr th{background:var(--blue);color:#fff;font-size:12px;letter-spacing:.06em}
.ffr td:first-child,.ffr th:first-child{text-align:left;font-weight:800}
.ffr tr.grp td{background:var(--yellow)!important;font-size:11.5px;letter-spacing:.12em;text-align:left;font-weight:800;padding:5px 10px}
.ffr tbody tr:nth-child(odd) td{background:var(--row-light)} .ffr tbody tr:nth-child(even) td{background:var(--row-dark)}
.ffr td.win{font-weight:800}
.ffr td.win.a{color:#0b4fa8} .ffr td.win.b{color:var(--red)}
.ffr .sub{display:block;font-size:11px;color:var(--mut);font-weight:600}
@media (max-width:700px){.ff-in{grid-template-columns:1fr}}
/* scouting report: drawn with the game tracker's pdf.js, from the PDFs it keeps on this iPad */
#scout{position:fixed;inset:0;z-index:40;background:#2a2e37;display:flex;flex-direction:column}
.sc-head{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#fff;border-bottom:1.5px solid var(--ink);flex-wrap:wrap}
.sc-head select{flex:1;min-width:120px;font:inherit;font-size:15px;padding:7px 8px;border:1px solid var(--line2);border-radius:8px;background:#fff}
.sc-back{min-height:46px;font-size:16px;font-weight:800}
#sc-pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px}
.sc-page{margin:0 auto 12px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.sc-page canvas{display:block}
.sc-empty{color:#e5e7eb;padding:40px;text-align:center}
/* lineups */
.floor{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.floor .k{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--blue)}
.floor .p{background:var(--blue3);border:1px solid #b9cbe9;border-radius:6px;padding:4px 8px;font-weight:700;font-size:14px}
.floor .warn{color:#8a6100;font-weight:700}
.floor .sub{margin-left:auto;min-height:44px;min-width:110px;font-size:16px;font-weight:800}
.sheet tr.lu td{background:#fff!important;height:24px;font-size:11.5px;font-weight:700;color:var(--blue);text-align:left;padding:2px 8px;border-top:2px solid var(--blue)}
.subtop{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.subtop h2{flex:1;margin:0}
.subtop .btn{min-height:54px;min-width:130px;font-size:18px;font-weight:800}
.btn:disabled{opacity:.4}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{min-height:58px;border:1.5px solid var(--line2);border-radius:10px;background:#fff;font-size:15px;font-weight:700;text-align:left;padding:6px 10px}
.pick button b{display:block;font-size:19px}
.pick button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.from{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.from button{width:46px;height:42px;border-radius:8px;border:1.5px solid var(--ink);background:#fff;font-size:20px;font-weight:800}
.from .n{font-size:22px;font-weight:800;min-width:34px;text-align:center}
.lut{width:100%;border-collapse:collapse;font-size:13.5px}
.lut th,.lut td{border:1px solid var(--line);padding:6px 6px;text-align:right;font-variant-numeric:tabular-nums}
.lut th{background:var(--blue);color:#fff;font-size:11px;letter-spacing:.04em}
.lut td:first-child,.lut th:first-child{text-align:left}
.lut td:first-child{font-weight:600;font-size:12.5px;line-height:1.3}
.lut tbody tr:nth-child(odd) td{background:var(--row-light)} .lut tbody tr:nth-child(even) td{background:var(--row-dark)}
.lut tr.now td:first-child{box-shadow:inset 4px 0 0 var(--blue)}
.lut td.mx{color:var(--red);font-weight:700} .lut td.ms{color:var(--blue);font-weight:700}
.lut .tiny{font-size:10.5px;font-weight:500}
.scope{display:flex;gap:4px;margin-left:auto}
.scope button{border:1.5px solid var(--ink);background:#fff;border-radius:6px;padding:3px 9px;font-weight:800;font-size:12px;letter-spacing:0}
.scope button.on{background:var(--ink);color:#fff}

@media (max-width:700px){
  .entry{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
}
@media print{
  body{background:#fff}
  .no-print,.ov,.toast{display:none!important}
  .print-only{display:block}
  .logwrap{max-height:none;overflow:visible}
  .card{break-inside:avoid}
  .sheet th{position:static}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="scout" class="hidden">
  <div class="sc-head"><b>Scouting report</b><select id="sc-sel"></select>
    <button class="btn btn-sm" data-act="sc-add">Add PDF…</button>
    <button class="btn btn-sm" data-act="sc-zoom" data-z="-1">−</button><button class="btn btn-sm" data-act="sc-zoom" data-z="0">Fit</button><button class="btn btn-sm" data-act="sc-zoom" data-z="1">+</button>
    <button class="btn btn-blue sc-back" data-act="scout">◀ Back to sheet</button></div>
  <div id="sc-pages"></div>
</div>
<input type="file" id="sc-file" accept="application/pdf,.pdf" class="hidden">
<div id="ff" class="hidden"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const VERSION = 'v2026.10.12.5';
const LS_GAMES = 'pl_games', LS_CUR = 'pl_cur', LS_ROSTER = 'pl_roster';
const FULL_TOS = 3, S30_TOS = 4;          // regulation allotment per team, per game; +1 30-sec per OT

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Could not save — storage is full or blocked'); return false; } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const slug = s => String(s || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

let games = lsGet(LS_GAMES, []);
let curId = lsGet(LS_CUR, null);
let P = { num: '', and1: false, oreb: 0, hl: null };   // the possession being entered
const cur = () => games.find(g => g.id === curId) || null;
const save = () => { lsSet(LS_GAMES, games); lsSet(LS_CUR, curId); };

/* ---------- roster: our own, else the game tracker's (same site, same storage) ---------- */
function roster() {
  const own = lsGet(LS_ROSTER, null);
  if (Array.isArray(own) && own.length) return own;
  const gt = lsGet('gt_roster', []);
  return (Array.isArray(gt) ? gt : []).filter(r => r && r.name && !r.hidden).map(r => ({ num: String(r.num || ''), name: r.name }));
}
const rosterSorted = () => roster().slice().sort((a, b) => (parseInt(a.num) || 999) - (parseInt(b.num) || 999) || a.name.localeCompare(b.name));
function oppNames() {
  const s = new Set();
  lsGet('gt_opp_rosters', []).forEach(o => o && o.name && s.add(o.name));
  lsGet('gt_schedule', []).forEach(r => r && r.opp && !/^tbd$/i.test(r.opp) && s.add(r.opp));
  games.forEach(g => g.opp && s.add(g.opp));
  return [...s].sort();
}

/* ---------- periods ---------- */
const PER_NAME = p => p === '1H' ? '1st Half' : p === '2H' ? '2nd Half' : 'Overtime ' + p.slice(2);
const otCount = g => g.periods.filter(p => p.startsWith('OT')).length;
// Team fouls reset at halftime and carry from the 2nd half into every overtime.
const foulBucket = p => p === '1H' ? '1H' : '2H+';

/* ---------- possession results ---------- */
// res: '2' '3' 'FT' 'x2' 'x3' 'xFT' 'TO'; ft = free throws made on an FT trip; and1 adds one;
// stl marks a turnover that was a steal. Points are derived, never typed.
const ptsOf = e => e.res === '2' ? 2 + (e.and1 ? 1 : 0) : e.res === '3' ? 3 + (e.and1 ? 1 : 0) : e.res === 'FT' ? (e.ft || 0) : 0;
const RES_LABEL = { '2': '2', '3': '3', 'FT': 'FT', 'x2': '✗2', 'x3': '✗3', 'xFT': '✗FT', 'TO': 'TO' };
function describe(e) {
  const r = e.res === 'FT' ? `${e.ft} FT` : e.res === 'TO' ? (e.stl ? 'Steal' : 'Turnover') : RES_LABEL[e.res] + (e.and1 ? ' +1' : '');
  const p = ptsOf(e);
  return `${e.num ? '#' + e.num + ' ' : ''}${r}${p ? ' · ' + p + ' pts' : ' · stop'}${e.oreb ? ` · ${e.oreb} OREB` : ''}`;
}

/* Every possession of a period with its derived columns: number, points, stop, kill.
   KILL = three consecutive defensive stops; the count restarts after each kill and after any score,
   and at the start of every period. */
function periodRows(g, per) {
  let streak = 0, n = 0;
  return g.ev.filter(e => e.t === 'poss' && e.per === per).map(e => {
    const pts = ptsOf(e), stop = pts === 0;
    let kill = false;
    if (stop) { streak++; if (streak === 3) { kill = true; streak = 0; } } else streak = 0;
    return { e, n: ++n, pts, stop, kill, streak };
  });
}
function perStats(g, per) {
  const rows = periodRows(g, per);
  const opp = rows.reduce((s, r) => s + r.pts, 0);
  const mpk = g.ev.filter(e => e.t === 'mpk' && e.per === per).reduce((s, e) => s + e.pts, 0);
  const streak = rows.length ? rows[rows.length - 1].streak : 0;
  return { rows, poss: rows.length, opp, mpk, kills: rows.filter(r => r.kill).length,
           stops: rows.filter(r => r.stop).length, oreb: rows.reduce((s, r) => s + (r.e.oreb || 0), 0), streak };
}
function gameStats(g) {
  const per = g.periods.map(p => Object.assign({ per: p }, perStats(g, p)));
  const tot = per.reduce((t, s) => { ['poss', 'opp', 'mpk', 'kills', 'stops', 'oreb'].forEach(k => t[k] += s[k]); return t; },
                         { poss: 0, opp: 0, mpk: 0, kills: 0, stops: 0, oreb: 0 });
  return { per, tot };
}
const ppp = (pts, poss) => poss ? (pts / poss).toFixed(2) : '—';

/* ---------- lineups: every possession and every Moorpark basket carries the five on the floor ---------- */
const rosterMap = () => Object.fromEntries(roster().map(r => [r.name, r]));
const jn = (name, M) => parseInt(((M || rosterMap())[name] || {}).num) || 999;
const lastName = n => String(n).split(' ').slice(-1)[0];
const shortName = (n, M) => { const r = (M || rosterMap())[n]; return (r && r.num ? '#' + r.num + ' ' : '') + lastName(n); };
const fiveKey = f => f.slice().sort().join('|');
const fiveSorted = (f, M) => { M = M || rosterMap(); return f.slice().sort((a, b) => jn(a, M) - jn(b, M) || a.localeCompare(b)); };
const fiveNums = f => { const M = rosterMap(); return fiveSorted(f, M).map(n => (M[n] && M[n].num) ? n && M[n].num : lastName(n)).join(' · '); };
let LU_SCOPE = 'game';

// How each five's possessions ended — the sheet's own columns, counted per five.
const END_COLS = [['2', '2'], ['3', '3'], ['FT', 'FT'], ['x2', '✗2'], ['x3', '✗3'], ['xFT', '✗FT'], ['TO', 'TO'], ['STL', 'STL'], ['CHG', 'CHG']];
const endOf = e => e.res === 'TO' ? (e.chg ? 'CHG' : e.stl ? 'STL' : 'TO') : e.res;
function lineupStats(g, scope) {
  const pers = scope === 'game' ? g.periods : [g.per];
  const units = {};
  pers.forEach(per => periodRows(g, per).forEach(r => {
    const f = r.e.five; if (!f || !f.length) return;
    const k = fiveKey(f);
    const u = units[k] = units[k] || { five: f, poss: 0, opp: 0, kills: 0, end: {} };
    u.poss++; u.opp += r.pts; u.kills += r.kill ? 1 : 0;
    const x = endOf(r.e); u.end[x] = (u.end[x] || 0) + 1;
  }));
  return Object.values(units).sort((a, b) => b.poss - a.poss);
}

function lineupCard(g) {
  const units = lineupStats(g, LU_SCOPE), M = rosterMap(), nowKey = g.five ? fiveKey(g.five) : '';
  const scopeBtns = `<span class="scope no-print"><button class="${LU_SCOPE === 'game' ? 'on' : ''}" data-act="lu-scope" data-s="game">Game</button><button class="${LU_SCOPE === 'per' ? 'on' : ''}" data-act="lu-scope" data-s="per">${esc(g.per)}</button></span>`;
  if (!units.length) return `<div class="card"><div class="bar">Lineups ${scopeBtns}</div><div class="pad muted">No possessions with a five on the floor yet${LU_SCOPE === 'per' ? ' this period' : ''}. Set the five with ⇄ Sub.</div></div>`;
  const rows = units.map(u => { const f = fiveSorted(u.five, M);
    return `<tr class="${fiveKey(u.five) === nowKey ? 'now' : ''}"><td><b>${f.map(n => esc((M[n] && M[n].num) || '—')).join(' · ')}</b><div class="tiny muted">${f.map(n => esc(lastName(n))).join(', ')}</div></td>
    <td><b>${u.poss}</b></td>${END_COLS.map(([k]) => `<td class="${k[0] === 'x' ? 'mx' : ['TO', 'STL', 'CHG'].includes(k) ? 'ms' : ''}">${u.end[k] || ''}</td>`).join('')}
    <td><b>${u.opp}</b></td><td><b>${ppp(u.opp, u.poss)}</b></td><td>${u.kills || ''}</td></tr>`; }).join('');
  return `<div class="card"><div class="bar">Lineups — how their possessions ended ${scopeBtns}</div><div class="pad" style="overflow-x:auto">
    <table class="lut"><thead><tr><th>FIVE ON THE FLOOR</th><th>POSS</th>${END_COLS.map(([k, l]) => `<th>${l}</th>`).join('')}<th>OPP PTS</th><th>PPP</th><th>KILLS</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="small muted" style="margin-top:6px">Blue edge = the five on the floor now. PPP = their points per possession while that five played.</div>
  </div></div>`;
}

function floorStrip(g) {
  const M = rosterMap();
  return `<div class="card no-print"><div class="floor"><span class="k">ON THE FLOOR</span>
    ${g.five && g.five.length ? fiveSorted(g.five, M).map(n => `<span class="p">${esc(shortName(n, M))}</span>`).join('') : '<span class="warn">No five set — possessions won\'t count toward lineups</span>'}
    <button class="btn btn-blue sub" data-act="sub">⇄ Sub</button></div></div>`;
}

/* Pick the five: tap players on / off until five are lit, then Confirm (at the top, so it is never
   under anything). "From possession" lets a late sub count back to when it really happened. */
let SUB = null;
function subModal(title) {
  const g = cur(), st = perStats(g, g.per);
  if (!SUB) SUB = { sel: new Set(g.five || []), from: st.poss + 1, title: title || 'Sub — who is on the floor?' };
  const M = rosterMap(), n = SUB.sel.size;
  modal(`<div class="subtop"><h2>${esc(SUB.title)}</h2><button class="btn" data-act="sub-cancel">Cancel</button><button class="btn btn-blue" data-act="sub-ok" ${n === 5 ? '' : 'disabled'}>Confirm${n === 5 ? '' : ` (${n}/5)`}</button></div>
    ${st.poss ? `<div class="from"><span class="small" style="font-weight:800;letter-spacing:.06em">COUNTS FROM ${esc(g.per)} POSSESSION</span><button data-act="sub-from" data-d="-1">−</button><span class="n">${SUB.from}</span><button data-act="sub-from" data-d="1">+</button>
      <span class="small muted">${SUB.from === st.poss + 1 ? '(the next one)' : `back-dates possessions ${SUB.from}–${st.poss}`}</span></div>` : ''}
    <div class="pick">${rosterSorted().map(r => `<button class="${SUB.sel.has(r.name) ? 'on' : ''}" data-act="sub-p" data-n="${esc(r.name)}"><b>${esc(r.num || '—')}</b>${esc(r.name)}</button>`).join('') || '<div class="muted">No roster — ⋯ → Moorpark roster.</div>'}</div>`);
}
function subConfirm() {
  const g = cur(), five = [...SUB.sel];
  const rows = periodRows(g, g.per);
  if (SUB.from <= rows.length) {
    const start = g.ev.indexOf(rows[SUB.from - 1].e);
    for (let i = start; i < g.ev.length; i++) { const e = g.ev[i]; if (e.per === g.per && (e.t === 'poss' || e.t === 'mpk')) e.five = five.slice(); }
  }
  g.five = five; SUB = null; save(); closeModal(); render(); toast('On the floor: ' + fiveNums(five));
}

function teamFouls(g, team, per) {
  const b = foulBucket(per);
  return g.ev.filter(e => e.t === 'foul' && e.team === team && foulBucket(e.per) === b).length;
}
// Opponent fouls put us in the bonus, ours put them in it.
const bonusTag = n => n >= 10 ? '<span class="bonus dbl">DOUBLE BONUS</span>' : n >= 7 ? '<span class="bonus">BONUS</span>' : '';

/* ---------- rendering ---------- */
function render() {

  const per = g.per;

  const G = gameStats(g);

  for (let i = g.ev.length - 1; i >= 0 && recent.length < 12; i--) { const n = g.ev[i].num; if (g.ev[i].t === 'poss' && n && !recent.includes(n)) recent.push(n); }
  const last = [...g.ev].reverse().find(e => e.t === 'poss' || e.t === 'mpk' || e.t === 'foul');
  const lastTxt = !last ? 'Nothing logged yet' : last.t === 'poss' ? `Last: ${PER_NAME(last.per)} poss ${periodRows(g, last.per).find(r => r.e.id === last.id).n} — ${describe(last)}`
    : last.t === 'mpk' ? `Last: Moorpark ${last.pts > 0 ? '+' : ''}${last.pts}` : `Last: foul on ${last.team === 'a' ? 'Moorpark' : esc(g.opp)}`;

  <div class="top no-print">
    <img src="../game/logos/moorpark.png" alt="" onerror="this.style.display='none'">

  </div>

  <div class="card no-print">

      <div class="side a"><div class="nm">Moorpark</div><div class="sc">${G.tot.mpk}</div>
        <div class="ppp">${ppp(st.mpk, st.poss)} PPP this ${per.startsWith('OT') ? 'OT' : 'half'}</div>
        <div class="mpk-btns"><button class="minus" data-act="mpk" data-p="-1">−1</button><button data-act="mpk" data-p="1">+1</button><button data-act="mpk" data-p="2">+2</button><button data-act="mpk" data-p="3">+3</button></div>
        <div>${bonusTag(tfB)}</div></div>
      <div class="mid">
        <div class="per">${g.periods.map(p => `<button class="${p === per ? 'on' : ''}" data-act="per" data-p="${p}">${p}</button>`).join('')}<button data-act="next-per" title="Start the next period">+</button></div>
        <div class="possn">Opp poss <b>${st.poss}</b></div>
        <div class="streak">Stops ${[0, 1, 2].map(i => `<span class="dot ${i < st.streak ? 'on' : ''}"></span>`).join('')}</div>
        <div class="possn">Kills <b>${st.kills}</b></div>
      </div>
      <div class="side b"><div class="nm">${esc(g.opp)}</div><div class="sc">${G.tot.opp}</div>
        <div class="ppp">${ppp(st.opp, st.poss)} PPP this ${per.startsWith('OT') ? 'OT' : 'half'}</div>
        <div style="height:6px"></div>
        <div>${bonusTag(tfA)}</div></div>
    </div>
  </div>

  ${floorStrip(g)}
  <div class="card no-print">
    <div class="bar">Possession ${st.poss + 1} — how did it end?</div>
    <div class="entry">
      <div>
        <div class="numbox ${P.num ? '' : 'empty'}">${P.num ? '#' + esc(P.num) : 'Player # (optional)'}</div>
        <div class="keys">${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'].map(k => `<button data-act="key" data-k="${k}">${k}</button>`).join('')}</div>
        <div class="recent">${recent.map(n => `<button class="${n === P.num ? 'on' : ''}" data-act="num" data-n="${esc(n)}">#${esc(n)}</button>`).join('')}</div>
      </div>
      <div>
        <div class="res">
          <button class="make" data-act="res" data-r="2">2<small>MADE 2</small></button>
          <button class="make" data-act="res" data-r="3">3<small>MADE 3</small></button>
          <button class="make" data-act="ft">FT<small>FT TRIP · POINTS</small></button>
          <button class="miss" data-act="res" data-r="x2">✗2<small>MISSED 2 · DREB</small></button>
          <button class="miss" data-act="res" data-r="x3">✗3<small>MISSED 3 · DREB</small></button>
          <button class="miss" data-act="res" data-r="xFT">✗FT<small>0 FT MADE</small></button>
          <button class="stop" data-act="res" data-r="TO">TO<small>DEAD BALL</small></button>
          <button class="stop" data-act="res" data-r="STL">STL<small>STEAL</small></button>
          <button class="stop" data-act="res" data-r="CHG">CHG<small>CHARGE</small></button>
        </div>
        <div class="togs">
          <button class="${P.and1 ? 'on' : ''}" data-act="and1">And-one +1</button>
          <button class="${P.oreb ? 'on' : ''}" data-act="oreb">Their off. reb${P.oreb ? ' · ' + P.oreb : ''}</button>
        </div>

    </div>
  </div>

  <div class="card">

        <div class="small muted" style="margin:-2px 0 8px">Shaded 7 = bonus (1-and-1) · 10 = double bonus. Fouls carry from the 2nd half into overtime. A charge adds one to theirs.</div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="bar">Timeouts <span class="r small">game</span></div>
        <div class="pad">${toRows(g, 'a', 'Moorpark')}${toRows(g, 'b', g.opp)}
          <div class="small muted">Dashed = the extra 30-second timeout each overtime grants.</div></div>
      </div>
      <div class="card">
        <div class="bar">Kills · ${esc(PER_NAME(per))}</div>
        <div class="pad"><div class="boxes" style="grid-template-columns:repeat(12,1fr)">${Array.from({ length: Math.max(12, st.kills) }, (_, i) => `<span class="${i < st.kills ? 'on' : ''}">${i + 1}</span>`).join('')}</div>
        <div class="small muted" style="margin-top:6px">KILL = 3 consecutive defensive stops.</div></div>

  ${lineupCard(g)}
  <div class="card">
    <div class="bar">Summary</div>
    <div class="pad">${summaryTable(g)}
      <div class="small muted" style="margin-top:6px">PPP = points ÷ possessions. Moorpark's possessions are the same count as the opponent's.</div></div>
  </div>

  <div class="print-only">${g.periods.filter(p => p !== per).map(p => `<div class="card"><div class="bar">${esc(PER_NAME(p))} · Defense</div>${sheetTable(g, p)}</div>`).join('')}${['1H', '2H', 'G'].filter(k => ffLine(g, k)).map(k => `<div class="card"><div class="bar">Four factors · ${{ '1H': '1st half', '2H': '2nd half', G: 'Full game' }[k]}</div><div class="pad">${ffResults(g, k)}</div></div>`).join('')}</div>
  <div class="ver no-print">${VERSION} · ${esc(g.date)} · ${esc({ H: 'Home', A: 'Away', N: 'Neutral' }[g.loc] || '')}${g.site ? ' · ' + esc(g.site) : ''}${g.by ? ' · charted by ' + esc(g.by) : ''}</div>`;
  const lw = $('#logwrap'); if (lw) lw.scrollTop = lw.scrollHeight;
}

function sheetTable(g, per) {
  const rows = periodRows(g, per);
  if (!rows.length) return '<div class="empty-log">No possessions yet this period. Each tap above logs one row of the sheet.</div>';
  const cols = ['2', '3', 'FT', 'x2', 'x3', 'xFT', 'TO'];
  let html = `<table class="sheet"><thead><tr><th>POSS</th><th>PLAYER #</th>${cols.map(c => `<th class="${c[0] === 'x' ? 'x' : ''}">${RES_LABEL[c]}</th>`).join('')}<th class="st">REB</th><th class="st">STL</th><th>PTS</th><th class="kl">KILL</th></tr></thead><tbody>`;
  let sub = 0, subK = 0;
  const M = rosterMap();
  let prevKey = null;
  rows.forEach((r, i) => {
    const e = r.e;
    const k = e.five && e.five.length ? fiveKey(e.five) : '';
    if (k !== prevKey && (k || prevKey !== null)) html += `<tr class="lu"><td colspan="13">${i ? '⇄ ' : ''}${k ? fiveSorted(e.five, M).map(n => esc(shortName(n, M))).join(' · ') : 'No five set'}</td></tr>`;
    prevKey = k;
    const cell = c => {
      if (e.res !== c) return '<td></td>';
      if (c === 'FT') return `<td class="m">${e.ft}</td>`;
      return `<td class="m ${c[0] === 'x' ? 'mx' : ''}">●${(c === '2' || c === '3') && e.and1 ? '<span class="tiny">+1</span>' : ''}</td>`;
    };
    const reb = e.res[0] === 'x' ? '●' : '', stl = e.res === 'TO' && e.stl ? '●' : '';
    html += `<tr class="${r.kill ? 'killrow' : ''} ${P.hl === e.id ? 'hl' : ''}" data-act="edit" data-id="${e.id}"><td class="pn">${r.n}</td><td class="pl">${e.num ? esc(e.num) : ''}${e.oreb ? `<div class="tiny">${e.oreb} OREB</div>` : ''}</td>${cols.map(cell).join('')}
      <td class="m ms">${reb}</td><td class="m ms">${stl}${e.res === 'TO' && e.chg ? '<span class="tiny">CHG</span>' : ''}</td><td class="pts">${r.pts || (r.stop ? '<span class="tiny">0</span>' : '')}</td><td class="kill">${r.kill ? 'K' : ''}</td></tr>`;
    sub += r.pts; subK += r.kill ? 1 : 0;
    if ((i + 1) % 25 === 0 || i === rows.length - 1) {
      const a = Math.floor(i / 25) * 25 + 1;
      html += `<tr class="sub"><td colspan="11">SUBTOTAL ${a}–${i + 1} — OPP POINTS / KILLS →</td><td class="pts">${sub}</td><td class="kill">${subK}</td></tr>`;
      sub = 0; subK = 0;
    }
  });
  return html + '</tbody></table>';
}

function foulRow(label, n, team) {
  return `<div class="tf"><span class="lbl">${label}</span><div class="boxes">${Array.from({ length: 10 }, (_, i) =>
    `<span class="${i + 1 === 7 ? 'b7' : i + 1 === 10 ? 'b10' : ''} ${i < n ? 'on' : ''}">${i + 1}</span>`).join('')}</div>
    ${n > 10 ? `<b>${n}</b>` : ''}<button class="minus" data-act="tfoul-x" data-t="${team}">−</button><button class="add" data-act="tfoul" data-t="${team}">+</button></div>`;
}

function toRows(g, team, name) {
  const t = g.tos[team], ot = otCount(g);
  const box = (kind, i, extra) => `<button class="tob ${extra ? 'ot' : ''} ${i < t[kind] ? 'on' : ''}" data-act="to" data-t="${team}" data-k="${kind}" data-i="${i}">${i < t[kind] ? '✕' : ''}</button>`;
  return `<div class="to-team"><div class="lbl" style="color:${team === 'a' ? 'var(--blue)' : 'var(--red)'}">${esc(String(name).toUpperCase())}</div>
    <div class="to-row"><span class="k">FULL</span>${Array.from({ length: FULL_TOS }, (_, i) => box('full', i)).join('')}</div>
    <div class="to-row"><span class="k">30 SEC</span>${Array.from({ length: S30_TOS + ot }, (_, i) => box('s30', i, i >= S30_TOS)).join('')}</div></div>`;
}

function summaryTable(g) {
  const G = gameStats(g);
  const row = (lbl, s, cls) => `<tr class="${cls || ''}"><td>${lbl}</td><td>${s.mpk}</td><td>${s.poss}</td><td class="ppp">${ppp(s.mpk, s.poss)}</td><td>${s.opp}</td><td>${s.poss}</td><td class="ppp">${ppp(s.opp, s.poss)}</td><td>${s.stops}</td><td>${s.kills}</td></tr>`;
  return `<table class="sum"><thead><tr><th class="y"></th><th colspan="3">MOORPARK</th><th colspan="3">${esc(String(g.opp).toUpperCase())}</th><th class="y" colspan="2">DEFENSE</th></tr>
    <tr><th class="y"></th><th>PTS</th><th>POSS</th><th>PPP</th><th>PTS</th><th>POSS</th><th>PPP</th><th class="y">STOPS</th><th class="y">KILLS</th></tr></thead>
    <tbody>${G.per.map(s => row(PER_NAME(s.per), s)).join('')}${G.per.length > 1 ? row('Game', G.tot, 'tot') : ''}</tbody></table>`;
}

function renderHome() {
  $('#app').innerHTML = `
  <div class="top"><img src="../game/logos/moorpark.png" alt="" onerror="this.style.display='none'"><h1>Possession Tracking<small>Moorpark College Men's Basketball</small></h1></div>
  <div class="card"><div class="bar">Start</div><div class="pad">
    <p class="muted" style="margin-top:0">The jamboree possession sheet on the iPad: one tap per opponent possession. Stops, kills, points per possession, team fouls and the bonus are counted for you.</p>
    <button class="btn btn-blue" style="width:100%;min-height:56px;font-size:18px" data-act="new">+ New game</button>
    ${games.length ? `<h3 style="margin:16px 0 8px;font-size:14px">Saved games</h3>${gameList()}` : ''}
  </div></div>

function gameList() {

    modal(`<h2>${esc(PER_NAME(e.per))} · possession ${r.n}</h2>

      <div class="field"><label>Their offensive rebounds</label><div class="seg">${[0, 1, 2, 3, 4].map(n => `<button class="${D.oreb === n ? 'on' : ''}" data-e="oreb" data-v="${n}">${n}</button>`).join('')}</div></div>

      <div class="foot"><button class="btn big" data-act="close">Cancel</button><button class="btn btn-blue big" data-e="save">Save</button></div>`);
    $('#modal .modal').addEventListener('click', ev => {
      const b = ev.target.closest('[data-e]'); if (!b) return;

      const k = b.dataset.e, v = b.dataset.v;
      if (k === 'res') { D.res = v; paint(); }
      else if (k === 'ft') { D.ft = +v; paint(); }
      else if (k === 'and1') { D.and1 = v === '1'; paint(); }
      else if (k === 'oreb') { D.oreb = +v; paint(); }
      else if (k === 'del') { if (confirm('Delete this possession?')) { g.ev = g.ev.filter(x => x.id !== id && x.link !== id); save(); closeModal(); render(); toast('Row deleted'); } }
      else if (k === 'ins') {
        const i = g.ev.indexOf(e);
        g.ev.splice(i, 0, { id: uid(), t: 'poss', per: e.per, num: '', res: 'x2', ft: 0, and1: false, stl: false, chg: false, oreb: 0, five: e.five ? e.five.slice() : null });

        const fi = g.ev.findIndex(x => x.link === id);

        if (!e.chg && fi >= 0) g.ev.splice(fi, 1);
        save(); closeModal(); render(); toast('Possession ' + r.n + ' updated'); }
    });

}

/* ---------- actions ---------- */
function possFrom(res, ft, and1) {
  if (res === 'STL') return { res: 'TO', stl: true, chg: false, ft: 0, and1: false };
  if (res === 'CHG') return { res: 'TO', stl: false, chg: true, ft: 0, and1: false };
  if (res === 'TO') return { res: 'TO', stl: false, chg: false, ft: 0, and1: false };
  return { res, ft: res === 'FT' ? ft : 0, and1: (res === '2' || res === '3') && !!and1, stl: false, chg: false };
}
function logPoss(res, ft) {
  const g = cur();
  const e = Object.assign({ id: uid(), t: 'poss', per: g.per, num: P.num, oreb: P.oreb, five: g.five ? g.five.slice() : null }, possFrom(res, ft, P.and1));
  g.ev.push(e);
  // A charge is a foul on them too.
  if (e.chg) g.ev.push({ id: uid(), t: 'foul', per: g.per, team: 'b', num: P.num, link: e.id });
  P = { num: '', and1: false, oreb: 0, hl: null };
  save(); render();
  const r = periodRows(g, g.per).slice(-1)[0];
  toast(`Poss ${r.n}: ${describe(e)}${r.kill ? ' · KILL!' : ''}`);
}

function undo() {
  const g = cur(); if (!g || !g.ev.length) { toast('Nothing to undo'); return; }
  const e = g.ev.pop();
  if (e.t === 'foul' && e.link) { const i = g.ev.findIndex(x => x.id === e.link); if (i >= 0) g.ev.splice(i, 1); }
  save(); render();
  toast('Undid: ' + (e.t === 'poss' ? describe(e) : e.t === 'mpk' ? `Moorpark ${e.pts > 0 ? '+' : ''}${e.pts}` : 'foul'));
}

function exportGame() {
  const g = cur(); if (!g) return;
  const blob = new Blob([JSON.stringify({ app: 'moorpark-possession-log', version: 1, game: g }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `poss_${g.date}_${slug(g.opp)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importGame() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; f.text().then(t => {
    let d; try { d = JSON.parse(t); } catch (e) { toast('Not a game file'); return; }
    const g = d && d.game; if (!g || !Array.isArray(g.ev)) { toast('Not a possession-log game file'); return; }
    if (games.some(x => x.id === g.id) && !confirm('This game is already here. Replace it with the file?')) return;
    games = games.filter(x => x.id !== g.id).concat(g); curId = g.id; save(); closeModal(); render(); toast('Imported ' + g.opp);
  }); };
  inp.click();
}

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, g = cur();
  switch (act) {
    case 'ov': if (ev.target === b) { SUB = null; closeModal(); } break;
    case 'close': closeModal(); break;
    case 'new': newGameModal(); break;
    case 'create': case 'save-game': {
      const f = readGameForm(); if (!f.opp) { toast('Type the opponent first'); return; }
      if (act === 'create') {
        const ng = Object.assign({ id: uid(), created: Date.now(), per: '1H', periods: ['1H'], ev: [], tos: { a: { full: 0, s30: 0 }, b: { full: 0, s30: 0 } } }, f);
        games.push(ng); curId = ng.id; P = { num: '', and1: false, oreb: 0, hl: null };
      } else Object.assign(g, f);
      save(); closeModal(); render();
      if (act === 'create' && rosterSorted().length >= 5) { SUB = null; subModal('Starting five'); }
      break; }
    case 'games': gamesModal(); break;
    case 'open': curId = b.dataset.id; P = { num: '', and1: false, oreb: 0, hl: null }; save(); closeModal(); render(); break;
    case 'del': { const d = games.find(x => x.id === b.dataset.id);
      if (d && confirm(`Delete the ${d.opp} game (${d.date})? This can't be undone.`)) { games = games.filter(x => x !== d); if (curId === d.id) curId = null; save(); closeModal(); render(); } break; }
    case 'menu': menuModal(); break;
    case 'details': newGameModal(g); break;
    case 'roster': rosterModal(); break;
    case 'roster-save': {
      const list = $('#r-txt').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^#?(\d{1,2})\s+(.+)$/); return m ? { num: m[1], name: m[2].trim() } : { num: '', name: l }; });
      lsSet(LS_ROSTER, list); closeModal(); render(); toast('Roster saved'); break; }
    case 'roster-reset': localStorage.removeItem(LS_ROSTER); closeModal(); render(); toast('Using the game tracker roster'); break;
    case 'print': closeModal(); setTimeout(() => window.print(), 100); break;
    case 'export': exportGame(); break;
    case 'import': importGame(); break;
    case 'drop-per': {
      const p = g.periods[g.periods.length - 1];
      if (g.ev.some(e => e.per === p)) { toast(`${p} has plays in it — delete them first`); return; }
      g.periods.pop(); if (g.per === p) g.per = g.periods[g.periods.length - 1]; save(); closeModal(); render(); break; }
    case 'per': g.per = b.dataset.p; P.num = ''; save(); render(); break;
    case 'next-per': {
      const nx = g.periods.length === 1 ? '2H' : 'OT' + (otCount(g) + 1);
      if (!confirm(`Start ${PER_NAME(nx)}?`)) return;
      g.periods.push(nx); g.per = nx; save(); render(); SUB = null; subModal(`Starting five — ${PER_NAME(nx)}`); break; }
    case 'key': {
      const k = b.dataset.k;
      if (k === 'C') P.num = ''; else if (k === '⌫') P.num = P.num.slice(0, -1); else if (P.num.length < 2) P.num += k; else P.num = k;
      render(); break; }
    case 'num': P.num = P.num === b.dataset.n ? '' : b.dataset.n; render(); break;
    case 'and1': P.and1 = !P.and1; render(); break;
    case 'oreb': P.oreb = (P.oreb + 1) % 5; render(); break;
    case 'res': logPoss(b.dataset.r, 0); break;
    case 'ft': ftModal(); break;
    case 'ft-n': closeModal(); logPoss('FT', +b.dataset.n); break;
    case 'undo': undo(); break;
    case 'sub': SUB = null; subModal(); break;
    case 'sub-p': { const n = b.dataset.n; if (SUB.sel.has(n)) SUB.sel.delete(n); else if (SUB.sel.size < 5) SUB.sel.add(n); else { toast('Five are on — take one off first'); return; } subModal(); break; }
    case 'sub-from': { const mx = perStats(g, g.per).poss + 1; SUB.from = Math.min(mx, Math.max(1, SUB.from + +b.dataset.d)); subModal(); break; }
    case 'sub-ok': if (SUB && SUB.sel.size === 5) subConfirm(); break;
    case 'sub-cancel': SUB = null; closeModal(); break;
    case 'lu-scope': LU_SCOPE = b.dataset.s; render(); break;
    case 'ff': if ($('#ff').classList.contains('hidden')) { FF.scope = g.periods.length > 1 && g.box && g.box['1H'] && filled(g.box['1H'].a) ? 'G' : '1H'; FF.team = 'a'; FF.i = 0; FF.fresh = true; renderFF(); $('#ff').classList.remove('hidden'); $('#ff').scrollTop = 0; }
      else { $('#ff').classList.add('hidden'); render(); } break;
    case 'ff-scope': FF.scope = b.dataset.s; FF.team = 'a'; FF.i = 0; FF.fresh = true; renderFF(); break;
    case 'ff-cell': FF.team = b.dataset.t; FF.i = FF_STATS.findIndex(x => x[0] === b.dataset.k); FF.fresh = true; renderFF(); break;
    case 'ff-key': {
      const t = ffBox(g, FF.scope)[FF.team], k = FF_STATS[FF.i][0], key = b.dataset.k, cv = t[k] == null ? '' : String(t[k]);
      let nv = key === 'C' ? '' : key === '⌫' ? (FF.fresh ? '' : cv.slice(0, -1)) : (FF.fresh ? key : (cv + key).slice(0, 3));
      t[k] = nv === '' ? null : +nv; FF.fresh = false; save(); renderFF(); break; }
    case 'ff-next': ffMove(1); renderFF(); break;
    case 'ff-clear': if (confirm('Clear every number on this sheet?')) { g.box[FF.scope] = { a: {}, b: {} }; FF.team = 'a'; FF.i = 0; FF.fresh = true; save(); renderFF(); } break;
    case 'scout': if ($('#scout').classList.contains('hidden')) openScout(); else $('#scout').classList.add('hidden'); break;
    case 'sc-add': $('#sc-file').click(); break;
    case 'sc-zoom': { const z = +b.dataset.z; SC.zoom = z === 0 ? 1 : Math.min(3, Math.max(0.5, SC.zoom * (z > 0 ? 1.25 : 0.8))); layoutScout(); break; }
    case 'mpk': g.ev.push({ id: uid(), t: 'mpk', per: g.per, pts: +b.dataset.p, five: g.five ? g.five.slice() : null }); save(); render(); break;
    case 'tfoul': g.ev.push({ id: uid(), t: 'foul', per: g.per, team: b.dataset.t }); save(); render(); break;
    case 'tfoul-x': {
      const team = b.dataset.t, bucket = foulBucket(g.per);
      for (let i = g.ev.length - 1; i >= 0; i--) {
        const e = g.ev[i];
        if (e.t === 'foul' && e.team === team && foulBucket(e.per) === bucket && !e.link) { g.ev.splice(i, 1); save(); render(); return; }
      }
      toast('No foul to take off'); break; }
    case 'to': {
      const t = g.tos[b.dataset.t], k = b.dataset.k, i = +b.dataset.i;
      t[k] = t[k] > i ? i : i + 1; save(); render(); break; }
    case 'edit': P.hl = b.dataset.id; render(); editModal(b.dataset.id); break;
  }
});

/* ---------- scouting report ----------
   Same IndexedDB store as the game tracker ('gt_files', same site), so a PDF added in either
   shows in both. The game's PDF: the one picked here, else the opponent's from the game tracker. */
function idb() {
  return new Promise((res, rej) => { const r = indexedDB.open('gt_files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const r = db.transaction('files').objectStore('files').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbPut(k, v) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbKeys() { const db = await idb(); return new Promise(res => { const r = db.transaction('files').objectStore('files').getAllKeys(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); }
const SC = { key: null, doc: null, zoom: 1, io: null, token: 0, lib: null };
async function pdfjs() {
  if (SC.lib) return SC.lib;
  const lib = await import(new URL('../game/vendor/pdf.min.mjs', location.href).href);
  lib.GlobalWorkerOptions.workerSrc = new URL('../game/vendor/pdf.worker.min.mjs', location.href).href;
  return SC.lib = lib;
}
function oppScoutKey(g) {
  const o = lsGet('gt_opp_rosters', []).find(x => x && x.name && x.name.toLowerCase() === String(g.opp).toLowerCase());
  return o && o.scoutKey || null;
}
async function openScout() {
  const g = cur(); $('#scout').classList.remove('hidden');
  let keys = [];
  try { keys = await idbKeys(); } catch (e) { toast('This browser blocks offline file storage'); }
  const recs = await Promise.all(keys.map(async k => ({ k, r: await idbGet(k) })));
  const pref = [g && g.scoutKey, g && oppScoutKey(g), SC.key].find(k => k && keys.includes(k)) || '';
  $('#sc-sel').innerHTML = recs.length ? `${pref ? '' : '<option value="">— pick a report —</option>'}${recs.map(x => `<option value="${esc(x.k)}" ${x.k === pref ? 'selected' : ''}>${esc(x.r && x.r.name || x.k)}</option>`).join('')}`
    : '<option value="">No PDFs on this iPad yet — Add PDF…</option>';
  if (pref !== SC.key || !SC.doc) showScout(pref);
}
async function showScout(key) {
  const box = $('#sc-pages'), token = ++SC.token;
  SC.key = key || null;
  if (SC.io) { SC.io.disconnect(); SC.io = null; }
  if (SC.doc) { try { SC.doc.destroy(); } catch (e) {} SC.doc = null; }
  if (!key) { box.innerHTML = '<div class="sc-empty">Pick the scouting report above, or Add PDF…. It is saved on this iPad and opens without wifi.</div>'; return; }
  box.innerHTML = '<div class="sc-empty">Loading…</div>';
  const rec = await idbGet(key);
  const bytes = rec && (rec.data || (rec.blob && await rec.blob.arrayBuffer()));
  if (token !== SC.token) return;
  if (!bytes) { box.innerHTML = '<div class="sc-empty">That PDF is no longer on this iPad.</div>'; return; }
  let lib;
  try { lib = await pdfjs(); }
  catch (e) { box.innerHTML = `<iframe src="${URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }))}" style="width:100%;height:100%;border:0;background:#fff"></iframe>`; return; }
  try { SC.doc = await lib.getDocument({ data: new Uint8Array(bytes.slice(0)) }).promise; }
  catch (e) { box.innerHTML = '<div class="sc-empty">Could not open that PDF.</div>'; return; }
  if (token === SC.token) layoutScout();
}
// Pages are drawn as they scroll near and dropped when far away, so a long report fits in an iPad's memory.
async function layoutScout() {
  const box = $('#sc-pages'), doc = SC.doc; if (!doc) return;
  if (SC.io) SC.io.disconnect();
  box.innerHTML = '';
  const base = (await doc.getPage(1)).getViewport({ scale: 1 });
  const scale = (Math.max(200, box.clientWidth - 24) / base.width) * SC.zoom, token = SC.token;
  const holders = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const d = document.createElement('div'); d.className = 'sc-page'; d.dataset.page = i;
    d.style.width = Math.round(base.width * scale) + 'px'; d.style.height = Math.round(base.height * scale) + 'px';
    box.appendChild(d); holders.push(d);
  }
  SC.io = new IntersectionObserver(ents => ents.forEach(en => {
    const d = en.target;
    if (en.isIntersecting) { if (!d.firstChild) drawPage(d, +d.dataset.page, scale, token); }
    else if (d.firstChild) { d.firstChild.width = 0; d.innerHTML = ''; }
  }), { root: box, rootMargin: '1200px 0px' });
  holders.forEach(h => SC.io.observe(h));
}
async function drawPage(holder, n, scale, token) {
  if (!SC.doc || token !== SC.token) return;
  const page = await SC.doc.getPage(n), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vp = page.getViewport({ scale: scale * dpr }), c = document.createElement('canvas');
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height); c.style.width = holder.style.width; c.style.height = holder.style.height;
  holder.innerHTML = ''; holder.appendChild(c);
  try { await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; } catch (e) {}
}
$('#sc-sel').addEventListener('change', e => { const g = cur(); if (g) { g.scoutKey = e.target.value || null; save(); } showScout(e.target.value); });
$('#sc-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) { toast('That is not a PDF'); return; }
  const key = 'scout_' + Date.now();
  // Raw bytes, as the game tracker stores them (older iPad Safari is unreliable with Blobs in IndexedDB).
  try { await idbPut(key, { name: f.name, data: await f.arrayBuffer(), added: new Date().toISOString() }); }
  catch (err) { toast('Could not store the PDF on this iPad'); return; }
  const g = cur(); if (g) { g.scoutKey = key; save(); }
  toast('Saved ' + f.name + ' for offline use'); SC.key = null; openScout();
});

/* ---------- four factors from the printed box score ----------
   At halftime (and after the game) the stat crew hands over a print-out. Type each team's
   totals in here and the four factors come out, with the same formulas as the game tracker:
   possessions = FGA − OREB + TO + 0.475 × FTA. The full-game sheet minus the halftime sheet
   gives the 2nd half. */
const FF_STATS = [['fgm', 'FGM'], ['fga', 'FGA'], ['fg3m', '3PM'], ['fg3a', '3PA'], ['ftm', 'FTM'], ['fta', 'FTA'], ['oreb', 'OREB'], ['dreb', 'DREB'], ['ast', 'AST'], ['tov', 'TO']];
const FF = { scope: '1H', team: 'a', i: 0, fresh: true };
const ffBox = (g, sc) => { g.box = g.box || {}; return g.box[sc] = g.box[sc] || { a: {}, b: {} }; };
const filled = t => FF_STATS.some(([k]) => t[k] != null);
function ffLine(g, sc) {
  if (sc !== '2H') { const B = ffBox(g, sc); return (filled(B.a) || filled(B.b)) ? B : null; }
  const H = g.box && g.box['1H'], G = g.box && g.box.G;
  if (!H || !G || !filled(G.a)) return null;
  const d = (x, y) => Object.fromEntries(FF_STATS.map(([k]) => [k, x[k] == null ? null : x[k] - (y[k] || 0)]));
  return { a: d(G.a, H.a), b: d(G.b, H.b) };
}
function ffCalc(s, o) {
  const n = k => +s[k] || 0, m = k => +o[k] || 0;
  const pct = (a, b) => b > 0 ? 100 * a / b : null;
  const poss = n('fga') - n('oreb') + n('tov') + 0.475 * n('fta');
  const pts = 2 * n('fgm') + n('fg3m') + n('ftm');
  return { pts, poss, ppp: poss > 0 ? pts / poss : null,
    efg: pct(n('fgm') + 0.5 * n('fg3m'), n('fga')), to: pct(n('tov'), poss), orb: pct(n('oreb'), n('oreb') + m('dreb')),
    drb: pct(n('dreb'), n('dreb') + m('oreb')), ftr: pct(n('fta'), n('fga')), tpr: pct(n('fg3a'), n('fga')), ast: pct(n('ast'), n('fgm')),
    fg: pct(n('fgm'), n('fga')), fg3: pct(n('fg3m'), n('fg3a')), ft: pct(n('ftm'), n('fta')) };
}
// Things a mistyped number produces, so a slip shows before the numbers are read out.
function ffBad(t, k) {
  const v = t[k]; if (v == null) return false;
  return (k === 'fgm' && t.fga != null && v > t.fga) || (k === 'fg3m' && ((t.fg3a != null && v > t.fg3a) || (t.fgm != null && v > t.fgm)))
    || (k === 'fg3a' && t.fga != null && v > t.fga) || (k === 'ftm' && t.fta != null && v > t.fta);
}
function ffResults(g, sc) {
  const L = ffLine(g, sc);
  if (!L) return `<div class="pad muted">${sc === '2H' ? 'Enter the 1st-half sheet and the full-game sheet — the 2nd half is the difference.' : 'Type the totals in above and the four factors show here.'}</div>`;
  const A = ffCalc(L.a, L.b), B = ffCalc(L.b, L.a);
  const P = v => v == null ? '—' : Math.round(v) + '%';
  const row = (lbl, k, hi, sub) => {
    const a = A[k], b = B[k], w = a == null || b == null || Math.round(a) === Math.round(b) ? '' : (a > b) === hi ? 'a' : 'b';
    return `<tr><td>${lbl}</td><td class="${w === 'a' ? 'win a' : ''}">${P(a)}${sub ? `<span class="sub">${sub(L.a, L.b)}</span>` : ''}</td><td class="${w === 'b' ? 'win b' : ''}">${P(b)}${sub ? `<span class="sub">${sub(L.b, L.a)}</span>` : ''}</td></tr>`;
  };
  const v = (t, k) => t[k] == null ? '–' : t[k];
  const sheet = sc === 'G' ? gameStats(g).tot.poss : sc === '1H' ? perStats(g, '1H').poss : g.periods.filter(p => p !== '1H').reduce((x, p) => x + perStats(g, p).poss, 0);
  return `<table class="ffr"><thead><tr><th></th><th>MOORPARK</th><th>${esc(String(g.opp).toUpperCase())}</th></tr></thead><tbody>
    <tr class="grp"><td colspan="3">Four factors</td></tr>
    ${row('eFG%', 'efg', true, t => `${v(t, 'fgm')}/${v(t, 'fga')} FG · ${v(t, 'fg3m')} 3PM`)}
    ${row('TO%', 'to', false, t => `${v(t, 'tov')} TO`)}
    ${row('OREB%', 'orb', true, (t, o) => `${v(t, 'oreb')}/${(+t.oreb || 0) + (+o.dreb || 0)}`)}
    ${row('DREB%', 'drb', true, (t, o) => `${v(t, 'dreb')}/${(+t.dreb || 0) + (+o.oreb || 0)}`)}
    ${row('FT rate', 'ftr', true, t => `${v(t, 'fta')} FTA`)}
    <tr class="grp"><td colspan="3">Shot profile</td></tr>
    ${row('3PA rate', 'tpr', true, t => `${v(t, 'fg3a')}/${v(t, 'fga')} FGA`)}
    ${row('AST rate', 'ast', true, t => `${v(t, 'ast')}/${v(t, 'fgm')} FGM · AST:TO ${t.tov ? ((+t.ast || 0) / t.tov).toFixed(1) : '—'}`)}
    ${row('FG%', 'fg', true)}${row('3P%', 'fg3', true)}${row('FT%', 'ft', true)}
    <tr class="grp"><td colspan="3">Efficiency</td></tr>
    <tr><td>Points</td><td>${A.pts}</td><td>${B.pts}</td></tr>
    <tr><td>Possessions (est.)</td><td>${A.poss.toFixed(1)}</td><td>${B.poss.toFixed(1)}</td></tr>
    <tr><td>PPP</td><td class="${A.ppp != null && B.ppp != null && A.ppp > B.ppp ? 'win a' : ''}">${A.ppp == null ? '—' : A.ppp.toFixed(2)}</td><td class="${A.ppp != null && B.ppp != null && B.ppp > A.ppp ? 'win b' : ''}">${B.ppp == null ? '—' : B.ppp.toFixed(2)}</td></tr>
  </tbody></table>
  <div class="small muted" style="margin-top:6px">Possessions = FGA − OREB + TO + 0.475 × FTA. Your possession sheet has ${sheet} for ${sc === 'G' ? 'the game' : sc === '1H' ? 'the 1st half' : 'the 2nd half + OT'}.</div>`;
}
function renderFF() {
  const g = cur(); if (!g) return;
  const sc = FF.scope, edit = sc !== '2H', B = edit ? ffBox(g, sc) : null;
  const cell = (t, k) => { const v = B[t][k]; return `<button class="ffc ${FF.team === t && FF_STATS[FF.i][0] === k ? 'sel' : ''} ${ffBad(B[t], k) ? 'bad' : ''}" data-act="ff-cell" data-t="${t}" data-k="${k}">${v == null ? '' : v}</button>`; };
  const pts = t => { const x = B[t]; return filled(x) ? 2 * (+x.fgm || 0) + (+x.fg3m || 0) + (+x.ftm || 0) : '–'; };
  $('#ff').innerHTML = `<div class="wrap">
    <div class="top"><h1>Four factors<small>From the printed box score · vs ${esc(g.opp)}</small></h1>
      <div class="per">${[['1H', '1st half'], ['G', 'Full game'], ['2H', '2nd half']].map(([k, l]) => `<button class="${sc === k ? 'on' : ''}" data-act="ff-scope" data-s="${k}">${l}</button>`).join('')}</div>
      <button class="btn btn-blue" data-act="ff" style="min-height:46px;font-weight:800">◀ Back</button></div>
    ${edit ? `<div class="card"><div class="bar">${sc === '1H' ? 'Halftime print-out — 1st half totals' : 'Final print-out — full game totals'}<span class="r"><button class="btn btn-sm btn-red" data-act="ff-clear">Clear</button></span></div>
      <div class="ff-in"><table class="ffg"><thead><tr><th></th><th class="a">MOORPARK</th><th class="b">${esc(String(g.opp).toUpperCase())}</th></tr></thead><tbody>
        ${FF_STATS.map(([k, l]) => `<tr><td class="l">${l}</td><td>${cell('a', k)}</td><td>${cell('b', k)}</td></tr>`).join('')}
        <tr class="calc"><td class="l" style="color:var(--mut)">PTS</td><td>${pts('a')}</td><td>${pts('b')}</td></tr></tbody></table>
        <div class="ffk"><div class="cur">${FF.team === 'a' ? 'Moorpark' : esc(g.opp)} · ${FF_STATS[FF.i][1]}</div>
          ${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'].map(k => `<button data-act="ff-key" data-k="${k}">${k}</button>`).join('')}
          <button class="nx" data-act="ff-next">Next ▶</button></div></div></div>` : ''}
    <div class="card"><div class="bar">${{ '1H': '1st half', G: 'Full game', '2H': '2nd half (full game − 1st half)' }[sc]}</div><div class="pad">${ffResults(g, sc)}</div></div>
  </div>`;
}
function ffMove(d) {
  const n = FF_STATS.length, idx = (FF.team === 'a' ? 0 : n) + FF.i + d, w = ((idx % (2 * n)) + 2 * n) % (2 * n);
  FF.team = w < n ? 'a' : 'b'; FF.i = w % n; FF.fresh = true;
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
