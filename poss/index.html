function editModal(id) {
  const g = cur(), e = g.ev.find(x => x.id === id); if (!e) return;
  const isPlay = e.t === 'play' || e.t === 'foul';
  const byPlayer = e.t === 'foul' || (e.t === 'play' && PLAYER_STATS.has(e.k));
  const ps = byPlayer ? teamPlayers(g, e.team) : [];
  modal(`<h2>Fix this play</h2>
    ${isPlay ? `<div class="small muted" style="margin-bottom:8px">${esc(teamName(g, e.team))} · ${esc(pShort(g, e.team, e.player))} · ${esc(STAT_LABEL[e.k] || 'Foul')}</div>
      ${e.t === 'play' ? `<div class="field"><label>Stat</label><div class="sgrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${STATS.filter(s => s[0] !== 'foul' && s[0] !== 'tech' && PLAYER_STATS.has(s[0]) === byPlayer).map(([k, l, c]) => `<button class="sbtn sb-${c} ${e.k === k ? 'on' : ''}" data-act="ed-k" data-id="${id}" data-k="${k}">${l}</button>`).join('')}</div></div>` : ''}
      ${!byPlayer ? `<div class="field"><label>Team</label><div class="row" style="gap:6px">${['a', 'b'].map(t => `<button class="btn btn-lg ${e.team === t ? 'btn-primary' : ''}" style="flex:1" data-act="ed-t" data-id="${id}" data-t="${t}">${esc(teamName(g, t))}</button>`).join('')}</div></div>` : ''}
      ${byPlayer ? `<div class="field"><label>Player</label><div class="sub-grid">${ps.map(p => `<button class="sub-p ${e.player === p.id ? 'in' : ''}" data-act="ed-p" data-id="${id}" data-p="${esc(p.id)}">${p.num ? `<span class="pnum">#${esc(p.num)}</span>` : ''}${esc(p.name ? lastName(p.name) : '')}</button>`).join('')}<button class="sub-p ${e.player === 'TEAM' || !e.player ? 'in' : ''}" data-act="ed-p" data-id="${id}" data-p="TEAM">Team</button></div></div>` : ''}` : `<div class="muted">${esc(feedText(g, { kind: e.t, e, score: { a: 0, b: 0 } }).html.replace(/<[^>]+>/g, ''))}</div>`}
    <div class="modal-foot" style="justify-content:space-between"><button class="btn btn-bad" data-act="ed-del" data-id="${id}">Delete</button>
      <span class="row" style="gap:8px"><button class="btn" data-act="ed-ins" data-id="${id}">Insert a play before this</button><button class="btn btn-good btn-lg" data-act="close">Done</button></span></div>`);
}

function oppRosterModal() {
  const g = cur();
  modal(`<h2>${esc(g.opp)} roster</h2><p class="small muted" style="margin-bottom:8px">One player per line: number, then name (name optional). Numbers are enough to track.</p>
    <div class="field"><textarea id="r-txt" rows="14" style="width:100%">${esc((g.oppRoster || []).slice().sort(byNum).map(r => `${r.num} ${r.name || ''}`.trim()).join('\n'))}</textarea></div>
    <div class="modal-foot">${gtOppRoster(g.opp).length ? '<button class="btn" data-act="opp-from-gt" style="margin-right:auto">Use the game tracker\'s roster</button>' : ''}<button class="btn btn-lg" data-act="close">Cancel</button><button class="btn btn-good btn-lg" data-act="opp-save">Save</button></div>`);
}
function rosterModal() {
  const own = lsGet(LS_ROSTER, null);
  modal(`<h2>Moorpark roster</h2><p class="small muted" style="margin-bottom:8px">${own && own.length ? 'This tracker\'s own list.' : 'Taken from the game tracker on this iPad.'} One player per line: number, then name.</p>
    <div class="field"><textarea id="r-txt" rows="14" style="width:100%">${esc(roster().slice().sort(byNum).map(r => `${r.num} ${r.name}`).join('\n'))}</textarea></div>
    <div class="modal-foot">${own && own.length ? '<button class="btn" data-act="roster-reset" style="margin-right:auto">Use the game tracker\'s</button>' : ''}<button class="btn btn-lg" data-act="close">Cancel</button><button class="btn btn-good btn-lg" data-act="roster-save">Save</button></div>`);
}
const parseLines = txt => txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^#?(\d{1,2})\s*(.*)$/); return m ? { num: m[1], name: m[2].trim() } : { num: '', name: l }; });

/* ---------- logging ---------- */
function push(g, e) {
  e.id = e.id || uid(); e.per = e.per || g.per;
  if (UI.ins) { const i = g.ev.findIndex(x => x.id === UI.ins); if (i >= 0) { g.ev.splice(i, 0, e); UI.ins = null; UI.redo = []; return; } UI.ins = null; }
  g.ev.push(e); UI.redo = [];
}
function logStat(team, player) {
  const g = cur(), k = UI.stat; UI.stat = null;
  if (k === 'foul') push(g, { t: 'foul', team, player: player === 'TEAM' ? null : player });
  else push(g, { t: 'play', team, player, k });
  save(); render();
  if (k === 'foul' || k === 'chg' || k === 'offf') {
    const n = playerFouls(g, team, player); if (player !== 'TEAM' && n >= 4) toast(`${pShort(g, team, player)}: ${n} fouls${n >= 5 ? ' — FOULED OUT' : ''}`, n >= 5 ? 'bad' : 'warn');
  }
}

function exportGame(g) {
  const blob = new Blob([JSON.stringify({ app: 'moorpark-possession-tracker', version: 2, game: g }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `poss_${g.date}_${slug(g.opp)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importGame() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; f.text().then(t => {
    let d; try { d = JSON.parse(t); } catch (e) { toast('Not a game file', 'bad'); return; }
    const g = d && d.game; if (!g || !Array.isArray(g.ev) || d.version !== 2) { toast('Not a possession-tracker game file', 'bad'); return; }
    if (games.some(x => x.id === g.id) && !confirm('This game is already here. Replace it with the file?')) return;
    games = games.filter(x => x.id !== g.id).concat(g); curId = g.id; save(); UI.tab = 'live'; render(); toast('Imported ' + g.opp, 'good');
  }); };
  inp.click();
}

function toast(msg, kind) {
  const t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2600);
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act],[data-tab]'); if (!b) return;
  if (b.dataset.tab && !b.dataset.act) {
    if (b.dataset.tab === 'scout') { if (cur()) openScout(); return; }
    UI.tab = b.dataset.tab; UI.stat = null; render(); return;
  }
  const act = b.dataset.act, g = cur();
  switch (act) {
    case 'overlay': if (ev.target === b) { SUB = null; TECH = null; closeModal(); } break;
    case 'close': closeModal(); render(); break;
    case 'new': newGameModal(); break;
    case 'details': newGameModal(g); break;
    case 'create': case 'save-game': {
      const opp = $('#f-opp').value.trim(); if (!opp) { toast('Type the opponent first', 'bad'); return; }
      const f = { opp, date: $('#f-date').value || today(), loc: ($('#f-loc .btn-primary') || { dataset: { l: 'H' } }).dataset.l };
      if (act === 'create') {
        const ng = Object.assign({ id: uid(), v: 2, created: Date.now(), per: '1H', periods: ['1H'], ev: [], oppRoster: gtOppRoster(opp), box: {} }, f);
        games.push(ng); curId = ng.id; UI.tab = 'live'; UI.redo = []; save(); closeModal(); render(); SUB = null; subModal('Starting fives');
      } else { if (g.opp !== f.opp && !(g.oppRoster || []).length) g.oppRoster = gtOppRoster(f.opp); Object.assign(g, f); save(); closeModal(); render(); }
      break; }
    case 'open': curId = b.dataset.id; UI.tab = 'live'; UI.redo = []; save(); render(); break;
    case 'export': exportGame(games.find(x => x.id === b.dataset.id)); break;
    case 'import': importGame(); break;
    case 'del': { const d = games.find(x => x.id === b.dataset.id);
      if (d && confirm(`Delete the ${d.opp} game (${d.date})? This can't be undone.`)) { games = games.filter(x => x !== d); if (curId === d.id) curId = null; save(); render(); } break; }
    case 'roster': rosterModal(); break;
    case 'roster-save': lsSet(LS_ROSTER, parseLines($('#r-txt').value)); closeModal(); render(); toast('Roster saved', 'good'); break;
    case 'roster-reset': localStorage.removeItem(LS_ROSTER); closeModal(); render(); break;
    case 'opp-roster': oppRosterModal(); break;
    case 'opp-save': g.oppRoster = parseLines($('#r-txt').value).filter(r => r.num); save(); closeModal(); render(); break;
    case 'opp-from-gt': $('#r-txt').value = gtOppRoster(g.opp).map(r => `${r.num} ${r.name}`.trim()).join('\n'); break;

    case 'stat': {
      const k = b.dataset.k;
      if (k === 'tech') { UI.stat = null; TECH = { team: 'b', coach: false, player: null, ftm: 2 }; techModal(); return; }
      UI.stat = UI.stat === k ? null : k; render(); break; }
    case 'stat-cancel': UI.stat = null; render(); break;
    case 'ins-cancel': UI.ins = null; UI.stat = null; render(); break;
    case 'player':
      if (!UI.stat) { toast('Tap Foul, Charge or Off Foul first, then the player'); return; }
      if (!PLAYER_STATS.has(UI.stat)) { toast('Tap the team button at the top'); return; }
      logStat(b.dataset.team, b.dataset.p); break;
    case 'teambtn':
      if (!UI.stat) { toast('Tap the stat first, then the team'); return; }
      if (PLAYER_STATS.has(UI.stat)) { toast('Fouls go to the player — tap his card'); return; }
      logStat(b.dataset.team, 'TEAM'); break;
    case 'ed-t': { const e = g.ev.find(x => x.id === b.dataset.id); e.team = b.dataset.t; save(); editModal(e.id); render(); break; }
    case 'undo': { if (!g.ev.length) return; UI.redo.push(g.ev.pop()); save(); render(); break; }
    case 'redo': { if (!UI.redo.length) return; g.ev.push(UI.redo.pop()); save(); render(); break; }
    case 'sub': SUB = null; subModal(); break;
    case 'sub-p': { const s = SUB[b.dataset.t], p = b.dataset.p; if (s.has(p)) s.delete(p); else if (s.size < 5) s.add(p); else { toast('Five are on — take one off first'); return; } subModal(); break; }
    case 'sub-ok': subConfirm(); break;
    case 'sub-cancel': SUB = null; closeModal(); break;
    case 'timeout': timeoutModal(); break;
    case 'to-log': push(g, { t: 'to', team: b.dataset.t, kind: b.dataset.k }); save(); closeModal(); render(); toast(`${teamName(g, b.dataset.t)} ${b.dataset.k === 'full' ? 'full' : '30-second'} timeout`); break;
    case 'adjust': adjustModal(); break;
    case 'adj-foul': {
      const t = b.dataset.t;
      if (b.dataset.d === '1') push(g, { t: 'foul', team: t, player: null });
      else { const bk = foulBucket(g.per); for (let i = g.ev.length - 1; i >= 0; i--) { const e = g.ev[i]; if (e.t === 'foul' && e.team === t && foulBucket(e.per) === bk) { g.ev.splice(i, 1); break; } } }
      save(); adjustModal(); render(); break; }
    case 'adj-to': {
      const t = b.dataset.t, k = b.dataset.k;
      if (b.dataset.d === '1') push(g, { t: 'to', team: t, kind: k });
      else { for (let i = g.ev.length - 1; i >= 0; i--) { const e = g.ev[i]; if (e.t === 'to' && e.team === t && e.kind === k) { g.ev.splice(i, 1); break; } } }
      save(); adjustModal(); render(); break; }
    case 'end-per': {
      const nx = g.per === '1H' ? '2H' : 'OT' + (otCount(g) + 1);
      if (g.per !== g.periods[g.periods.length - 1]) { g.per = g.periods[g.periods.length - 1]; save(); render(); return; }
      if (!confirm(`End ${PER_NAME(g.per)} and start ${PER_NAME(nx)}?`)) return;
      g.periods.push(nx); g.per = nx; UI.stat = null; save(); render(); SUB = null; subModal(`Starting fives — ${PER_NAME(nx)}`); break; }
    case 'scout': openScout(); break;
    case 'sc-close': $('#scout').classList.add('hidden'); break;
    case 'sc-add': $('#sc-file').click(); break;
    case 'sc-zoom': { const z = +b.dataset.z; SC.zoom = z === 0 ? 1 : Math.min(3, Math.max(0.5, SC.zoom * (z > 0 ? 1.25 : 0.8))); layoutScout(); break; }

    case 'tech-team': TECH.team = b.dataset.t; TECH.player = null; techModal(); break;
    case 'tech-coach': TECH.coach = b.dataset.v === '1'; if (TECH.coach) TECH.player = null; techModal(); break;
    case 'tech-p': TECH.player = TECH.player === b.dataset.p ? null : b.dataset.p; techModal(); break;
    case 'tech-ft': TECH.ftm = +b.dataset.n; techModal(); break;
    case 'tech-cancel': TECH = null; closeModal(); break;
    case 'tech-ok': {
      if (!TECH.coach && TECH.team === 'a' && !TECH.player) { toast('Pick the Moorpark player (or The coach)', 'bad'); return; }
      const D = derive(g), e = Object.assign({ t: 'tech' }, TECH); if (e.coach) e.player = null;
      push(g, e); TECH = null; save(); closeModal(); render();
      const out = e.player && (playerTechs(g, e.team, e.player) >= 2 || playerFouls(g, e.team, e.player) >= 5);
      const cOut = e.coach && g.ev.filter(x => x.t === 'tech' && x.coach && x.team === e.team).length >= 2;
      toast(techText(g, e) + (out ? ' — OUT OF THE GAME' : '') + (cOut ? ' — 2nd on the coach: EJECTED' : ''), out || cOut ? 'bad' : ''); break; }

    case 'edit': editModal(b.dataset.id); break;
    case 'ed-k': { const e = g.ev.find(x => x.id === b.dataset.id); e.k = b.dataset.k; save(); editModal(e.id); render(); break; }
    case 'ed-p': { const e = g.ev.find(x => x.id === b.dataset.id); e.player = b.dataset.p === 'TEAM' && e.t === 'foul' ? null : b.dataset.p; save(); editModal(e.id); render(); break; }
    case 'ed-del': if (confirm('Delete this play?')) { g.ev = g.ev.filter(x => x.id !== b.dataset.id); save(); closeModal(); render(); } break;
    case 'ed-ins': UI.ins = b.dataset.id; UI.tab = 'live'; closeModal(); render(); toast('Tap the stat, then the player — it goes in before that play'); break;

    case 'sheet-per': UI.sheetPer = b.dataset.p; render(); break;
    case 'print': setTimeout(() => window.print(), 50); break;
    case 'lu-scope': UI.luScope = b.dataset.s; render(); break;
    case 'lu-open': UI.luOpen = UI.luOpen === b.dataset.k ? null : b.dataset.k; render(); break;

    case 'ff-scope': FF.scope = b.dataset.s; FF.team = 'a'; FF.i = 0; FF.fresh = true; renderFF(); break;
    case 'ff-cell': FF.team = b.dataset.t; FF.i = FF_STATS.findIndex(x => x[0] === b.dataset.k); FF.fresh = true; renderFF(); break;
    case 'ff-key': {
      const t = ffBox(g, FF.scope)[FF.team], k = FF_STATS[FF.i][0], key = b.dataset.k, cv = t[k] == null ? '' : String(t[k]);
      const nv = key === 'C' ? '' : key === '⌫' ? (FF.fresh ? '' : cv.slice(0, -1)) : (FF.fresh ? key : (cv + key).slice(0, 3));
      t[k] = nv === '' ? null : +nv; FF.fresh = false; save(); renderFF(); break; }
    case 'ff-next': ffMove(1); renderFF(); break;
    case 'ff-clear': if (confirm('Clear every number on this sheet?')) { g.box[FF.scope] = { a: {}, b: {} }; FF.team = 'a'; FF.i = 0; FF.fresh = true; save(); renderFF(); } break;
  }
});

/* ---------- scouting report ----------
   Same IndexedDB store as the game tracker ('gt_files', same site), so a PDF added in either
   shows in both. The game's PDF: the one picked here, else the opponent's from the game tracker. */
function idb() {
  return new Promise((res, rej) => { const r = indexedDB.open('gt_files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const r = db.transaction('files').objectStore('files').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbPut(k, v) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbKeys() { const db = await idb(); return new Promise(res => { const r = db.transaction('files').objectStore('files').getAllKeys(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); }
const SC = { key: null, doc: null, zoom: 1, io: null, token: 0, lib: null };
async function pdfjs() {
  if (SC.lib) return SC.lib;
  const lib = await import(new URL('../game/vendor/pdf.min.mjs', location.href).href);
  lib.GlobalWorkerOptions.workerSrc = new URL('../game/vendor/pdf.worker.min.mjs', location.href).href;
  return SC.lib = lib;
}
function oppScoutKey(g) {
  const o = lsGet('gt_opp_rosters', []).find(x => x && x.name && x.name.toLowerCase() === String(g.opp).toLowerCase());
  return o && o.scoutKey || null;
}
async function openScout() {
  const g = cur(); $('#scout').classList.remove('hidden');
  let keys = [];
  try { keys = await idbKeys(); } catch (e) { toast('This browser blocks offline file storage'); }
  const recs = await Promise.all(keys.map(async k => ({ k, r: await idbGet(k) })));
  const pref = [g && g.scoutKey, g && oppScoutKey(g), SC.key].find(k => k && keys.includes(k)) || '';
  $('#sc-sel').innerHTML = recs.length ? `${pref ? '' : '<option value="">— pick a report —</option>'}${recs.map(x => `<option value="${esc(x.k)}" ${x.k === pref ? 'selected' : ''}>${esc(x.r && x.r.name || x.k)}</option>`).join('')}`
    : '<option value="">No PDFs on this iPad yet — Add PDF…</option>';
  if (pref !== SC.key || !SC.doc) showScout(pref);
}
async function showScout(key) {
  const box = $('#sc-pages'), token = ++SC.token;
  SC.key = key || null;
  if (SC.io) { SC.io.disconnect(); SC.io = null; }
  if (SC.doc) { try { SC.doc.destroy(); } catch (e) {} SC.doc = null; }
  if (!key) { box.innerHTML = '<div class="sc-empty">Pick the scouting report above, or Add PDF…. It is saved on this iPad and opens without wifi.</div>'; return; }
  box.innerHTML = '<div class="sc-empty">Loading…</div>';
  const rec = await idbGet(key);
  const bytes = rec && (rec.data || (rec.blob && await rec.blob.arrayBuffer()));
  if (token !== SC.token) return;
  if (!bytes) { box.innerHTML = '<div class="sc-empty">That PDF is no longer on this iPad.</div>'; return; }
  let lib;
  try { lib = await pdfjs(); }
  catch (e) { box.innerHTML = `<iframe src="${URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }))}" style="width:100%;height:100%;border:0;background:#fff"></iframe>`; return; }
  try { SC.doc = await lib.getDocument({ data: new Uint8Array(bytes.slice(0)) }).promise; }
  catch (e) { box.innerHTML = '<div class="sc-empty">Could not open that PDF.</div>'; return; }
  if (token === SC.token) layoutScout();
}
// Pages are drawn as they scroll near and dropped when far away, so a long report fits in an iPad's memory.
async function layoutScout() {
  const box = $('#sc-pages'), doc = SC.doc; if (!doc) return;
  if (SC.io) SC.io.disconnect();
  box.innerHTML = '';
  const base = (await doc.getPage(1)).getViewport({ scale: 1 });
  const scale = (Math.max(200, box.clientWidth - 24) / base.width) * SC.zoom, token = SC.token;
  const holders = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const d = document.createElement('div'); d.className = 'sc-page'; d.dataset.page = i;
    d.style.width = Math.round(base.width * scale) + 'px'; d.style.height = Math.round(base.height * scale) + 'px';
    box.appendChild(d); holders.push(d);
  }
  SC.io = new IntersectionObserver(ents => ents.forEach(en => {
    const d = en.target;
    if (en.isIntersecting) { if (!d.firstChild) drawPage(d, +d.dataset.page, scale, token); }
    else if (d.firstChild) { d.firstChild.width = 0; d.innerHTML = ''; }
  }), { root: box, rootMargin: '1200px 0px' });
  holders.forEach(h => SC.io.observe(h));
}
async function drawPage(holder, n, scale, token) {
  if (!SC.doc || token !== SC.token) return;
  const page = await SC.doc.getPage(n), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vp = page.getViewport({ scale: scale * dpr }), c = document.createElement('canvas');
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height); c.style.width = holder.style.width; c.style.height = holder.style.height;
  holder.innerHTML = ''; holder.appendChild(c);
  try { await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; } catch (e) {}
}
$('#sc-sel').addEventListener('change', e => { const g = cur(); if (g) { g.scoutKey = e.target.value || null; save(); } showScout(e.target.value); });
$('#sc-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) { toast('That is not a PDF'); return; }
  const key = 'scout_' + Date.now();
  // Raw bytes, as the game tracker stores them (older iPad Safari is unreliable with Blobs in IndexedDB).
  try { await idbPut(key, { name: f.name, data: await f.arrayBuffer(), added: new Date().toISOString() }); }
  catch (err) { toast('Could not store the PDF on this iPad'); return; }
  const g = cur(); if (g) { g.scoutKey = key; save(); }
  toast('Saved ' + f.name + ' for offline use'); SC.key = null; openScout();
});

/* ---------- four factors from the printed box score ----------
   At halftime (and after the game) the stat crew hands over a print-out. Type each team's
   totals in here and the four factors come out, with the same formulas as the game tracker:
   possessions = FGA − OREB + TO + 0.475 × FTA. The full-game sheet minus the halftime sheet
   gives the 2nd half. */
const FF_STATS = [['fgm', 'FGM'], ['fga', 'FGA'], ['fg3m', '3PM'], ['fg3a', '3PA'], ['ftm', 'FTM'], ['fta', 'FTA'], ['oreb', 'OREB'], ['dreb', 'DREB'], ['ast', 'AST'], ['tov', 'TO']];
const FF = { scope: '1H', team: 'a', i: 0, fresh: true };
const ffBox = (g, sc) => { g.box = g.box || {}; return g.box[sc] = g.box[sc] || { a: {}, b: {} }; };
const filled = t => FF_STATS.some(([k]) => t[k] != null);
function ffLine(g, sc) {
  if (sc !== '2H') { const B = ffBox(g, sc); return (filled(B.a) || filled(B.b)) ? B : null; }
  const H = g.box && g.box['1H'], G = g.box && g.box.G;
  if (!H || !G || !filled(G.a)) return null;
  const d = (x, y) => Object.fromEntries(FF_STATS.map(([k]) => [k, x[k] == null ? null : x[k] - (y[k] || 0)]));
  return { a: d(G.a, H.a), b: d(G.b, H.b) };
}
function ffCalc(s, o) {
  const n = k => +s[k] || 0, m = k => +o[k] || 0;
  const pct = (a, b) => b > 0 ? 100 * a / b : null;
  const poss = n('fga') - n('oreb') + n('tov') + 0.475 * n('fta');
  const pts = 2 * n('fgm') + n('fg3m') + n('ftm');
  return { pts, poss, ppp: poss > 0 ? pts / poss : null,
    efg: pct(n('fgm') + 0.5 * n('fg3m'), n('fga')), to: pct(n('tov'), poss), orb: pct(n('oreb'), n('oreb') + m('dreb')),
    drb: pct(n('dreb'), n('dreb') + m('oreb')), ftr: pct(n('fta'), n('fga')), tpr: pct(n('fg3a'), n('fga')), ast: pct(n('ast'), n('fgm')),
    fg: pct(n('fgm'), n('fga')), fg3: pct(n('fg3m'), n('fg3a')), ft: pct(n('ftm'), n('fta')) };
}
// Things a mistyped number produces, so a slip shows before the numbers are read out.
function ffBad(t, k) {
  const v = t[k]; if (v == null) return false;
  return (k === 'fgm' && t.fga != null && v > t.fga) || (k === 'fg3m' && ((t.fg3a != null && v > t.fg3a) || (t.fgm != null && v > t.fgm)))
    || (k === 'fg3a' && t.fga != null && v > t.fga) || (k === 'ftm' && t.fta != null && v > t.fta);
}
function ffResults(g, sc) {
  const L = ffLine(g, sc);
  if (!L) return `<div class="muted">${sc === '2H' ? 'Enter the 1st-half sheet and the full-game sheet — the 2nd half is the difference.' : 'Type the totals in above and the four factors show here.'}</div>`;
  const A = ffCalc(L.a, L.b), B = ffCalc(L.b, L.a);
  const P = v => v == null ? '—' : Math.round(v) + '%';
  const row = (lbl, k, hi, sub) => {
    const a = A[k], b = B[k], w = a == null || b == null || Math.round(a) === Math.round(b) ? '' : (a > b) === hi ? 'a' : 'b';
    return `<tr><td>${lbl}</td><td class="${w === 'a' ? 'win a' : ''}">${P(a)}${sub ? `<span class="sub">${sub(L.a, L.b)}</span>` : ''}</td><td class="${w === 'b' ? 'win b' : ''}">${P(b)}${sub ? `<span class="sub">${sub(L.b, L.a)}</span>` : ''}</td></tr>`;
  };
  const v = (t, k) => t[k] == null ? '–' : t[k];
  const D = derive(g), cnt = per => (s => (s.poss.a + s.poss.b) / 2)(perSums(D, per));
  const sheet = sc === 'G' ? cnt(null) : sc === '1H' ? cnt('1H') : g.periods.filter(p => p !== '1H').reduce((x, p) => x + cnt(p), 0);
  return `<table class="ffr"><thead><tr><th></th><th>MOORPARK</th><th>${esc(String(g.opp).toUpperCase())}</th></tr></thead><tbody>
    <tr class="grp"><td colspan="3">Four factors</td></tr>
    ${row('eFG%', 'efg', true, t => `${v(t, 'fgm')}/${v(t, 'fga')} FG · ${v(t, 'fg3m')} 3PM`)}
    ${row('TO%', 'to', false, t => `${v(t, 'tov')} TO`)}
    ${row('OREB%', 'orb', true, (t, o) => `${v(t, 'oreb')}/${(+t.oreb || 0) + (+o.dreb || 0)}`)}
    ${row('DREB%', 'drb', true, (t, o) => `${v(t, 'dreb')}/${(+t.dreb || 0) + (+o.oreb || 0)}`)}
    ${row('FT rate', 'ftr', true, t => `${v(t, 'fta')} FTA`)}
    <tr class="grp"><td colspan="3">Shot profile</td></tr>
    ${row('3PA rate', 'tpr', true, t => `${v(t, 'fg3a')}/${v(t, 'fga')} FGA`)}
    ${row('AST rate', 'ast', true, t => `${v(t, 'ast')}/${v(t, 'fgm')} FGM · AST:TO ${t.tov ? ((+t.ast || 0) / t.tov).toFixed(1) : '—'}`)}
    ${row('FG%', 'fg', true)}${row('3P%', 'fg3', true)}${row('FT%', 'ft', true)}
    <tr class="grp"><td colspan="3">Efficiency</td></tr>
    <tr><td>Points</td><td>${A.pts}</td><td>${B.pts}</td></tr>
    <tr><td>Possessions (est.)</td><td>${A.poss.toFixed(1)}</td><td>${B.poss.toFixed(1)}</td></tr>
    <tr><td>PPP</td><td class="${A.ppp != null && B.ppp != null && A.ppp > B.ppp ? 'win a' : ''}">${A.ppp == null ? '—' : A.ppp.toFixed(2)}</td><td class="${A.ppp != null && B.ppp != null && B.ppp > A.ppp ? 'win b' : ''}">${B.ppp == null ? '—' : B.ppp.toFixed(2)}</td></tr>
  </tbody></table>
  <div class="small muted" style="margin-top:6px">Possessions = FGA − OREB + TO + 0.475 × FTA. Tracked possessions (average of both teams): ${Number.isInteger(sheet) ? sheet : sheet.toFixed(1)} for ${sc === 'G' ? 'the game' : sc === '1H' ? 'the 1st half' : 'the 2nd half + OT'}.</div>`;
}
function renderFF() {
  const g = cur(); if (!g) return;
  const sc = FF.scope, edit = sc !== '2H', B = edit ? ffBox(g, sc) : null;
  const cell = (t, k) => { const v = B[t][k]; return `<button class="ffc ${FF.team === t && FF_STATS[FF.i][0] === k ? 'sel' : ''} ${ffBad(B[t], k) ? 'bad' : ''}" data-act="ff-cell" data-t="${t}" data-k="${k}">${v == null ? '' : v}</button>`; };
  const pts = t => { const x = B[t]; return filled(x) ? 2 * (+x.fgm || 0) + (+x.fg3m || 0) + (+x.ftm || 0) : '–'; };
  $('#ff').innerHTML = `<div>
    <div class="page-head"><h2>Four factors <span class="muted small">from the printed box score</span></h2>
      <div class="row" style="gap:6px;margin-left:auto">${[['1H', '1st half'], ['G', 'Full game'], ['2H', '2nd half']].map(([k, l]) => `<button class="btn btn-sm ${sc === k ? 'btn-primary' : ''}" data-act="ff-scope" data-s="${k}">${l}</button>`).join('')}</div></div>
    ${edit ? `<div class="card"><h3 style="display:flex;align-items:center">${sc === '1H' ? 'Halftime print-out — 1st half totals' : 'Final print-out — full game totals'}<button class="btn btn-sm btn-bad" data-act="ff-clear" style="margin-left:auto">Clear</button></h3>
      <div class="ff-in"><table class="ffg"><thead><tr><th></th><th class="a">MOORPARK</th><th class="b">${esc(String(g.opp).toUpperCase())}</th></tr></thead><tbody>
        ${FF_STATS.map(([k, l]) => `<tr><td class="l">${l}</td><td>${cell('a', k)}</td><td>${cell('b', k)}</td></tr>`).join('')}
        <tr class="calc"><td class="l" style="color:var(--muted)">PTS</td><td>${pts('a')}</td><td>${pts('b')}</td></tr></tbody></table>
        <div class="ffk"><div class="cur">${FF.team === 'a' ? 'Moorpark' : esc(g.opp)} · ${FF_STATS[FF.i][1]}</div>
          ${['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'].map(k => `<button data-act="ff-key" data-k="${k}">${k}</button>`).join('')}
          <button class="nx" data-act="ff-next">Next ▶</button></div></div></div>` : ''}
    <div class="card"><h3>${{ '1H': '1st half', G: 'Full game', '2H': '2nd half (full game − 1st half)' }[sc]}</h3>${ffResults(g, sc)}</div>
  </div>`;
}
function ffMove(d) {
  const n = FF_STATS.length, idx = (FF.team === 'a' ? 0 : n) + FF.i + d, w = ((idx % (2 * n)) + 2 * n) % (2 * n);
  FF.team = w < n ? 'a' : 'b'; FF.i = w % n; FF.fresh = true;
}


if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
