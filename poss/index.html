<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MBB Poss">
<meta name="theme-color" content="#0d0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../game/icon-180.png">
<title>Moorpark Possession Tracker</title>
<style>
/* The game tracker's styles (game/index.html), so both apps look and work the same. */

/* Quiet, broadcast-style dark theme: one neutral ramp, two team colours used sparingly,
   colour reserved for meaning (team, make/miss, warnings) rather than decoration. */
:root{
  --bg:#0d0f14; --surface:#14171e; --card:#1a1e26; --card2:#222731; --hover:#262c37;
  --border:rgba(255,255,255,.06); --border2:rgba(255,255,255,.11);
  --primary:#7c93e6; --primary-bg:rgba(124,147,230,.14);
  /* Moorpark: the Columbia blue from the leaderboard. */
  /* Alternating table rows - every striped table uses these two. */
  --row-light:#eef0f3; --row-dark:#d2d7df;
  --us:#4fc3f7; --us-d:#2b8fc0; --us-bg:rgba(79,195,247,.12);
  --them:#e0a26f; --them-d:#9a6436; --them-bg:rgba(224,162,111,.12); --them-text:#fdba74; --them-hdr:#3d1f0a;
  --good:#5cbf95; --bad:#e2736d; --warn:#dcb05a; --info:#7fb5d6; --purple:#9d8fe0; --gold:#d8b860;
  --text:#f8fafc; --text2:#d5dae3; --muted:#a3acbb;
  --r:10px; --rl:14px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Inter,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* Dark page: native controls (dropdown lists, date pickers) open dark too, so their white
   text never lands on a white list. */
:root{color-scheme:dark}
select option,select optgroup{background:var(--card);color:var(--text)}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--card2);padding:1px 5px;border-radius:4px}
table{border-collapse:collapse}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

/* nav */
.nav{position:sticky;top:0;z-index:50;height:52px;background:rgba(13,15,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-in{max-width:1320px;height:100%;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.brand{font-weight:700;font-size:15px;margin-right:14px;white-space:nowrap;letter-spacing:-.01em}
.brand span{color:var(--muted);font-weight:500}
.brand .brand-us{color:var(--us)}
.tab{padding:7px 11px;border-radius:8px;font-weight:500;color:var(--muted);white-space:nowrap;font-size:13.5px}
.tab:hover{color:var(--text)}
.tab.active{background:var(--card2);color:var(--text)}
.tab.scout-tab.active{background:var(--primary-bg);color:var(--primary)}
.nav-right{margin-left:auto;display:flex;gap:2px;align-items:center}
.offline-dot{font-size:11px;padding:3px 9px;border-radius:99px;color:var(--muted);white-space:nowrap;margin-left:6px;background:var(--card)}
.offline-dot::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.offline-dot.ready::before{background:var(--good)}
.tname{color:var(--tc)}
.box-table tbody .tname,.cmp-light tr:not(.cmp-h) .tname{color:var(--tcl)}
/* timeout sheet */
.modal.huddle{max-width:1000px;padding:18px 20px}
.huddle-overlay{padding:2vh 10px}
.hud-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:6px 4px 14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.hud-team{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}
.hud-team > div{display:flex;flex-direction:column;align-items:center}
.hud-score{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hud-team.a .hud-score{color:var(--us)} .hud-team.b .hud-score{color:var(--them-text)}
.hud-meta{font-size:12px;color:var(--text2);margin-top:4px;display:flex;gap:6px;align-items:center}
.hud-meta{justify-content:center}
.hud-mid{text-align:center} .hud-cap{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
.hud-clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.hud-pts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.hud-pts .ins{font-size:14.5px;font-weight:600;color:var(--text)}
.hud-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hud-grid .card{margin-bottom:12px}
/* Huddle: tap a row to mark it light yellow; tap it again (or another row) to clear. */
.modal.huddle tr.hl td:not(.l5-moved){background:#fef9c3!important}
.hud-floor{margin-bottom:12px} .hud-floor td,.hud-floor th{padding:6px 7px}
.l5-tbl td{vertical-align:top} .l5-tbl td .tiny{color:#6b7280;font-weight:500}
.l5-tbl td.l5-game{color:#6b7280;border-right:1px solid #c4c9d1}
.zebra td.l5-moved{background:#fde68a!important;color:#78350f} .zebra td.l5-moved .tiny{color:#92400e}
/* light grey / slightly darker grey rows with dark text (same as the box score) */
.zebra tr:nth-child(even) td{background:var(--row-light)} .zebra tr:nth-child(odd) td{background:var(--row-dark)}
.zebra td{color:#1f2937;border-top-color:#c4c9d1}
.zebra td .muted,.zebra td.muted{color:#6b7280} .zebra .pnum{color:#4b5563}
.zebra td.pos{color:#15803d;font-weight:700} .zebra td.neg{color:#b91c1c;font-weight:700}
.zebra td.tf-bonus{color:#b45309;font-weight:800} .zebra td.tf-dbl{color:#b91c1c;font-weight:800}
.zebra td.win.a{color:#0b6fa4} .zebra td.win.b{color:var(--them-d)}
.hud-big{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.hud-big span:first-child{color:var(--text2);font-size:12.5px} .hud-big b{font-size:16px;text-align:right}
.hud-big .k-good{color:#22c55e} .hud-big .k-bad{color:#ef4444}
@media (max-width:760px){.hud-pts,.hud-grid{grid-template-columns:1fr}}
.rot-svg{width:100%;height:auto;display:block}
.rot-team{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:6px 0 2px}
.rot-team.a{color:var(--us)} .rot-team.b{color:var(--them-text)}
.alert-bar{justify-content:flex-start;flex-wrap:nowrap}
.alert-bar .al-ic{font-size:16px}
.alert-bar .al-h{font-size:14px;letter-spacing:.02em;white-space:nowrap}
.alert-bar .al-s{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.alert-bar.al-red{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.55)} .alert-bar.al-red .al-h{color:#fca5a5}
.alert-bar.al-amber{background:rgba(250,204,21,.09);border-color:rgba(250,204,21,.5)} .alert-bar.al-amber .al-h{color:#fde68a}
.alert-bar.al-blue{background:rgba(79,195,247,.1);border-color:rgba(79,195,247,.5)} .alert-bar.al-blue .al-h{color:#7dd3fc}
.adj-team{margin-bottom:14px}
.adj-row{display:grid;grid-template-columns:1fr 52px 48px 52px;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--border)}
.adj-row b{text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.adj-row .btn{font-size:20px;padding:6px 0}
.adj-pf{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}.adj-pf .adj-row{padding:4px 2px}.adj-pf .adj-row .btn{padding:3px 0}
.app-ver{font-size:10.5px;color:var(--muted);margin-left:6px;white-space:nowrap}

.page{padding:14px 16px 40px;max-width:1320px;margin:0 auto}
.page.narrow{max-width:860px}
.page.mid{max-width:1120px}
.page-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;font-weight:600;background:var(--card2);border:1px solid var(--border2);white-space:nowrap;font-size:13.5px;transition:background .12s}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:transparent;color:#0d0f14}
.btn-primary:hover{background:#90a4ec}
.btn-good{background:var(--us);border-color:transparent;color:#06222f}
.btn-good:hover{background:#73d0f9}
.btn-bad{background:transparent;border-color:rgba(226,115,109,.45);color:var(--bad)}
.btn-bad:hover{background:rgba(226,115,109,.1)}
.btn-warn{background:transparent;border-color:rgba(220,176,90,.45);color:var(--warn)}
.btn-warn:hover{background:rgba(220,176,90,.1)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn-lg{padding:12px 20px;font-size:15px}
/* Set time: Cancel and Set as big, half-width touch targets. */
.foot-big .btn{flex:1;min-height:64px;font-size:20px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:14px}
.card h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#fff;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .muted{text-transform:none;letter-spacing:0;font-weight:400}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr!important}}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}

/* toast */
#toasts{position:fixed;bottom:16px;left:16px;z-index:300;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.toast{background:rgba(34,39,49,.96);border:1px solid var(--border2);padding:7px 14px;border-radius:99px;font-weight:500;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;backdrop-filter:blur(8px)}
.toast.good::before,.toast.bad::before,.toast.warn::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:1px}
.toast.good::before{background:var(--good)} .toast.bad::before{background:var(--bad)} .toast.warn::before{background:var(--warn)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(5,6,9,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:600px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{font-size:18px;font-weight:700;margin-bottom:12px;letter-spacing:-.01em}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* scoreboard */
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:10px 22px;margin-bottom:8px}
.sb-team{display:flex;align-items:center;gap:18px}
.sb-team.a{justify-content:flex-end;text-align:right}
.sb-team.b{justify-content:flex-start;text-align:left}
.sb-id{display:flex;flex-direction:column;gap:5px}
.sb-team.a .sb-id{align-items:flex-end} .sb-team.b .sb-id{align-items:flex-start}
.sb-name{font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.sb-name::before{content:'';width:8px;height:8px;border-radius:50%}
.sb-team.a .sb-name::before{background:var(--us)} .sb-team.b .sb-name::before{background:var(--them)}
.sb-score{font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:72px}
.sb-team.a .sb-score{text-align:right}
.sb-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text2);align-items:center}
.sb-team.a .sb-meta{justify-content:flex-end}
.sb-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:170px;padding:0 26px;border-left:1px solid var(--border);border-right:1px solid var(--border);margin:0 26px}
.sb-period{font-weight:600;color:#fff;text-transform:uppercase;font-size:11px;letter-spacing:.12em}
.sb-clock{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.01em}
.sb-cap{font-size:10.5px;color:var(--muted)}
.sb-settime{margin-top:4px;padding:4px 10px;font-size:12px}
.poss-btn{margin:2px 0 4px;padding:4px 14px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.08em;border:1.5px solid;display:inline-flex;align-items:center;gap:7px;max-width:100%;white-space:nowrap}
.poss-btn .pn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.poss-btn .pb{font-size:13px}
.poss-btn.a{color:#4fc3f7;border-color:#4fc3f7;background:rgba(79,195,247,.12)}
.poss-btn.b{color:var(--them-text);border-color:var(--them-text);background:color-mix(in srgb,var(--them-text) 14%,transparent)}
.poss-btn.none{color:var(--text2);border-color:var(--border2);background:var(--card)}
/* Both sides stay the same shape: a team name is one line (cut with … if it truly can't
   fit), and the fouls / kills lines never wrap. */
.sb-team,.sb-id{min-width:0}
.sb-name{white-space:nowrap;min-width:0;max-width:100%}
.sb-name .sb-nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sb-meta{flex-wrap:nowrap;white-space:nowrap}
@media (max-width:1000px){
  .scorebar{padding:10px 14px}
  .sb-team{gap:10px}
  .sb-mid{margin:0 10px;padding:0 10px;min-width:0}
  .sb-score{font-size:44px;min-width:54px}
  .sb-name{font-size:14px;gap:6px}
  .sb-name .tlogo{--lg:28px!important}
  .sb-settime{padding:4px 7px;font-size:11px}
}
.to-dots{display:inline-flex;gap:3px;align-items:center}
.to-dot{width:7px;height:7px;border-radius:50%;background:#facc15}
.to-dot.full{border-radius:2px;width:9px}
.to-dot.used{background:transparent;border:1px solid var(--border2)}
/* Team fouls on the scoreboard: yellow at 5-6 (the bonus is close), orange at the bonus
   (7-9), red at the double bonus (10+). */
.tf-warn{color:#facc15;font-weight:800} .tf-bonus{color:#fb923c;font-weight:800} .tf-dbl{color:#ef4444;font-weight:800}
.bonus{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(220,176,90,.16);color:var(--warn);letter-spacing:.04em}
.bonus.dbl{background:rgba(226,115,109,.16);color:var(--bad)}
.kills{display:inline-flex;align-items:center;gap:4px;color:var(--text2)}
.kills b{font-size:13px;color:var(--text);margin-right:2px}
.kpip{width:8px;height:8px;border-radius:50%;background:var(--card2);display:inline-block}
.kpip.on{background:#22c55e}
/* 3+ kills in a half: ours green, theirs red. */
.kills b.k-good{color:#22c55e} .kills b.k-bad{color:#ef4444}

.levbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;font-size:12.5px;color:var(--text2)}
.lev{font-weight:700;padding:2px 8px;border-radius:6px;font-size:11px;letter-spacing:.05em}
.lev-high{background:rgba(226,115,109,.16);color:#efa29d} .lev-med{background:rgba(220,176,90,.15);color:var(--warn)} .lev-low{background:var(--card2);color:var(--text2)}
.lev-comp{background:rgba(220,140,90,.18);color:#efb48a} .lev-clutch{background:rgba(216,184,96,.2);color:var(--gold)} .lev-gt{background:var(--card2);color:var(--muted)}
.gt-meter{width:160px;min-width:40px;flex:0 1 160px;height:5px;border-radius:9px;background:var(--card2);overflow:hidden}
/* the bar stays one line: everything holds its size except the description, which truncates */
.levbar:not(.alert-bar){flex-wrap:nowrap;white-space:nowrap}
.levbar > *{flex-shrink:0}
.levbar > .lev-desc{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.levbar > .gt-meter{flex-shrink:1}
.gt-meter > div{height:100%;background:var(--warn)}

/* tracker layout */
.tracker{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,340px) minmax(0,1fr);gap:10px;align-items:start}
/* Phones: stats on top, the two teams side by side underneath. */
@media (max-width:699px){.tracker{grid-template-columns:1fr 1fr}.stat-col{grid-column:1 / -1;order:-1}}
/* iPad upright (700-1000 wide): keep three columns - players either side of a narrower stat
   column - so a stat and its player are always on the same screen, no scrolling. */
@media (max-width:1000px) and (min-width:700px){
  .tracker{grid-template-columns:minmax(0,1fr) minmax(236px,270px) minmax(0,1fr);gap:8px}
  .col{padding:8px}
  .pbtn{padding:8px 10px;font-size:14.5px;min-height:52px}
  .pbtn .pline{font-size:11px}
  .pbtn .pname{padding-right:40px}
  .pbtn .onote{display:none}
  .sbtn{padding:11px 4px;font-size:13.5px}
  .ctrls .btn{padding:9px 4px;font-size:12.5px}
  .tracker .lpm2.two{grid-template-columns:minmax(0,1fr)}
  .status{font-size:13px}
}
.col{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:10px;display:flex;flex-direction:column;gap:7px}
.col-head{min-height:36px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center;color:#fff;padding:2px 2px 4px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}
.pgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.col{min-width:0}
.pbtn{min-width:0;position:relative;text-align:left;padding:9px 14px;border-radius:11px;background:var(--card);border:1px solid var(--border);font-weight:600;font-size:15.5px;min-height:54px;display:flex;flex-direction:column;justify-content:center;transition:background .1s,opacity .12s,box-shadow .12s}
.col.a .pbtn{box-shadow:inset 3px 0 0 var(--us-d)}
.col.b .pbtn{box-shadow:inset 3px 0 0 var(--them-d)}
.pbtn:hover{background:var(--hover)}
.pnum{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.pbtn .pname{display:flex;align-items:baseline;gap:8px;min-width:0;padding-right:44px}
.pbtn .plabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.pbtn .onote{font-size:11.5px;font-weight:500;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.pbtn.team .pname{padding-right:0}
.pbtn .pline{font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px;padding-right:38px}
.pbtn .pf{position:absolute;top:8px;right:10px;font-size:10.5px;font-weight:600;color:var(--muted)}
.pbtn .pf.f-trouble{background:#ff1f1f;color:#fff;font-weight:900;padding:2px 7px;border-radius:5px;top:6px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.sub-acts{display:flex;gap:8px;margin-top:14px} .sub-acts .btn-lg{flex:1}
.sub-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:-1px;z-index:3;background:var(--surface);padding:4px 0 8px}
.sub-head h2{margin:0}
.sub-top{display:flex;gap:8px} .sub-top .btn-lg{min-width:170px}
.clockin.xl{gap:26px;padding:20px}
.clockin.xl .keypad{grid-template-columns:repeat(3,120px);gap:12px}
.clockin.xl .keypad button{height:88px;font-size:34px;border-radius:14px}
.clockin.xl input{font-size:52px;width:230px}
.sub-chg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:-2px 0 8px;font-size:13px;font-weight:700}
.sub-chg .o{color:#fca5a5} .sub-chg .i{color:#86efac}
.pbtn .stint{position:absolute;bottom:8px;right:10px;font-size:10.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
/* foul trouble: the whole card, amber then red */
.tracker .col .pbtn.ft-warn{background:rgba(250,204,21,.13);border-color:rgba(250,204,21,.75);box-shadow:inset 4px 0 0 #facc15}
.tracker .col .pbtn.ft-danger{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.85);box-shadow:inset 4px 0 0 #ef4444}
.pbtn.ft-warn .pf,.pbtn.ft-danger .pf{font-weight:900;padding:2px 7px;border-radius:5px;top:6px}
.pbtn.ft-warn .pf{background:#facc15;color:#111} .pbtn.ft-danger .pf{background:#ef4444;color:#fff}
.pbtn.ft-warn .pline,.pbtn.ft-danger .pline,.pbtn.ft-warn .stint,.pbtn.ft-danger .stint{color:var(--text2)}
.pbtn.team{min-height:40px;font-size:13px;color:var(--text2);background:transparent;border-style:dashed;box-shadow:none!important}
.pbtn.dim{opacity:.22;pointer-events:none}
.pbtn.hot{background:var(--card2);border-color:var(--border2)}
.abandon-link{align-self:center;margin-top:6px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 8px}
.abandon-link:hover{color:var(--bad)}
.skipbig{width:100%;padding:12px;font-size:15px}
.bench-mini{font-size:11.5px;color:var(--muted);padding:2px}
.lpm{background:var(--card);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;margin-top:6px}
.lpm2{display:grid;gap:6px}
.lpm2.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.lpm2.two .lpm{padding:8px 10px}
.lpm2.two .lpm-row{font-size:12.5px}
.lpm2.two .lpm-head{letter-spacing:.06em}
.lpm-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin:2px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.lpm-stats div{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.lpm-stats span{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lpm-stats b{font-size:13.5px;font-variant-numeric:tabular-nums}
.lpm-stats b.pos{color:var(--good)} .lpm-stats b.neg{color:var(--bad)}
.sub-sides{display:grid;grid-template-columns:1fr;gap:18px}
.sub-sides.two{grid-template-columns:1fr 1fr}
@media (max-width:760px){.sub-sides.two{grid-template-columns:1fr}}
.sub-sides .sub-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.sub-team{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sub-team.a{color:var(--us)} .sub-team.b{color:var(--them-text)}
.lpm-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#fff;padding-bottom:5px;margin-bottom:2px;border-bottom:1px solid var(--border)}
.lpm-head .lpm-val{font-size:15px;letter-spacing:0}
.lpm-hr{display:flex;align-items:center;gap:6px}
.lpm.min .lpm-stats{border-bottom:none;margin-bottom:0;padding-bottom:0}
.lpm-tg{width:24px;height:22px;border-radius:5px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:15px;font-weight:700;line-height:1;padding:0;cursor:pointer}
.lpm-team.a{color:var(--us)} .lpm-team.b{color:var(--them-text)}
.lpm-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.lpm-name{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpm-val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.lpm-val.pos{color:var(--good)} .lpm-val.neg{color:var(--bad)}

.stat-col .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sbtn{padding:12px 6px;border-radius:10px;font-weight:700;font-size:14.5px;color:#fff;border:none;transition:filter .1s,opacity .12s;text-align:center}
.sbtn:hover{filter:brightness(1.15)}
/* The practice tracker's swatches, button for button: every stat its own solid colour so the
   grid reads at a glance from arm's length. Off Foul (game-only) gets a colour of its own. */
.sb-2fg_make{background:#1e40af} .sb-2fg_miss{background:#9f1239}
.sb-3fg_make{background:#b45309} .sb-3fg_miss{background:#5b21b6}
.sb-ft_make{background:#155e75}  .sb-ft_miss{background:#701a75}
.sb-dreb{background:#134e4a}     .sb-oreb{background:#431407}
.sb-ast{background:#3b0764}      .sb-tov{background:#450a0a}
.sb-blk{background:#172554}      .sb-stl{background:#422006}
.sb-foul{background:#1e3a5f}     .sb-offf{background:#3f6212}     .sb-chg{background:#0f5132}     .sb-tech{background:#7c2d12}
.sbtn.dim{opacity:.2;pointer-events:none}
.sbtn.on{outline:2px solid #fff;outline-offset:1px;opacity:1}
.status{min-height:44px;padding:8px 12px;border-radius:11px;background:var(--card);font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text2);text-align:center;justify-content:center}
.tech-coaches{flex-basis:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px}
.tech-coaches .btn{white-space:normal;line-height:1.2;min-height:42px;text-align:left;justify-content:flex-start}
.status.wait{background:var(--primary-bg);color:var(--text);justify-content:space-between;text-align:left}
.ctrls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ctrls .btn{padding:10px 6px}
.feed{font-size:12px;max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--border);padding-top:6px}
.feed div{padding:4px 8px;border-radius:6px;color:var(--text2)}
.feed .a{border-left:2px solid var(--us-d)} .feed .b{border-left:2px solid var(--them-d)}
.feed .s{color:var(--muted)}
.feed div{display:flex;align-items:center;gap:6px} .feed div > span{flex:1;min-width:0}
.flagbtn{background:none;border:0;padding:2px 4px;font-size:13px;opacity:.28;filter:grayscale(1);flex-shrink:0}
.flagbtn.on{opacity:1;filter:none}
.feed div.flagged,.pbp-row.flagged{background:rgba(239,68,68,.10)}
.ctrls .flag-last{grid-column:1 / -1}
.ctrls .flag-last.on{border-color:#ef4444;color:#fca5a5}
.pbp-note{width:100%;margin-top:4px;font-size:12px;padding:4px 8px}
.banner{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);padding:22px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center}
.banner h2{font-size:18px;font-weight:600;width:100%}

/* sub / clock modals */
.sub-sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#fff;margin:16px 0 8px}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.sub-p{padding:11px 12px;border-radius:11px;background:var(--card);border:1px solid var(--border);font-weight:600;text-align:left;min-height:54px;transition:background .1s}
.sub-p:hover{background:var(--hover)}
.sub-p .pnum{color:var(--muted);font-weight:500;margin-right:4px}
.sub-p .tiny{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.sub-p.out{border-color:rgba(226,115,109,.5);background:rgba(226,115,109,.08)}
.sub-p.pending{border-color:var(--warn);background:rgba(220,176,90,.1)}
.sub-p.in{border:2px solid #22c55e;background:rgba(34,197,94,.22);color:#fff}
.sub-p.in .tiny{color:#bbf7d0}
.sub-p:disabled{opacity:.3}
.sub-p.dq{border-color:#ef4444;background:rgba(239,68,68,.16);color:#fca5a5}
.sub-p.dq .tiny{color:#ef4444;font-weight:700}
.sub-p.dq:disabled{opacity:.8}
.sub-bench.waiting .sub-p:not(:disabled){border-color:rgba(92,191,149,.45)}
.pairs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pair{background:var(--card);border-radius:99px;padding:4px 6px 4px 12px;font-weight:500;display:flex;gap:8px;align-items:center;font-size:13px}
.pair b.o{color:var(--bad);font-weight:600} .pair b.i{color:var(--good);font-weight:600}
.clockin{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;justify-content:center;background:var(--card);border-radius:12px;padding:14px}
.clockin input{font-size:30px;font-weight:600;width:150px;text-align:center;font-variant-numeric:tabular-nums;padding:8px;background:var(--surface)}
.clockin input.need{border-color:rgba(226,115,109,.6)}
/* The mm:ss box is a display only: not tappable, never focused, so the iPad keyboard can't
   open - the number pad beside it does the typing. */
.clockin input[readonly]{pointer-events:none;caret-color:transparent;-webkit-user-select:none;user-select:none}
.keypad{display:grid;grid-template-columns:repeat(3,54px);gap:6px}
.keypad button{height:42px;border-radius:9px;background:var(--card2);font-weight:600;font-size:17px}
.keypad button:hover{background:var(--hover)}
/* Bigger pads where the clock is typed mid-game (Sub, Timeout, Set time). */
.clockin.big .keypad{grid-template-columns:repeat(3,92px);gap:10px}
.clockin.big .keypad button{height:68px;font-size:28px;border-radius:12px}
.clockin.big input{font-size:40px;width:190px}
.clk-prev{font-weight:500;margin-top:8px;font-size:13px;color:var(--text2);text-align:center}
.clk-err{color:var(--bad);font-weight:500;margin-top:4px;font-size:12.5px;text-align:center;max-width:220px}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
.tbl{width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{background:var(--card);color:#fff;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:8px 9px;text-align:right;white-space:nowrap;position:sticky;top:0}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 9px;text-align:right;border-top:1px solid var(--border);white-space:nowrap}
@media (hover:hover){.tbl:not(.zebra):not(.cmp-light) tr:hover td{background:rgba(255,255,255,.015)}}
.tbl tr.tot td{font-weight:600;background:var(--card)}
.tbl tr.cur td{background:var(--primary-bg)}
.tbl tr.dnp td{color:var(--muted)}
.tbl th.grp{text-align:center;border-left:1px solid var(--border2)}
.tbl td.gl{border-left:1px solid var(--border2)}
/* season lineups: light grey / slightly darker grey rows, dark text */
.season-lu .lu-tbl td{color:#1f2937;border-top-color:#c4c9d1}
.season-lu .lu-tbl tr:nth-child(odd) td{background:var(--row-light)} .season-lu .lu-tbl tr:nth-child(even) td{background:var(--row-dark)}
.season-lu .lu-tbl td.pos{color:#15803d;font-weight:700} .season-lu .lu-tbl td.neg{color:#b91c1c;font-weight:700}
.season-lu .lu-tbl td.gl{border-left-color:#b8bec8}
.tbl td.l{text-align:left}
.pos{color:var(--good)} .neg{color:var(--bad)}
.cmp-tbl td,.cmp-tbl th{padding:7px 12px}
.cmp-tbl th.cmp-a,.cmp-tbl th.cmp-b{text-align:right;text-transform:none;letter-spacing:0;font-size:12.5px}
.cmp-tbl th.cmp-a{color:var(--us)} .cmp-tbl th.cmp-b{color:var(--them-text)}
.cmp-tbl th .tlogo{vertical-align:-4px}
.cmp-tbl td.cmp-a,.cmp-tbl td.cmp-b{width:24%;color:var(--text2)}
.cmp-tbl td.win{font-weight:800;color:var(--text)}
.cmp-tbl td.cmp-a.win{color:var(--us)} .cmp-tbl td.cmp-b.win{color:var(--them-text)}
/* Team comparison: the box score's light rows, light grey and a slightly darker grey alternating within
   each section, black text; the better side's number bold in a dark team colour. */
.cmp-light tr:not(.cmp-h) td{background:var(--row-light);color:#000;border-top:1px solid #c9ced6}
.cmp-light tr.alt:not(.cmp-h) td{background:var(--row-dark)}
.cmp-light td.cmp-a,.cmp-light td.cmp-b{color:#1f2937}
.cmp-light td.cmp-a.win,.cmp-tbl.cmp-light td.win.a{color:#0b6fa4} .cmp-light td.cmp-b.win,.cmp-tbl.cmp-light td.win.b{color:var(--them-d)}
.cmp-tbl tr.cmp-h td{background:var(--card);color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:6px 12px;text-align:left}
.ff{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.ff .k{background:var(--card);border-radius:10px;padding:10px 12px}
.ff .k .lbl{font-size:10.5px;color:#fff;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ff .k .v{font-size:18px;font-weight:600;display:flex;justify-content:space-between;gap:8px;margin-top:3px;font-variant-numeric:tabular-nums}
.ff .k .v .a{color:var(--us)} .ff .k .v .b{color:var(--them-text)}
.ff4-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:900px){.ff4-grid{grid-template-columns:1fr 1fr}}
.ff4{background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.ff4-head{display:flex;flex-direction:column}
.ff4-head b{font-size:14px} .ff4-head span{font-size:11px;color:var(--text2)}
.ff4-row{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px;font-size:12px}
.ff4-team{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ff4-team.a{color:var(--us)} .ff4-team.b{color:var(--them-text)}
.ffbar{position:relative;height:22px;background:var(--card2);border-radius:6px;overflow:hidden}
.ffbar-fill{height:100%;border-radius:6px}
.ffbar-fill.a{background:var(--us)} .ffbar-fill.b{background:var(--them)}
.ffbar span{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.ff4-edge{font-size:11.5px;font-weight:700;color:var(--text2)}
.ff4-edge.a{color:var(--us)} .ff4-edge.b{color:var(--them-text)}
.ks-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ks{background:var(--card);border-radius:12px;padding:12px 14px;border-left:4px solid var(--us)}
.ks.b{border-left-color:var(--them)}
.ks-lbl{font-size:12px;font-weight:700;margin-bottom:6px}
.ks-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.ks-nums b{display:block;font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.ks-nums span{font-size:11px;color:var(--text2);font-weight:600}
.insights{display:flex;flex-direction:column;gap:6px}
.ins{padding:9px 12px;border-radius:10px;background:var(--card);font-weight:500;display:flex;align-items:center;gap:10px;color:var(--text2)}
.ins::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.ins.bad::before{background:var(--bad)} .ins.warn::before{background:var(--warn)} .ins.good::before{background:var(--good)} .ins.info::before{background:var(--info)}
.chart svg{width:100%;height:auto;display:block}
.pbp-row{display:grid;grid-template-columns:44px 52px 1fr 66px auto;gap:10px;align-items:center;padding:7px 14px;border-top:1px solid var(--border);font-size:13px}
.pbp-row:first-child{border-top:none}
.pbp-row > span:nth-child(3)::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;vertical-align:1px;background:var(--muted)}
.pbp-row.a > span:nth-child(3)::before{background:var(--us)} .pbp-row.b > span:nth-child(3)::before{background:var(--them)}
.pbp-row.s{color:var(--text2)}
.pbp-row .acts{display:flex;gap:4px}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:5px;letter-spacing:.03em}

/* setup */
.setup{max-width:820px;margin:0 auto}
.setup-head{text-align:center;margin:8px 0 20px}
.setup-head h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.setup-head p{color:var(--muted);margin-top:4px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11px;font-weight:600;color:#fff;text-transform:uppercase;letter-spacing:.08em}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:7px}
/* Column by column (top to bottom, then the next column) - read like a numbered roster sheet. */
.chk-grid.down{display:block;column-width:200px;column-gap:7px}
.chk-grid.down > .chk{break-inside:avoid;margin-bottom:7px}
.chk{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:transparent;border:1px solid var(--border);cursor:pointer;user-select:none;color:var(--muted);transition:background .1s;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.chk.on{background:var(--card);text-decoration:none}
.chk:hover{background:var(--hover)}
.chk.on{color:var(--text)}
.chk.starter{background:var(--us-bg);border-color:rgba(79,195,247,.45);color:var(--text)}
.chk .st{margin-left:auto;font-size:11px;font-weight:500;color:var(--muted)}
.chk.on .st{color:var(--text2)}
.chk.starter .st{color:var(--us)}
.chk.starter.them{background:var(--them-bg);border-color:var(--them-d)}
.chk.starter.them .st{color:var(--them-text)}

/* opponents */
.opp-list{display:flex;flex-direction:column;gap:6px}
.opp-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid transparent}
.opp-item.sel{border-color:var(--primary)}
.opp-tbl input{width:100%;padding:5px 7px;font-size:13px;background:transparent;border-color:transparent}
.opp-tbl input:hover{border-color:var(--border2)}
.opp-tbl input:focus{background:var(--card)}
.opp-tbl td{padding:3px 4px}
.opp-tbl th{text-align:left!important;padding-left:12px}
.opp-tbl input::placeholder{color:var(--muted);opacity:.45}
.prow-x{width:30px;height:30px;border-radius:8px;color:var(--muted)}
.prow-x:hover{background:var(--card2);color:var(--bad)}
.sch-tbl select{width:100%;padding:5px 6px;font-size:13px;background:transparent;border-color:transparent}
.sch-tbl select:hover{border-color:var(--border2)}
.sch-tbl input[type=checkbox]{width:auto}
.res{font-weight:600;font-size:13px;margin-right:6px}
.sch-tbl input.tbd,.sch-tbl select.tbd{color:var(--warn)}
.tlogo{width:var(--lg);height:var(--lg);object-fit:contain;flex-shrink:0;display:inline-block;vertical-align:middle}
.tlogo-ph{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--card2);color:var(--text2);font-size:calc(var(--lg) * .34);font-weight:800}
.sb-name .tlogo{margin-right:2px}
.sb-team .sb-name::before{display:none}
.bx-team .tlogo{margin-right:8px;vertical-align:-6px}
.box-team-header .tlogo{margin-right:-4px}
.sch-opp{display:flex;align-items:center;gap:8px}
.sch-opp input,.sch-opp select{flex:1;min-width:0}
.sch-box{padding:3px 10px}
.sch-event{padding-left:38px!important;font-size:11px;color:var(--text2);padding-left:8px;text-align:left}
.res.w{color:var(--good)} .res.l{color:var(--bad)}
.opp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.opp-chip{background:var(--card);border-radius:99px;padding:4px 11px;font-size:12.5px}

/* box score — the practice tracker's box score, matched: its panel colours, score box,
   pill tabs, team bars and light Torvik-style rows. */
.bx-panel{background:#1a1f2e;border:1px solid #2d3347;border-radius:16px;padding:20px 24px}
.bx-titlebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bx-title{font-size:16px;font-weight:800;color:#f8fafc}
.bx-panel select{background:#242938;font-size:12.5px;padding:5px 8px}
.bs-scorebox{text-align:center;padding:4px 0 18px;border-bottom:1px solid #2d3347;margin-bottom:16px}
.bs-scorebox-title{font-size:22px;font-weight:800;color:#f8fafc}
.bs-scorebox-date{font-size:12px;color:#fff;margin:2px 0 14px}
.bs-score-table{margin:0 auto;font-size:13px;width:auto;border-collapse:collapse}

/* Runs tab */
.rn-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.rn-kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.rn-kpi b{display:block;font-size:24px}.rn-kpi>span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.rn-t{width:100%;border-collapse:collapse;font-size:13.5px}
.rn-t th{font-size:10.5px;letter-spacing:.06em;color:var(--muted);font-weight:800;text-align:right;padding:4px 6px;white-space:nowrap}
.rn-t th:first-child,.rn-t td:first-child{text-align:left}
.rn-t td{padding:7px 6px;text-align:right;border-top:1px dashed var(--border)}
.rn-row{cursor:pointer}.rn-row.on td{background:rgba(58,155,217,.08)}
.rn-drill td{text-align:left;background:rgba(255,255,255,.02)}

.rn-sep{font-size:10.5px!important;letter-spacing:.06em;color:var(--muted);font-weight:800;text-align:left!important;padding-top:10px!important}
.rn-bar{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:13px}
.rn-bar .l{width:110px;flex:none}.rn-bar .t,.rn-bar .t0{flex:1;height:14px;border-radius:4px;background:rgba(255,255,255,.05);position:relative;overflow:hidden}
.rn-bh .t0{background:none;height:auto;font-size:10.5px;font-weight:800;letter-spacing:.06em}
.rn-bar .f{position:absolute;left:0;top:0;bottom:0;background:#d94141;border-radius:4px}.rn-bar .f.us{background:#3ecf7a}
.rn-bar .n{width:56px;text-align:right}
.rn-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.rn-2{grid-template-columns:1fr}.rn-kpis{grid-template-columns:repeat(2,1fr)}}
.rn-note{font-size:12px;color:var(--muted);margin-top:6px}
.rn-flag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;margin-left:6px;white-space:nowrap}
.rn-flag.bad{background:#d94141;color:#fff}.rn-flag.good{background:#1f8a4c;color:#fff}
.kill-near{display:block;font-size:11.5px;font-weight:800;margin-top:2px}
/* Nav: on the iPad the brand shrinks so the in-game tabs all fit without scrolling. */
@media (max-width:1100px){.brand span{display:none}.brand{margin-right:6px}.nav .tab{padding-left:10px;padding-right:10px}}
/* Situation log: chips on the play-by-play sheet, the record on Lineups. */
.sit-tag{display:inline-block;margin:1px 0 1px 4px;font-size:9.5px;font-weight:800;padding:0 5px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);white-space:nowrap}
.sit-rec{font-size:11.5px;color:var(--text2);margin-top:3px}
.sit-proven{font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:999px;background:#1f8a4c;color:#fff;margin-right:6px}
.cf-rec{margin-top:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:13px}
/* Lineup Builder (as in the practice tracker): sits above the Moorpark lineup table and drives it. */
.lu-builder{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.lu-b-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.lu-b-slots{display:flex;gap:8px;flex-wrap:wrap;flex:1}

.lu-b-slot.is-set{border-color:var(--us);font-weight:700;color:var(--text)}

/* WOWY (as in the practice tracker): solid green ON / red OFF chips; combinations that never played recede. */

.wowy-on{background:#4ade80;border:1px solid #22c55e}.wowy-off{background:#f87171;border:1px solid #ef4444}
.wowy-never td{opacity:.45}.wowy-never .wowy-chip{opacity:1}
/* One row of equal slots (5 for WOWY / a five, fewer for smaller groups). */
.lu-b-slots{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px}
.lu-b-slot{min-width:0;font-size:13px;padding:8px 6px}
.lu-fsel select{width:auto;font:inherit;font-size:14px;font-weight:700;padding:7px 10px;border-radius:8px;border:1px solid var(--us);background:var(--card);color:var(--text)}
.lu-src{width:auto;font:inherit;font-size:14px;font-weight:700;padding:7px 10px;border-radius:8px;border:1px solid var(--us);background:var(--card);color:var(--text)}
.split-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
/* Moorpark's line for the view picked, above the lineups. */
.lu-team{border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:0 0 10px;background:rgba(58,155,217,.06)}
.lu-team-r{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:4px}
.lu-team-r .go{color:var(--text2)}.lu-team-r .gd{color:var(--text2)}
/* Lineups control panel: two even rows, every control the same height and filling its cell. */
.lu-ctl{display:grid;grid-template-columns:1.25fr 1fr 1.6fr;gap:10px 12px;padding:12px;margin:0 0 12px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.lu-ctl .lu-f:nth-child(4){grid-column:1}
.lu-ctl .lu-f:nth-child(5){grid-column:2 / span 2}
.lu-f{display:flex;flex-direction:column;gap:5px;min-width:0}
.lu-l{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lu-ctl select,.lu-ctl .lu-src{width:100%;height:40px;font:inherit;font-size:14px;font-weight:700;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:var(--bg,#0d0f14);color:var(--text)}
.lu-seg{display:flex;height:40px;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.lu-seg button{flex:1;min-width:0;border:0;border-left:1px solid var(--border);background:var(--bg,#0d0f14);color:var(--text2);font:inherit;font-size:13.5px;font-weight:700;padding:0 4px;cursor:pointer;white-space:nowrap}
.lu-seg button:first-child{border-left:0}
.lu-seg button.on{background:var(--us);color:#0b1520}
.lu-seg button:disabled{opacity:.35}
@media (max-width:700px){.lu-ctl{grid-template-columns:1fr 1fr}.lu-ctl .lu-f:nth-child(3){grid-column:1 / span 2}.lu-ctl .lu-f:nth-child(4){grid-column:1}.lu-ctl .lu-f:nth-child(5){grid-column:2}}
.lut .lu-mode{font-size:10px;letter-spacing:.08em;color:var(--us);text-align:left}
.lut tr.rawonly td{font-style:italic;opacity:.7}
.lu-data{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin:0 0 12px;border:1px dashed var(--border);border-radius:10px}
/* Rotation maps */
.lu-ctl .lu-f:nth-child(3) .lu-seg button{font-size:12.5px}
.rot-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.rot-tabs{flex:1;min-width:300px}
.rot-w{display:flex;flex-direction:column;gap:4px}.rot-w .lu-seg{width:160px}
.rot{display:flex;flex-direction:column;gap:2px}
.rot-row{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:6px}
.rot-n{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rot-g{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:1px}
.rot-c{height:18px;border-radius:2px;cursor:pointer}
.rot-c.h2{box-shadow:-3px 0 0 var(--bg,#0d0f14)}
.rot-c.sel{outline:2px solid var(--us);outline-offset:-1px}
.rot-hd .rot-g div{font-size:11px;font-weight:800;color:var(--muted);text-align:center;border-bottom:1px solid var(--border);padding-bottom:2px;margin-bottom:2px}
.rot-leg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin:10px 0 4px 116px}
.rot-bar{width:200px;height:10px;border-radius:3px;background:linear-gradient(90deg,rgb(253,236,200),rgb(139,21,21))}
.rot-det{font-size:13px;margin-top:6px}
/* Player on/off cards: the practice tracker's Player On-Court Impact layout (2 x 2 on the iPad). */
.oo-imp-bar{margin:4px 0 12px}.oo-imp-note{color:var(--muted);font-size:12px}
.oo-imp-card{border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:12px;overflow:hidden}
.oo-imp-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:9px 12px;border-bottom:2px solid #f5c542}
.oo-imp-name{font-size:15px;font-weight:800;color:#fff}.oo-imp-sub{font-size:11.5px;color:#fff}
.oo-imp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px 12px 12px}
@media (min-width:1200px){.oo-imp-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.oo-imp-tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:4px;overflow:hidden}
.oo-imp-tbl thead th{background:#1a3a6e;color:#fff;padding:5px 8px;font-size:10.5px;font-weight:700;white-space:nowrap;text-align:right}
.oo-imp-tbl thead th:first-child{text-align:left}
.oo-imp-tbl tbody th{text-align:left;font-weight:600;color:#333;padding:4px 8px;border-bottom:1px solid #eee;font-size:12px;white-space:nowrap}
.oo-imp-tbl tbody td{padding:4px 8px;border-bottom:1px solid #eee;font-size:12px;text-align:right;color:#000;white-space:nowrap}
.oo-imp-tbl tbody td.oo-imp-on{font-weight:700}.oo-imp-tbl tbody td.oo-imp-diff{font-weight:800;color:#444}
.oo-imp-tbl tbody td.oo-imp-good{color:#15803d}.oo-imp-tbl tbody td.oo-imp-bad{color:#b91c1c}
/* Assist / Block ride on a shot: lit when they can be added. */
.sbtn.addready{outline:2px solid #ef4444;outline-offset:1px}
.sbtn.addon{outline:3px solid #fbbf24;outline-offset:1px}

/* THIS FIVE: the five's labels where the Team / bench row was. One line, three at most; tap one for who earned it. */
.five-lbl{position:relative;display:flex;align-items:center;min-height:40px;padding:0 8px;border:1px dashed var(--border2);border-radius:var(--r,10px)}
.five-lbl-t{position:absolute;top:-7px;left:10px;font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--muted);padding:0 5px;line-height:12px;background:var(--card)}
.five-lbl-ch{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;min-width:0}
.lc{flex:none;font:inherit;font-size:11px;font-weight:700;line-height:1;padding:5px 7px;border-radius:4px;border:1px solid;white-space:nowrap;cursor:pointer}
.lc.g{color:#4ade80;border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.10)}
.lc.r{color:#f87171;border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.10)}
.lc.n{color:var(--text2);border-color:var(--border2);background:rgba(255,255,255,.04)}
.nt-pop-h{width:100%;font-size:12px;font-weight:800;color:#1f2430;margin-bottom:2px}
.nt-pop-r{width:100%;font-size:12.5px;color:#1f2430;line-height:1.3;padding:3px 0}
.nt-pop-r+.nt-pop-r{border-top:1px solid #d3d7de}
.nt-pop-r b{display:block;font-weight:700}.nt-pop-r span{display:block;font-size:11.5px;font-weight:600;color:#4b5263;font-variant-numeric:tabular-nums}.nt-pop-r span:empty{display:none}
.lc[hidden]{display:none}

/* Rosters: an opponent's leaderboard line. */
.tm-line{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:0 0 10px;font-size:13px;color:var(--text2)}.tm-line b{color:var(--text)}
/* Schedule: teams to have ready (a tournament field). */
.rd-list{display:flex;flex-wrap:wrap;gap:6px}
.rd-grp{padding:10px 0}.rd-grp+.rd-grp{border-top:1px solid var(--border)}.rd-gh{font-size:13px;font-weight:800;margin-bottom:6px}
.rd-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 8px;border-radius:999px;border:1px solid var(--border2);font-size:13px}
.rd-chip .muted{font-size:11.5px}.rd-st{font-size:11.5px;font-weight:700}
.rd-chip.ok .rd-st{color:var(--good,#4ade80)}.rd-chip.wait .rd-st{color:var(--warn)}.rd-chip.bad .rd-st{color:var(--bad,#f87171)}
.rd-x{border:0;background:none;color:var(--muted);font-weight:800;padding:0 4px;cursor:pointer}
/* Rosters: the leaderboard's Team Stats table, copied from generate_leaderboard.py (#teamstats-content .ts-table:
   navy header, bold names, blue %Poss band rows with a navy rule, italic State Rank label, small red ranks), with
   two changes asked for here: light grey / darker grey alternating rows (a player's rank line shares his row) and
   centred numbers. Scrolls sideways with the player column pinned. */
.ts-wrap{max-width:100%;overflow-x:auto;background:#fff;border-radius:8px}
.ts-table{width:auto;min-width:100%;border-collapse:collapse;font-size:.78rem;white-space:nowrap;margin:0 auto;font-variant-numeric:tabular-nums}
.ts-table th{background:#1a1a2e;color:#fff;padding:5px 7px;text-align:center;font-size:.72rem;border-bottom:2px solid #333;font-weight:700}
.ts-table th.ts-l,.ts-table td.ts-l{text-align:left;position:sticky;left:0;z-index:1}
.ts-table td{padding:4px 7px;border-bottom:1px solid #ddd;text-align:center;color:#000;background:var(--row-light)}
.ts-table td.ts-l{font-weight:600}
.ts-table tbody tr.z td{background:var(--row-dark)}
.ts-table tbody tr.ts-band td{background:#c7d3e8;color:#122a52;font-weight:800;font-size:.76rem;text-align:left;padding:6px 8px;border-top:12px solid #fff;border-bottom:2px solid #1a3a6e}
.ts-table tbody tr.ts-band:first-child td{border-top:none}
.ts-band-l{position:sticky;left:8px;display:inline-block}   /* the band's label stays in view when the table is scrolled right */
.ts-table.ts-basic{font-size:.92rem}.ts-table.ts-basic th{font-size:.82rem;padding:7px 10px;cursor:pointer}.ts-table.ts-basic td{padding:6px 10px}
.ts-table.ts-basic th.on.desc::after{content:' ▾'}.ts-table.ts-basic th.on.asc::after{content:' ▴'}
.ts-table tbody tr.ts-hasrank td{border-bottom:none;padding-bottom:1px}
.ts-table tbody tr.ts-rankrow td{color:#c62828;font-size:.64rem;font-weight:700;padding:0 7px 4px;border-bottom:1px solid #ddd}
.ts-table td.ts-ranklabel{font-weight:700;font-style:italic}
.card[data-mode="basic"] .rs-roster,.card[data-mode="adv"] .rs-roster,.card[data-mode="basic"] [data-act="r-save"],.card[data-mode="adv"] [data-act="r-save"],.card[data-mode="basic"] [data-act="rr-add"],.card[data-mode="adv"] [data-act="rr-add"],.card[data-mode="basic"] [data-act="r-fill-lb"],.card[data-mode="adv"] [data-act="r-fill-lb"]{display:none}
.rost>.card,.rost>*{min-width:0}.card[data-mode="basic"] .rs-roster-note,.card[data-mode="adv"] .rs-roster-note{display:none}
/* On/off: the Shooting checkbox (its panel is the 5th: left column, under Core and Offense). */
.oo-imp-bar{display:flex;gap:12px;align-items:flex-start}.oo-shoot-cb{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:700;font-size:13px;padding:6px 10px;border:1px solid var(--border2);border-radius:8px;cursor:pointer}
/* On/off panels: alternating light grey / darker grey rows, like the other tables. */
.oo-imp-tbl tbody tr:nth-child(odd) th,.oo-imp-tbl tbody tr:nth-child(odd) td{background:var(--row-light)}
.oo-imp-tbl tbody tr:nth-child(even) th,.oo-imp-tbl tbody tr:nth-child(even) td{background:var(--row-dark)}
.oo-imp-tbl tbody th,.oo-imp-tbl tbody td{border-bottom-color:#c4c9d1}
/* Labels from stats: outlined (yours are filled); vetoed ones faded and struck through in the roster editor. */
.nt.auto.offd{opacity:.45;text-decoration:line-through}
.ned-auto{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.ned-auto-h{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-right:2px}
.nt-pop .nt{white-space:normal;line-height:1.3;max-width:100%}
.nt.auto.lead::before{content:'★';margin-right:3px;font-size:10px}
/* Labels guide. */
.lg-modal{max-width:760px}
.lg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;max-height:72vh;overflow:auto}
.lg-sec:first-child{grid-column:1 / -1}
.lg-h{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
.lg-row{display:flex;gap:8px;align-items:flex-start;margin:0 0 7px}.lg-row .nt{flex:none}.lg-d{font-size:12.5px;color:var(--text2);line-height:1.35}

/* KILL flash over the score bug (killFx): in fast, hold, fade; gold = ours, red = theirs. */
.kill-fx{position:fixed;z-index:60;display:flex;align-items:center;justify-content:center;pointer-events:none;border-radius:16px;animation:kfx 2.2s ease-out forwards}
.kill-fx span{display:block;font-weight:900;line-height:1;letter-spacing:.12em;padding-left:.12em;text-align:center;white-space:nowrap;text-shadow:0 0 22px currentColor,0 3px 0 rgba(0,0,0,.6)}
.kill-fx.us{color:#f5c518;background:radial-gradient(ellipse at center,rgba(70,56,8,.97),rgba(14,16,22,.96) 75%)}
.kill-fx.them{color:#ff4d4f;background:radial-gradient(ellipse at center,rgba(80,14,16,.97),rgba(14,16,22,.96) 75%)}
@keyframes kfx{0%{opacity:0;transform:scale(.86)}10%{opacity:1;transform:scale(1.05)}16%{transform:scale(1)}50%{opacity:1}100%{opacity:0}}

/* Team stats (teamStatsCard): Moorpark | stat | opponent, the better number bold. */
.ts-tbl td,.ts-tbl th{text-align:center;font-variant-numeric:tabular-nums}
.ts-tbl{table-layout:fixed}
.ts-tbl .ts-a,.ts-tbl .ts-b{width:36%;text-align:center!important}
.ts-tbl .ts-lbl{text-align:center!important}

.ts-card .tbl-wrap{max-width:560px;margin:0 auto}

/* FT Shooter: two buttons wide, above FT Make / FT Miss; once named, the shooter sits there with ✕ */

.ftsh-x{background:rgba(113,63,18,.15);border:1px solid #d97706;color:#713f12;border-radius:4px;width:34px;height:32px;font-size:16px;font-weight:800}
.ftsh-x:disabled{opacity:.35}
.ctrls.mute .btn{opacity:.2;pointer-events:none}   /* picking the FT shooter: only a player card */
/* Report: which game */
.rep-pick{display:block;width:100%;max-width:560px;margin:0 auto 10px;font-size:16px;padding:10px 12px;border-radius:8px;background:var(--card2);color:var(--text);border:1px solid var(--bd)}
/* Live after Final */
.final-panel{text-align:center;padding:28px 18px;margin-top:12px}
.final-panel .fp-h{font-size:24px;font-weight:800;margin-bottom:18px}

.sb-tags{gap:6px} .sb-tags .skunk{margin-left:0}
.between-note{max-width:900px;margin:0 auto 10px;padding:8px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);font-size:13px;color:var(--text2);text-align:center}

<script>
'use strict';
const VERSION = 'v2026.10.24.288';
const LS_GAMES = 'pt2_games', LS_CUR = 'pt2_cur', LS_ROSTER = 'pl_roster';
const FULL_TOS = 4, S30_TOS = 2;            // per team, per game (as the game tracker); +1 thirty-second per overtime

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Could not save — storage is full or blocked', 'bad'); return false; } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const slug = s => String(s || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const other = t => t === 'a' ? 'b' : 'a';
const sgn = v => v > 0 ? '+' + v : String(v);
const pmCls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : '';

let games = lsGet(LS_GAMES, []);
let curId = lsGet(LS_CUR, null);
/* The data tabs (Report, Lineups, Play-by-Play, Sheet, Four factors, Runs) show the game picked in the game list at
   their top: by default the game in progress once it has a play, else the last game played, so between games they
   keep showing it. Live, Games and Schedule only ever see the game in progress. */
const DATA_TABS = new Set(['report', 'lineups', 'pbp', 'sheet', 'ff', 'runs']);
const liveGame = () => games.find(g => g.id === curId) || null;
const cur = () => DATA_TABS.has(UI.tab) ? repGame() : liveGame();
// Saving also writes the game's situation log (sitlog.js); a problem there never stops the save.
/* EDIT STAMPS: each game carries editedAt, when its content last changed on this iPad (its situation tags aside). A
   season file or baseline keeps the most recently edited copy of a game (backup.js), so a fix made on one iPad (a
   phantom play deleted, a sub fixed) reaches the others, and an older copy never overwrites it. GSIG = each game as
   last saved here: filled when the app opens, so only real changes stamp. */
const GSIG = {};
const gsig = g => JSON.stringify(g, (k, v) => k === 'sitLog' || k === 'editedAt' ? undefined : v);
function stampEdits() { const now = new Date().toISOString(); games.forEach(g => { const s = gsig(g); if (GSIG[g.id] != null && GSIG[g.id] !== s) g.editedAt = now; GSIG[g.id] = s; }); }
const save = () => { try { stampSits(cur()); } catch (e) {} try { stampEdits(); } catch (e) {} lsSet(LS_GAMES, games); lsSet(LS_CUR, curId); try { bkTick(); } catch (e) {} };
const D0 = g => derive(g).score;
const UI = { repMin: (() => { try { return localStorage.getItem('pt2_repmin') || 'all'; } catch (e) { return 'all'; } })(), luFilter: 'hm', tab: 'live', stat: null, reb: null, rosterSel: null, pbpTeam: 'all', ins: null, redo: [], sheetPer: null, luScope: 'season', luOpen: null, ooShoot: (() => { try { return localStorage.getItem('pt2_oo_shoot') === 'true'; } catch (e) { return false; } })() };

/* ---------- rosters ---------- */
// Moorpark: this tracker's own list if one was saved, else the game tracker's (same site, same storage),
// else the roster built in (the same locked list as the game tracker's), so it is never empty on a new iPad.
const SEED_ROSTER = [['Josh Castaniero', '1'], ['Quian Khawaja', '2'], ['Eric Kubel', '3'], ['Axel Ostergard', '4'], ['Ashton Carraway', '5'],
  ['Brenden Banks-Speed', '10'], ['SoulJah Niles', '12'], ['Emmitt Claiborne', '14'], ['Matthew Wilson', '15'], ['Alex Bello', '20'],
  ['George Hees', '21'], ['Jaylen Smith', '22'], ['Sean Castro', '31'], ['Finn Ortiz', '32'], ['Jack Johnson', '30']].map(([name, num]) => ({ num, name, note: '' }));
function roster() {
  const own = lsGet(LS_ROSTER, null);
  if (Array.isArray(own) && own.length) return own;
  const gt = (lsGet('gt_roster', []) || []).filter(r => r && r.name && !r.hidden).map(r => ({ num: String(r.num || ''), name: r.name, note: '' }));
  return gt.length ? gt : SEED_ROSTER.map(r => Object.assign({}, r));
}
// Jersey order: 0, 00, 1, 2 … (no number last). parseInt('0') is 0, so it can't be an "|| 999" fallback.
const numKey = n => { const s = String(n == null ? '' : n).trim(); return /^\d+$/.test(s) ? parseInt(s, 10) + (s.length > 1 && /^0+$/.test(s) ? 0.5 : 0) : 999; };
const byNum = (a, b) => numKey(a.num) - numKey(b.num) || String(a.name).localeCompare(b.name);
const lastName = n => String(n).split(' ').slice(-1)[0];
// Players are keyed by name for Moorpark and by 'o:<num>' for the opponent.
function teamPlayers(g, t) {
  return t === 'a' ? roster().filter(r => !g || !g.dressed || g.dressed.includes(r.name)).slice().sort(byNum).map(r => ({ id: r.name, num: r.num, name: r.name, pos: r.pos || '', note: r.note || '' }))
    : (g.oppRoster || []).slice().sort(byNum).map(r => ({ id: 'o:' + r.num, num: r.num, name: r.name || '', pos: r.pos || '', ht: r.ht || '', yr: r.yr || '', note: r.note || '' }));
}
function pInfo(g, t, id) {
  if (!id || id === 'TEAM') return { id: 'TEAM', num: '', name: 'Team' };
  return teamPlayers(g, t).find(p => p.id === id) || { id, num: t === 'b' ? String(id).slice(2) : '', name: t === 'a' ? id : '' };
}
const pShort = (g, t, id) => { const p = pInfo(g, t, id); if (p.id === 'TEAM') return 'Team'; return (p.num ? '#' + p.num + ' ' : '') + (p.name ? lastName(p.name) : ''); };
const fiveKey = f => f.slice().sort().join('|');
const fiveSorted = (g, t, f) => f.slice().sort((x, y) => byNum(pInfo(g, t, x), pInfo(g, t, y)));
const teamName = (g, t) => t === 'a' ? 'Moorpark' : g.opp;
const teamAbbr = (g, t) => t === 'a' ? 'MPK' : (g.opp || 'OPP').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase();
function oppNames() {
  const s = new Set();
  (lsGet('gt_opp_rosters', []) || []).forEach(o => o && o.name && s.add(o.name));
  (lsGet('gt_schedule', []) || []).forEach(r => r && r.opp && !/^tbd$/i.test(r.opp) && s.add(r.opp));
  games.forEach(g => g.opp && s.add(g.opp));
  return [...s].sort();
}
function gtOppRoster(name) {
  const o = (lsGet('gt_opp_rosters', []) || []).find(x => x && x.name && x.name.toLowerCase() === String(name).toLowerCase());
  return o ? (o.players || []).filter(p => p.num !== '' && p.num != null).map(p => ({ num: String(p.num), name: p.name || '', pos: p.pos || '', ht: p.ht || '', yr: p.yr || '', note: p.note || '' })) : [];
}

/* ---------- schedule: the game tracker's, else the posted 2026-27 schedule ---------- */
const SEED_SCHEDULE = [
  { id: 'sch_seed_20261015', date: '2026-10-15', time: "", opp: "Mack Attack Prep", site: 'home', conf: false, scrim: true },
  { id: 'sch_seed_20261022', date: '2026-10-22', time: "", opp: "Santa Monica", site: 'home', conf: false, scrim: true },

/* Their best five (2nd half and OT only): the opponent five with the best net rating over the game,
   among fives with 8+ possessions. Tagged on their lineup card whenever it is on the floor. */

  if (g.per === '1H') return null;
  const u = lineupUnits(g, D, 'b', 'game', 'all').units.map(u => Object.assign({ poss: Math.floor((u.oPoss + u.dPoss) / 2),
    net: u.oPoss && u.dPoss ? 100 * u.pf / u.oPoss - 100 * u.pa / u.dPoss : null }, u)).filter(u => u.net != null && u.poss >= 8)
    .sort((x, y) => y.net - x.net || (y.pf - y.pa) - (x.pf - x.pa))[0];

}
const theirBestOn = (g, D) => { const B = theirBest(g, D); return B && D.five.b.length === 5 && fiveKey(B.five) === fiveKey(D.five.b) ? B : null; };
/* LINEUP TIP (our card, the last 25% of the game = the last 10:00 of regulation, or OT): when the five on the floor

   8+ possessions and nobody fouled out. Four-factor edge = Dean Oliver's weights on (ours - theirs) with that five on:
   eFG% 40, TO% 25 (lower is better), OReb% 20, FT rate 15. No five that qualifies and wins the factors: no button. */
/* 💡 Try: in the last 10:00 (and OT), when the five on is at a net of 0 or worse (garbage time out), the button
   opens the same lineup card as the halftime report, built for now: the best fives overall (four-factor edge)
   and for whatever is hurting us this half, today's beside the season's (opponent-adjusted), at a leverage
   that opens on High. No five qualifies anywhere, no button. */
// 💡 Try's window: the last 10:00 of the 2nd half, and overtime (not the 1st half, not a finished game).

  const N = gradeNow(g, D); return !!N && N.secs != null && N.secs <= 600;
}

  const u = lineupUnits(g, D, 'a', 'game', 'nogt').units.find(x => fiveKey(x.five) === fiveKey(D.five.a)); if (!u) return null;
  const net = u.oPoss && u.dPoss ? Math.round(10 * (100 * u.pf / u.oPoss - 100 * u.pa / u.dPoss)) / 10 : null;
  return net == null || net > 0 ? null : { five: u.five, net, poss: Math.floor((u.oPoss + u.dPoss) / 2), v: fixVals(u.o, u.d, u.oPoss, u.dPoss) };
}
function lineupTip(g, D) {

const TIP_OPTS = { ffSc: '2H', todayPer: 'game', sk: 'tipScope', def: 'hm', half: 'this half', overall: true, sub: true };
function lpmCard(g, D, t) {

  const o = rtg(u.pf, u.oPoss), d = rtg(u.pa, u.dPoss), net = typeof o === 'number' && typeof d === 'number' ? Math.round(10 * (o - d)) / 10 : null, pm = u.pf - u.pa;

  if (!rows.some(x => x.kind === 'poss')) return '<div class="muted small" style="padding:14px">No possessions this period yet.</div>';
  const cols = ['2', '3', 'FT', 'x2', 'x3', 'xFT', 'TO'];
  let h = `<table class="psheet"><thead><tr><th>#</th><th>TEAM</th>${cols.map(c => `<th class="${c[0] === 'x' ? 'x' : ''}">${{ x2: '✗2', x3: '✗3', xFT: '✗FT' }[c] || c}</th>`).join('')}<th class="st">REB</th><th class="st">STL</th><th>PTS</th><th class="kl">KILL</th><th>SCORE</th><th>LEV</th></tr></thead><tbody>`;
  for (const x of rows) {
    if (x.kind === 'sub') { h += `<tr class="lu ${x.e.team}"><td colspan="15">⇄ ${esc(teamName(g, x.e.team))}: ${esc(fiveSorted(g, x.e.team, x.e.five).map(id => pShort(g, x.e.team, id)).join(' · '))}</td></tr>`; continue; }
    if (x.kind === 'tech') { h += `<tr class="tch"><td colspan="15">T · ${esc(techText(g, x.e))} · ${x.score.a}–${x.score.b}</td></tr>`; continue; }
    const p = x.p;
    if (p.gtStart) { h += `<tr class="gtl"><td colspan="15">🗑 Garbage time from here — ${p.before.a}–${p.before.b}, up ${Math.abs(p.before.a - p.before.b)}${p.clockSecs != null ? ` with ${fmtSecs(p.clockSecs)} on the clock` : ''}${g.gtFrom ? ' (set by hand)' : ''}</td></tr>`; }
    const en = p.end, last = p.plays.filter(e => e.k !== 'oreb' && e.k !== 'dreb').slice(-1)[0] || p.plays[0];
    const c = col => {
      if (en.col !== col && !((col === 'FT') && en.ft && (en.col === '2' || en.col === '3') && en.and1)) return '<td></td>';
      if (col === 'FT' || col === 'xFT') return `<td class="m ${col === 'xFT' ? 'mx' : ''}">${esc(en.ft || '●')}</td>`;
      if (col === 'TO') return '<td class="m">●</td>';
      return `<td class="m ${col[0] === 'x' ? 'mx' : ''}">●${(col === '2' || col === '3') && en.and1 ? '<span class="tiny">+1</span>' : ''}</td>`;
    };
    const toCol = ['TO', 'STL', 'CHG', 'OFF'].includes(en.col) ? '<td class="m">●' + (en.col !== 'TO' && en.col !== 'STL' ? `<span class="tiny">${en.col}</span>` : '') + '</td>' : '<td></td>';
    h += `<tr class="${p.kill ? 'kill-' + other(p.team) : ''} ${p.gt ? 'gtr' : ''}" data-act="edit" data-id="${p.plays[p.plays.length - 1].id}"><td class="pn">${p.seq}${p.plays.some(e => e.flag) ? '<span title="Flagged">🚩</span>' : ''}</td><td class="tm ${p.team}">${esc(teamAbbr(g, p.team))}${p.oreb ? `<div class="tiny" style="color:#fff">${p.oreb} OREB</div>` : ''}</td>
${['2', '3', 'FT', 'x2', 'x3', 'xFT'].map(c).join('')}${toCol}
      <td class="m ms">${p.dreb ? '●' : ''}</td><td class="m ms">${en.col === 'STL' ? '●' : ''}</td><td class="pts">${p.pts || '<span class="tiny">0</span>'}</td><td class="kill">${p.dead ? 'DS' : p.skunk ? 'S' : p.kill ? 'K' : ''}</td><td class="sc">${p.score.a}–${p.score.b}</td><td class="lv">${p.gt ? '<span class="lvg">GT</span>' : `<span class="lv-${p.lev}">${(LEV_LABEL[p.lev] || '')[0] || ''}</span>${p.clutch ? '<span class="lvc">C</span>' : ''}`}${sitTagsHtml(g, p)}</td></tr>`;

function summaryTable(g, D) {

function killsCard(g, D, scope) {

    ${RL.length ? `<div class="tbl-wrap" style="margin-top:12px"><table class="tbl zebra sumt runt"><thead><tr><th>RUN</th><th>BY</th><th>HALF</th><th>SCORE</th><th>MOORPARK FIVE AT THE START</th></tr></thead><tbody>

/* Best lineups: each team's fives ranked by net rating, among those with enough possessions to
   mean something (5 at the half, 8 for the game; fewer only if no five has that many). */
function bestLineups(g, D, t, scope, n) {
  const units = lineupUnits(g, D, t, scope, 'all').units.map(u => Object.assign({ poss: Math.floor((u.oPoss + u.dPoss) / 2),
    net: u.oPoss && u.dPoss ? 100 * u.pf / u.oPoss - 100 * u.pa / u.dPoss : null }, u)).filter(u => u.net != null);
  let min = scope === 'game' ? 8 : 5;
  while (min > 1 && !units.some(u => u.poss >= min)) min--;
  return { min, list: units.filter(u => u.poss >= min).sort((x, y) => y.net - x.net || (y.pf - y.pa) - (x.pf - x.pa)).slice(0, n || 3) };
}
/* Best 2-, 3- and 4-man combos: every pair / trio inside the five on the floor shares that possession, so
   a combo's sample adds up across the lineups it was part of. 20+ possessions together to qualify. */
const COMBO_MIN = 20;
function kSubsets(arr, k) { const out = []; const rec = (i, cur) => { if (cur.length === k) { out.push(cur.slice()); return; } for (let j = i; j < arr.length; j++) { cur.push(arr[j]); rec(j + 1, cur); cur.pop(); } }; rec(0, []); return out; }
function bestCombos(g, D, t, k, scope) {
  const m = {}, add = (f, o, d, pf, pa) => kSubsets(f.slice().sort(), k).forEach(c => { const key = c.join('|'), u = m[key] = m[key] || { ids: c, oPoss: 0, dPoss: 0, pf: 0, pa: 0 }; u.oPoss += o; u.dPoss += d; u.pf += pf; u.pa += pa; });
  D.poss.forEach(p => { if (scope !== 'game' && p.per !== scope) return; const f = p.five[t]; if (!f || f.length !== 5) return;
    if (p.team === t) add(f, 1, 0, p.pts, 0); else add(f, 0, 1, 0, p.pts); });
  D.items.filter(x => x.kind === 'tech' && (scope === 'game' || x.e.per === scope)).forEach(x => { const f = x.five[t]; if (!f || f.length !== 5) return;
    if (x.e.team === t) add(f, 0, 0, 0, x.e.ftm || 0); else add(f, 0, 0, x.e.ftm || 0, 0); });
  return Object.values(m).map(u => Object.assign(u, { poss: Math.floor((u.oPoss + u.dPoss) / 2), net: u.oPoss && u.dPoss ? 100 * u.pf / u.oPoss - 100 * u.pa / u.dPoss : null }))
    .filter(u => u.net != null && u.poss >= COMBO_MIN).sort((x, y) => y.net - x.net || (y.pf - y.pa) - (x.pf - x.pa) || x.ids.join().localeCompare(y.ids.join()))
    // Combos that were always on together have identical numbers: one row each, with a count of the rest.
    .reduce((out, u) => { const sig = [u.oPoss, u.dPoss, u.pf, u.pa].join(), hit = out.find(x => x.sig === sig);
      if (hit) hit.same++; else if (out.length < 3) out.push(Object.assign(u, { sig, same: 0 })); return out; }, []);
}
function combosCard(g, D, scope) {
  const name = (t, id) => { const p = pInfo(g, t, id); return (p.num ? '#' + p.num + ' ' : '') + (p.name ? lastName(p.name) : ''); };
  const side = t => `<div class="bl ${t}"><div class="ks-lbl" style="color:${t === 'a' ? 'var(--us)' : 'var(--them-text)'}">${esc(teamName(g, t))}</div>
    ${[2, 3, 4].map(k => { const L = bestCombos(g, D, t, k, scope);
      return `<div class="small muted" style="margin:6px 0 2px;font-weight:700;letter-spacing:.06em">${k}-MAN</div>` + (L.length ? L.map((u, i) => `<div class="bl-row"><div class="bl-rank">${i + 1}</div>
        <div class="bl-five"><b>${esc(u.ids.slice().sort((x, y) => byNum(pInfo(g, t, x), pInfo(g, t, y))).map(id => name(t, id)).join(' · '))}</b>${u.same ? `<div class="tiny muted">+${u.same} more ${k}-man combo${u.same > 1 ? 's' : ''} with the same numbers</div>` : ''}</div>
        <div class="bl-st"><b class="${pmCls(Math.round(10 * u.net) / 10)}">${sg1(Math.round(10 * u.net) / 10)}</b><span>net</span></div><div class="bl-st"><b class="${pmCls(u.pf - u.pa)}">${sgn(u.pf - u.pa)}</b><span>+/-</span></div><div class="bl-st"><b>${u.poss}</b><span>poss</span></div></div>`).join('')
        : `<div class="small muted">No ${k}-man combo with ${COMBO_MIN}+ possessions.</div>`); }).join('')}</div>`;
  return `<div class="ks-grid">${side('a')}${side('b')}</div><div class="small muted" style="margin-top:6px">Ranked by net rating among combos on the floor together for ${COMBO_MIN}+ possessions. One game is a small sample: under ~40 possessions a net rating can be off by ±25 or more by chance.</div>`;
}
function bestCard(g, D, scope) {

    return `<div class="bl ${t}"><div class="ks-lbl" style="color:${t === 'a' ? 'var(--us)' : 'var(--them-text)'}">${esc(teamName(g, t))} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">· ${B.min}+ possessions</span></div>
      ${B.list.length ? B.list.map((u, i) => { const f = fiveSorted(g, t, u.five);
        return `<div class="bl-row"><div class="bl-rank">${i + 1}</div><div class="bl-five"><b>${f.map(id => esc(pInfo(g, t, id).num || '—')).join(' · ')}</b><div class="tiny muted">${esc(f.map(id => pInfo(g, t, id).name ? lastName(pInfo(g, t, id).name) : '#' + pInfo(g, t, id).num).join(', '))}</div></div>
          <div class="bl-st"><b class="${pmCls(Math.round(10 * u.net) / 10)}">${sg1(Math.round(10 * u.net) / 10)}</b><span>net</span></div><div class="bl-st"><b class="${pmCls(u.pf - u.pa)}">${sgn(u.pf - u.pa)}</b><span>+/-</span></div><div class="bl-st"><b>${u.poss}</b><span>poss</span></div></div>`; }).join('')
        : '<div class="small muted">Not enough possessions yet.</div>'}</div>`; };

/* ---------- team stats: every basic stat the tracker logs, both teams, plus the advanced numbers ----------
   From the tracked plays (the same counts as the four factors: ffTracked), for a scope: '1H', '2H' (2nd half + OT) or
   'G'. On the halftime and post-game reports (with or without a stat sheet) and in the Huddle, so "how many offensive
   rebounds do they have" is one glance. The better number in each row is bold. */
function teamStats(g, D, sc) {
  const pers = ffPers(g, sc), T = ffTracked(g, sc), L = D.poss.filter(p => pers.includes(p.per)), X = {};
  ['a', 'b'].forEach(t => { const o = other(t), mine = L.filter(p => p.team === t), B = mine.map(possBox);
    const sum = k => B.reduce((x, b) => x + b[k], 0);
    let pot = 0; L.forEach((p, i) => { if (p.team !== o || !['TO', 'STL', 'CHG', 'OFF'].includes(p.end.col)) return; const nx = L[i + 1]; if (nx && nx.team === t && nx.per === p.per) pot += nx.pts; });
    X[t] = Object.assign({}, T[t], { pts: mine.reduce((x, p) => x + p.pts, 0), n: mine.length, ast: sum('ast'), sc2: sum('sc2'), pot,
      blk: L.filter(p => p.team === o).map(possBox).reduce((x, b) => x + b.blkd, 0), stl: T[o].stov,
      pf: g.ev.filter(e => e.t === 'foul' && e.team === t && pers.includes(e.per)).length }); });
  return X;
}
function teamStatsCard(g, D, sc, label, X0, names) {
  const X = X0 || teamStats(g, D, sc), pc = (n, d) => d ? 100 * n / d : null, P = v => v == null ? '—' : v.toFixed(1) + '%';
  const md = (m, a) => `${m}-${a}`;
  // Rows: label, value for a team (shown), the number compared (null = no comparison), higher is better. Each
  // percentage on its own row under its makes-attempts; no section headers.
  const shot = (lbl, m, a) => [[lbl, t => md(m(t), a(t)), t => m(t), true], [lbl + '%', t => P(pc(m(t), a(t))), t => pc(m(t), a(t)), true]];
  const rows = [
    ['Points', t => X[t].pts, t => X[t].pts, true],
    ...shot('FG', t => X[t].fgm, t => X[t].fga),
    ...shot('2PT', t => X[t].fgm - X[t].fg3m, t => X[t].fga - X[t].fg3a),
    ...shot('3PT', t => X[t].fg3m, t => X[t].fg3a),
    ['eFG%', t => P(pc(X[t].fgm + 0.5 * X[t].fg3m, X[t].fga)), t => pc(X[t].fgm + 0.5 * X[t].fg3m, X[t].fga), true],
    ...shot('FT', t => X[t].ftm, t => X[t].fta),
    ['TS%', t => P(pc(X[t].pts, 2 * (X[t].fga + 0.44 * X[t].fta))), t => pc(X[t].pts, 2 * (X[t].fga + 0.44 * X[t].fta)), true],
    ['Offensive rebounds', t => X[t].oreb, t => X[t].oreb, true],
    ['Defensive rebounds', t => X[t].dreb, t => X[t].dreb, true],
    ['Total rebounds', t => X[t].oreb + X[t].dreb, t => X[t].oreb + X[t].dreb, true],
    ['Assists', t => X[t].ast, t => X[t].ast, true],
    ['Steals', t => X[t].stl, t => X[t].stl, true],
    ['Blocks', t => X[t].blk, t => X[t].blk, true],
    ['Turnovers', t => X[t].tov, t => X[t].tov, false],
    // A team's own turnovers that weren't the other side's steals (dead balls, travels, offensive fouls...).
    ['Non-steal turnovers', t => Math.max(0, X[t].tov - (X[t].stov || 0)), t => Math.max(0, X[t].tov - (X[t].stov || 0)), false],
    ['Fouls', t => X[t].pf, t => X[t].pf, false],
    ['Possessions', t => X[t].n, null],
    ['Points per possession', t => X[t].n ? (X[t].pts / X[t].n).toFixed(2) : '—', t => X[t].n ? X[t].pts / X[t].n : null, true],
    ['TO%', t => P(pc(X[t].tov, X[t].n)), t => pc(X[t].tov, X[t].n), false],
    ['OREB%', t => P(pc(X[t].oreb, X[t].oreb + X[other(t)].dreb)), t => pc(X[t].oreb, X[t].oreb + X[other(t)].dreb), true],
    ['DREB%', t => P(pc(X[t].dreb, X[t].dreb + X[other(t)].oreb)), t => pc(X[t].dreb, X[t].dreb + X[other(t)].oreb), true],
    ['FT rate', t => P(pc(X[t].fta, X[t].fga)), t => pc(X[t].fta, X[t].fga), true],
    ['3PA rate', t => P(pc(X[t].fg3a, X[t].fga)), null],
    ['2nd-chance points', t => X[t].sc2, t => X[t].sc2, true],
    ['Points off turnovers', t => X[t].pot, t => X[t].pot, true]];
  // Moorpark always on the left, the stat in the middle, the opponent on the right.
  const body = rows.map(r => { const [lbl, show, val, hi] = r, va = val ? val('a') : null, vb = val ? val('b') : null;
    const win = va == null || vb == null || va === vb ? '' : (va > vb) === hi ? 'a' : 'b';

  return `<div class="card ts-card"><h3>Team stats <span class="muted">· ${esc(label)}, from the tracked plays</span></h3><div class="tbl-wrap"><table class="tbl rep-tbl zebra ts-tbl">

/* Free throws & fouls by player, from the logged plays (the shooter and fouler you tapped), so it's there live

/* ---------- play-by-play: everything, in order ---------- */
/* CHECK GAME: plays that don't fit who had the ball, so a possession silently went missing or a stat went to the
   wrong side. Who has the ball after a play: a make, a last made FT, a turnover, a charge or an offensive foul = the
   other team; a rebound or a steal = that team; a miss = loose (nothing checked). Subs, timeouts, clock, fouls and
   technicals don't move it; a new period starts unknown. Shown live as a warning toast and listed at the top of
   Play-by-Play (tap to fix, or OK to keep a play that really happened, e.g. a loose-ball foul in the bonus). Also a
   game clock set later than the one before it in the same period. */

  const e = g.ev[i]; if (!e || e.chkOk || e.auto) return null;
