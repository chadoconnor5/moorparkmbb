<!DOCTYPE html><html><head><meta charset="utf-8"><title>Zone Debug</title>
<style>body{background:#111;padding:20px;display:flex;gap:20px;flex-wrap:wrap;color:white;font-family:sans-serif;}</style>
</head><body>
<div><h3 style="margin:0 0 4px">Static SVG — all zones outlined</h3>
<svg viewBox="0 0 500 485" width="360" height="350">
  <rect x="10" y="20" width="480" height="440" fill="#111827"/>
  <path d="M 10 20 L 490 20 L 490 282 L 412 282 A 207 207 0 0 0 88 282 L 10 282 Z" fill="rgba(100,150,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <path d="M 88 282 A 207 207 0 0 1 412 282 Z" fill="rgba(100,255,100,0.25)" stroke="lime" stroke-width="2"/>
  <path d="M 10 282 L 88 282 A 207 207 0 0 0 44 391 L 10 391 Z" fill="rgba(255,200,0,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <path d="M 412 282 L 490 282 L 490 391 L 456 391 A 207 207 0 0 0 412 282 Z" fill="rgba(255,200,0,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <path d="M 10 391 L 44 391 L 44 460 L 10 460 Z" fill="rgba(255,100,100,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <path d="M 456 391 L 490 391 L 490 460 L 456 460 Z" fill="rgba(255,100,100,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <path d="M 194 282 L 88 282 A 207 207 0 0 0 44 391 L 44 460 L 194 460 Z" fill="rgba(200,100,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <path d="M 306 282 L 412 282 A 207 207 0 0 0 456 391 L 456 460 L 306 460 Z" fill="rgba(200,100,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <path d="M 194 282 L 306 282 L 306 460 L 194 460 Z" fill="rgba(255,180,50,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <path d="M 213 411 A 37 37 0 0 1 287 411 L 287 460 L 213 460 Z" fill="rgba(255,50,50,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <!-- court lines on top -->
  <line x1="44" y1="460" x2="44" y2="391" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <line x1="456" y1="460" x2="456" y2="391" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <path d="M 44 391 A 207 207 0 0 1 456 391" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <rect x="194" y="282" width="112" height="178" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <path d="M 213 411 A 37 37 0 0 1 287 411" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <path d="M 194 282 A 56 56 0 0 1 306 282" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="10" y1="460" x2="490" y2="460" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <line x1="10" y1="20" x2="10" y2="460" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <line x1="490" y1="20" x2="490" y2="460" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <line x1="10" y1="20" x2="490" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="222" y1="423" x2="278" y2="423" stroke="rgba(255,255,255,0.6)" stroke-width="5"/>
  <circle cx="250" cy="411" r="9" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <!-- zone labels -->
  <text x="250" y="165" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)" font-family="sans-serif">ab3</text>
  <text x="250" y="248" text-anchor="middle" font-size="11" fill="lime" font-family="sans-serif">mr_mid ← NEW</text>
  <text x="42" y="338" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)" font-family="sans-serif">w3L</text>
  <text x="458" y="338" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.7)" font-family="sans-serif">w3R</text>
  <text x="27" y="428" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)" font-family="sans-serif">c3L</text>
  <text x="473" y="428" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)" font-family="sans-serif">c3R</text>
  <text x="115" y="370" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)" font-family="sans-serif">mr_left</text>
  <text x="385" y="370" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)" font-family="sans-serif">mr_right</text>
  <text x="250" y="363" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)" font-family="sans-serif">paint</text>
  <text x="250" y="445" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)" font-family="sans-serif">ra</text>
</svg>
</div>

<div><h3 style="margin:0 0 4px">JS-rendered — zone map with test shots</h3>
<div id="out"></div>
</div>

<script>
const ZONE_POLYGONS = {
  ra:       'M 213 411 A 37 37 0 0 1 287 411 L 287 460 L 213 460 Z',
  paint:    'M 194 282 L 306 282 L 306 460 L 194 460 Z',
  mr_mid:   'M 88 282 A 207 207 0 0 1 412 282 Z',
  mr_left:  'M 194 282 L 88 282 A 207 207 0 0 0 44 391 L 44 460 L 194 460 Z',
  mr_right: 'M 306 282 L 412 282 A 207 207 0 0 0 456 391 L 456 460 L 306 460 Z',
  c3_left:  'M 10 391 L 44 391 L 44 460 L 10 460 Z',
  c3_right: 'M 456 391 L 490 391 L 490 460 L 456 460 Z',
  w3_left:  'M 10 282 L 88 282 A 207 207 0 0 0 44 391 L 10 391 Z',
  w3_right: 'M 412 282 L 490 282 L 490 391 L 456 391 A 207 207 0 0 0 412 282 Z',
  ab3:      'M 10 20 L 490 20 L 490 282 L 412 282 A 207 207 0 0 0 88 282 L 10 282 Z',
};
const ZONE_LABEL_PTS = {
  ra:[250,443], paint:[250,370], mr_mid:[250,248],
  mr_left:[115,375], mr_right:[385,375],
  c3_left:[27,435], c3_right:[473,435],
  w3_left:[42,338], w3_right:[458,338], ab3:[250,165],
};
const testShots = [
  {stat:'2fg_make',zone:'ra'},{stat:'2fg_miss',zone:'ra'},{stat:'2fg_make',zone:'ra'},
  {stat:'2fg_make',zone:'paint'},{stat:'2fg_miss',zone:'paint'},
  {stat:'2fg_make',zone:'mr_mid'},{stat:'2fg_miss',zone:'mr_mid'},{stat:'2fg_miss',zone:'mr_mid'},
  {stat:'2fg_miss',zone:'mr_left'},{stat:'2fg_make',zone:'mr_left'},{stat:'2fg_miss',zone:'mr_left'},
  {stat:'2fg_make',zone:'mr_right'},{stat:'2fg_make',zone:'mr_right'},
  {stat:'3fg_make',zone:'c3_left'},{stat:'3fg_miss',zone:'c3_left'},
  {stat:'3fg_make',zone:'c3_right'},
  {stat:'3fg_make',zone:'w3_left'},{stat:'3fg_miss',zone:'w3_left'},
  {stat:'3fg_miss',zone:'w3_right'},{stat:'3fg_make',zone:'w3_right'},
  {stat:'3fg_make',zone:'ab3'},{stat:'3fg_miss',zone:'ab3'},{stat:'3fg_miss',zone:'ab3'},
];
function _zoneColor(pct){const t=Math.max(0,Math.min(100,pct));let r,g,b;if(t<=40){const f=t/40;r=Math.round(29+(255-29)*f);g=Math.round(78+(255-78)*f);b=Math.round(216+(255-216)*f);}else{const f=(t-40)/60;r=Math.round(255+(220-255)*f);g=Math.round(255+(38-255)*f);b=Math.round(255+(38-255)*f);}return `rgb(${r},${g},${b})`;}
function _zoneTextColor(pct){return Math.abs(pct-40)<15?'#1a1a2e':'#ffffff';}
const ORDERED=['ab3','w3_left','w3_right','c3_left','c3_right','mr_mid','mr_left','mr_right','paint','ra'];
const paths=ORDERED.map(zone=>{
  const poly=ZONE_POLYGONS[zone];
  const z=testShots.filter(ev=>ev.zone===zone);
  const made=z.filter(ev=>ev.stat==='2fg_make'||ev.stat==='3fg_make').length;
  const att=z.length;
  if(att===0)return `<path d="${poly}" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>`;
  const pct=Math.round(100*made/att);
  const col=_zoneColor(pct);const tc=_zoneTextColor(pct);
  const[cx,cy]=ZONE_LABEL_PTS[zone];
  const isC=zone==='c3_left'||zone==='c3_right';
  return `<path d="${poly}" fill="${col}" fill-opacity="0.85" stroke="rgba(0,0,0,0.15)" stroke-width="1"/><text x="${cx}" y="${cy-7}" text-anchor="middle" font-size="${isC?11:13}" font-weight="800" fill="${tc}" font-family="sans-serif">${pct}%</text><text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="${isC?9:10}" fill="${tc}" fill-opacity="0.7" font-family="sans-serif">${made}/${att}</text>`;
}).join('');
const MARKS=`<rect x="194" y="282" width="112" height="178" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><line x1="194" y1="282" x2="306" y2="282" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><path d="M 194 282 A 56 56 0 0 1 306 282" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><path d="M 213 411 A 37 37 0 0 1 287 411" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/><line x1="44" y1="460" x2="44" y2="391" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/><line x1="456" y1="460" x2="456" y2="391" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/><path d="M 44 391 A 207 207 0 0 1 456 391" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/><line x1="10" y1="460" x2="490" y2="460" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/><line x1="10" y1="20" x2="490" y2="20" stroke="rgba(255,255,255,0.3)" stroke-width="1"/><line x1="10" y1="20" x2="10" y2="460" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><line x1="490" y1="20" x2="490" y2="460" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><line x1="222" y1="423" x2="278" y2="423" stroke="rgba(255,255,255,0.5)" stroke-width="5"/><circle cx="250" cy="411" r="9" fill="none" stroke="#d97706" stroke-width="2.5"/>`;
document.getElementById('out').innerHTML=`<svg viewBox="0 0 500 485" width="360" height="350"><rect x="10" y="20" width="480" height="440" fill="#111827"/>${paths}${MARKS}</svg>`;
</script>
</body></html>
